const STRUCT_H = { house: 12, market: 8, shipwright: 14, hut: 8, tent: 6, fort: 18, tavern: 11, church: 16, shack: 9, lighthouse: 42 };
const WALL_COL = { house: '#e8dcc0', market: '#7a5230', shipwright: '#6a4a2c', hut: '#9a7240', tent: '#c9b38a', fort: '#8a8780', tavern: '#d8c8a0', church: '#e6e0d2', shack: '#6a5236', lighthouse: '#edebe6' };
function drawStructDyn(is, st){
  const wx = is.x + st.x, wy = is.y + st.y, h = STRUCT_H[st.kind] || 12;
  const [ox, oy] = lean(wx, wy, h);
  if (st.kind === 'lighthouse'){
    // 1. Long directional shadow cast on ground and sea
    ctx.fillStyle = 'rgba(0,16,28,0.36)';
    const shDist = h * 0.85;
    const shx = wx + shDist * 0.55, shy = wy + shDist * 0.70;
    ctx.beginPath();
    ctx.moveTo(wx - 9, wy);
    ctx.lineTo(shx - 3.5, shy);
    ctx.arc(shx, shy, 5, Math.PI, 0);
    ctx.lineTo(wx + 9, wy);
    ctx.closePath();
    ctx.fill();

    // 2. Heavy circular stone foundation apron with steps
    ctx.fillStyle = 'rgba(10,20,25,0.4)';
    ell(wx, wy, 15, 12);
    ctx.fillStyle = '#65635e';
    ell(wx, wy, 13, 10);
    ctx.strokeStyle = '#3e3d3a'; ctx.lineWidth = 0.8; ctx.stroke();
    ctx.fillStyle = '#3a2010';
    ctx.fillRect(wx - 2.5, wy + 2, 5, 6);

    // 3. Tapering 3D tower shaft with alternating nautical red & white bands
    const bands = 5;
    const rBase = 9.0, rTop = 5.8;
    for (let b = 0; b < bands; b++){
      const u0 = b / bands, u1 = (b + 1) / bands;
      const h0 = u0 * h * 0.82, h1 = u1 * h * 0.82;
      const [ox0, oy0] = lean(wx, wy, h0), [ox1, oy1] = lean(wx, wy, h1);
      const rad0 = rBase * (1 - u0) + rTop * u0;
      const rad1 = rBase * (1 - u1) + rTop * u1;
      const x0 = wx + ox0, y0 = wy + oy0;
      const x1 = wx + ox1, y1 = wy + oy1;
      
      const isRed = (b % 2 === 1);
      const colBase = isRed ? '#ba201c' : '#edebe6';
      const colShade = isRed ? '#70100d' : '#8a8882';
      const colLit = isRed ? '#e83832' : '#ffffff';

      const tg = ctx.createLinearGradient(x0 - rad0, y0, x0 + rad0, y0);
      tg.addColorStop(0, colShade);
      tg.addColorStop(0.35, colBase);
      tg.addColorStop(0.85, colLit);
      tg.addColorStop(1, colShade);

      ctx.fillStyle = tg;
      ctx.beginPath();
      ctx.moveTo(x0 - rad0, y0);
      ctx.lineTo(x1 - rad1, y1);
      ctx.lineTo(x1 + rad1, y1);
      ctx.lineTo(x0 + rad0, y0);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = 'rgba(20,20,20,0.25)'; ctx.lineWidth = 0.4; ctx.stroke();
    }

    // 4. Overhanging iron balcony & gallery railing at height 35
    const [oxG, oyG] = lean(wx, wy, 35);
    const gx = wx + oxG, gy = wy + oyG;
    ctx.fillStyle = '#222224';
    ell(gx, gy, 8.5, 6.5);
    ctx.strokeStyle = '#111112'; ctx.lineWidth = 0.7;
    ctx.beginPath(); ctx.ellipse(gx, gy - 2.5, 8.2, 6.2, 0, 0, TAU); ctx.stroke();

    // 5. Enclosed octagonal glass lantern room
    const [oxL, oyL] = lean(wx, wy, 38.5);
    const lx = wx + oxL, ly = wy + oyL;
    ctx.fillStyle = 'rgba(160, 235, 245, 0.45)';
    ell(lx, ly, 6.0, 4.6);
    ctx.strokeStyle = '#323236'; ctx.lineWidth = 0.6; ctx.stroke();

    ctx.fillStyle = '#fff9d0';
    ell(lx, ly, 2.8, 2.2);
    ctx.fillStyle = '#ffb820';
    ell(lx, ly, 1.6, 1.2);

    // 6. Conical copper dome roof with spire
    const [oxR, oyR] = lean(wx, wy, 44);
    const rx = wx + oxR, ry = wy + oyR;
    const cg = ctx.createLinearGradient(gx - 6, gy, gx + 6, gy);
    cg.addColorStop(0, '#2d5c48');
    cg.addColorStop(0.45, '#488a70');
    cg.addColorStop(1, '#204636');
    ctx.fillStyle = cg;
    ctx.beginPath();
    ctx.moveTo(gx - 6.2, gy - 1);
    ctx.lineTo(rx, ry - 3);
    ctx.lineTo(gx + 6.2, gy - 1);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#ffd240'; ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.moveTo(rx, ry - 3); ctx.lineTo(rx, ry - 8); ctx.stroke();
    ctx.fillStyle = '#ffd240'; ell(rx, ry - 8, 1.0, 1.0);

    // 7. Sweeping 3D volumetric light beam sweeping the ocean
    const beamA = time * 0.62 + (wx * 0.015);
    const beamLen = 320;
    const spread = 0.28;
    const b1x = lx + Math.cos(beamA - spread) * beamLen;
    const b1y = ly + Math.sin(beamA - spread) * beamLen;
    const b2x = lx + Math.cos(beamA + spread) * beamLen;
    const b2y = ly + Math.sin(beamA + spread) * beamLen;

    const bg = ctx.createRadialGradient(lx, ly, 4, lx, ly, beamLen);
    bg.addColorStop(0, 'rgba(255, 252, 210, 0.55)');
    bg.addColorStop(0.18, 'rgba(255, 248, 180, 0.32)');
    bg.addColorStop(0.65, 'rgba(200, 240, 255, 0.12)');
    bg.addColorStop(1, 'rgba(180, 230, 255, 0)');

    ctx.save();
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.moveTo(lx, ly);
    ctx.lineTo(b1x, b1y);
    ctx.lineTo(b2x, b2y);
    ctx.closePath();
    ctx.fill();

    const oppA = beamA + Math.PI;
    const r1x = lx + Math.cos(oppA - spread*0.6) * (beamLen*0.45);
    const r1y = ly + Math.sin(oppA - spread*0.6) * (beamLen*0.45);
    const r2x = lx + Math.cos(oppA + spread*0.6) * (beamLen*0.45);
    const r2y = ly + Math.sin(oppA + spread*0.6) * (beamLen*0.45);
    const rbg = ctx.createRadialGradient(lx, ly, 3, lx, ly, beamLen*0.45);
    rbg.addColorStop(0, 'rgba(255, 252, 210, 0.35)');
    rbg.addColorStop(1, 'rgba(200, 240, 255, 0)');
    ctx.fillStyle = rbg;
    ctx.beginPath();
    ctx.moveTo(lx, ly);
    ctx.lineTo(r1x, r1y);
    ctx.lineTo(r2x, r2y);
    ctx.closePath();
    ctx.fill();

    ctx.globalAlpha = 0.75 + Math.sin(time*5)*0.2;
    ctx.drawImage(softSprite('#ffea78'), lx - 16, ly - 16, 32, 32);
    ctx.restore();
    return;
  }
  if (graphicsMode === 'high' || mode === 'foot'){
    const c = Math.cos(st.rot), s = Math.sin(st.rot);
    const corners = [[-1,-1],[1,-1],[1,1],[-1,1]].map(([a,b]) => [wx + (a*st.w/2)*c - (b*st.h/2)*s, wy + (a*st.w/2)*s + (b*st.h/2)*c]);
    ctx.fillStyle = 'rgba(10,30,10,0.35)';
    ctx.beginPath(); corners.forEach(([x,y],i) => { const X = x + h*0.45, Y = y + h*0.6; i ? ctx.lineTo(X,Y) : ctx.moveTo(X,Y); }); ctx.closePath(); ctx.fill();
    ctx.save(); ctx.translate(wx, wy); ctx.rotate(st.rot); drawStruct(ctx, st, 'ground'); ctx.restore();
    const walls = [];
    for (let i = 0; i < 4; i++){ const a = corners[i], b = corners[(i+1)%4]; walls.push({ a, b, i, d: Math.hypot((a[0]+b[0])/2 - cam.x, (a[1]+b[1])/2 - eyeY()) }); }
    walls.sort((p, q) => q.d - p.d);
    for (const w of walls){
      ctx.fillStyle = shadeHex(WALL_COL[st.kind] || '#e8dcc0', [0.8, 0.95, 1.05, 0.7][w.i]);
      ctx.beginPath(); ctx.moveTo(w.a[0], w.a[1]); ctx.lineTo(w.b[0], w.b[1]); ctx.lineTo(w.b[0] + ox, w.b[1] + oy); ctx.lineTo(w.a[0] + ox, w.a[1] + oy); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(30,15,5,0.4)'; ctx.lineWidth = 0.4; ctx.stroke();
    }
  }
  ctx.save(); ctx.translate(wx + ox, wy + oy); ctx.rotate(st.rot); drawStruct(ctx, st, 'roof'); ctx.restore();
}

    }
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;

    }

function drawCanopies(is){
  const near = mode === 'foot';
  if (graphicsMode === 'high'){
    for (const t of is.trees){
      if (t.down || !vis(is.x + t.x, is.y + t.y, 40)) continue;
      const spr = t.palm ? PALMS[t.v] : BROAD[t.v], k = t.r/10, sz = spr.size*k;
      const x = is.x + t.x, y = is.y + t.y, o = t.palm ? 11*k : 6*k;
      ctx.globalAlpha = 0.4; ctx.drawImage(spr.sh, x + o - sz/2, y + o*1.25 - sz/2, sz, sz);
    }
    ctx.globalAlpha = 1;
  }
  for (const t of is.trees){
    if (t.down || !vis(is.x + t.x, is.y + t.y, 40)) continue;
    const spr = t.palm ? PALMS[t.v] : BROAD[t.v], k = t.r/10, sz = spr.size*k;
    const x = is.x + t.x, y = is.y + t.y;
    const [ox, oy] = lean(x, y, t.palm ? t.r*2.2 : t.r*1.3);
    // trunk: a tapered, shaded pole from the ground up into the canopy
    if (graphicsMode === 'high' || near){
      const bw = t.palm ? 1.9*k : 3.0*k, tw = t.palm ? 1.1*k : 1.8*k;
      const bend = t.palm ? k*2.5*Math.sin(t.rot) : 0;
      const mxp = x + ox*0.5 + bend, myp = y + oy*0.5;
      const ln = Math.hypot(ox, oy) || 1, nx = -oy/ln, ny = ox/ln;
      ctx.fillStyle = 'rgba(0,25,0,0.3)'; ell(x + 1.2*k, y + 1.2*k, bw*1.1, bw*0.8);
      ctx.fillStyle = t.palm ? '#7a5a32' : '#4e3820';
      ctx.beginPath();
      ctx.moveTo(x + nx*bw, y + ny*bw);
      ctx.quadraticCurveTo(mxp + nx*(bw+tw)/2, myp + ny*(bw+tw)/2, x + ox + nx*tw, y + oy + ny*tw);
      ctx.lineTo(x + ox - nx*tw, y + oy - ny*tw);
      ctx.quadraticCurveTo(mxp - nx*(bw+tw)/2, myp - ny*(bw+tw)/2, x - nx*bw, y - ny*bw);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = t.palm ? 'rgba(200,160,100,0.6)' : 'rgba(140,105,65,0.6)'; ctx.lineWidth = 0.5*k; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x - nx*bw*0.4, y - ny*bw*0.4); ctx.quadraticCurveTo(mxp - nx*tw*0.5, myp - ny*tw*0.5, x + ox - nx*tw*0.4, y + oy - ny*tw*0.4); ctx.stroke();
      if (t.palm && near){
        ctx.strokeStyle = 'rgba(40,25,10,0.5)'; ctx.lineWidth = 0.35*k;
        ctx.beginPath();
        for (let r2 = 0.15; r2 < 0.95; r2 += 0.13){
          const u = 1 - r2, px = (1-r2)*(1-r2)*x + 2*(1-r2)*r2*mxp + r2*r2*(x+ox), py = (1-r2)*(1-r2)*y + 2*(1-r2)*r2*myp + r2*r2*(y+oy), w2 = bw*u + tw*(1-u);
          ctx.moveTo(px + nx*w2, py + ny*w2); ctx.lineTo(px - nx*w2, py - ny*w2);
        }
        ctx.stroke();
      }
    }
    let alpha = 1;
    if (near){
      if (Math.hypot(hero.x - x, hero.y - y) < t.r*1.15) alpha = 0.45;
      else for (const p of foes){ if (!p.dead && !p.deckShip && Math.abs(p.x - x) < t.r && Math.hypot(p.x - x, p.y - y) < t.r*1.15){ alpha = 0.55; break; } }
    }
    const shk = t.shake > 0 ? Math.sin(time*60)*t.shake*0.5 : 0;
    const windSway = Math.sin(time*1.8 + t.x*0.08 + t.y*0.04)*0.07*(weather.rain > 0.2 ? 1.6 : 1.0);
    ctx.globalAlpha = alpha;
    if (t.palm && (graphicsMode === 'high' || near)){
      ctx.save(); ctx.translate(x + ox, y + oy); ctx.rotate(t.rot + windSway + shk);
      ctx.drawImage(spr.c, -sz/2, -sz/2, sz, sz); ctx.restore();
    } else {
      const bSway = Math.sin(time*1.4 + t.x*0.06)*k*1.2;
      ctx.drawImage(spr.c, x + ox - sz/2 + bSway + shk*6, y + oy - sz/2, sz, sz);
    }
  }
  ctx.globalAlpha = 1;
}

function drawIslandFallback(is){
  // Base lush natural landmass
  ctx.fillStyle = is.volc ? '#382c26' : '#2d6824';
  ctx.beginPath();
  is.pts.forEach(([px, py], i) => i ? ctx.lineTo(is.x + px, is.y + py) : ctx.moveTo(is.x + px, is.y + py));
  ctx.closePath(); ctx.fill();

  // Natural crescent beaches in sheltered coves only (no concentric ring!)
  ctx.fillStyle = '#e5bc82';
  const len = is.pts.length;
  for (let i = 0; i < len; i += 12){
    const [px, py] = is.pts[i], ang = Math.atan2(py, px);
    if (Math.sin(ang * 2.2 + is.x * 0.02) > 0.38){
      ctx.beginPath();
      ctx.ellipse(is.x + px * 0.94, is.y + py * 0.94, is.R * 0.14, is.R * 0.06, ang + Math.PI/2, 0, TAU);
      ctx.fill();
    }
  }

  // 3D elevated mountain / volcano peak with perspective lean
  if (is.big){
    const [ox, oy] = lean(is.x, is.y, 24);
    ctx.fillStyle = is.volc ? '#1f1611' : '#1e4818';
    ctx.beginPath();
    is.pts.forEach(([px, py], i) => {
      const pScale = 0.50;
      const gx = is.x + ox + px*pScale, gy = is.y + oy + py*pScale;

function render(){
  const z = cam.z, S = DPR;
  const sx = shake ? rand(-shake, shake) : 0, sy = shake ? rand(-shake, shake) : 0;
  ctx.setTransform(z*S, 0, 0, z*S, (VW/2 - cam.x*z + sx)*S, (VH/2 - cam.y*z + sy)*S);

  drawWater();
  ctx.fillStyle = 'rgba(0,8,22,0.55)';
  ctx.beginPath(); ctx.rect(vx0-10, vy0-10, vw+20, vh+20); ctx.rect(0, 0, WORLD, WORLD); ctx.fill('evenodd');

  if (graphicsMode === 'high'){
    for (const s of schools) if (vis(s.x, s.y, 40)) drawFish(s);
  }
  // Always include all islands currently in view (even before bitmap baking finishes)
  const visIs = islands.filter(is => vis(is.x, is.y, (is.max || 100) * 1.6 + 180));

  // Shallow coral reefs & water shelf
  for (const is of visIs){
    if (is.shelf && is.sext){
      ctx.drawImage(is.shelf, is.x - is.sext, is.y - is.sext, is.sext*2, is.sext*2);
    } else {
      const sw = is.shelfW || 120;
      const grad = ctx.createRadialGradient(is.x, is.y, is.R*0.75, is.x, is.y, is.R + sw*0.75);
      grad.addColorStop(0, 'rgba(64, 215, 192, 0.52)');
      grad.addColorStop(0.35, 'rgba(28, 150, 150, 0.42)');
      grad.addColorStop(0.72, 'rgba(16, 78, 114, 0.22)');
      grad.addColorStop(1, 'rgba(12, 43, 74, 0)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(is.x, is.y, is.R + sw*0.75, 0, TAU); ctx.fill();
    }
  }

  if (graphicsMode === 'high'){
    for (const o of deepObjs) if (o.shallow && vis(o.x, o.y, o.ww)) drawDeep(o);
  }

  // sunlight caustics in the shallows
  if (graphicsMode === 'high'){
    if (visIs.length > 0){
      try {
        if (_M_CAUS_A && CAUS_A.setTransform){
          _M_CAUS_A.e = time*5; _M_CAUS_A.f = time*3;
          CAUS_A.setTransform(_M_CAUS_A);
        }
        if (_M_CAUS_B && CAUS_B.setTransform){
          _M_CAUS_B.e = -time*4; _M_CAUS_B.f = time*4.5;
          CAUS_B.setTransform(_M_CAUS_B);
        }
      } catch(e){}
    }
    for (const is of visIs){
      ctx.save();
      ctx.beginPath();
      const len = is.pts.length, k = 1 + is.shelfW*0.65/is.R;
      ctx.moveTo(is.x + is.pts[0][0]*k, is.y + is.pts[0][1]*k);
      for (let i = 2; i < len; i += 2) ctx.lineTo(is.x + is.pts[i][0]*k, is.y + is.pts[i][1]*k);
      ctx.closePath(); ctx.clip();
      const bx = is.x - (is.sext || is.max*1.2), by = is.y - (is.sext || is.max*1.2), bw = (is.sext || is.max*1.2)*2;
      ctx.globalAlpha = 0.20 * Math.max(0, 1 - weather.rain * 1.2); ctx.fillStyle = CAUS_A; ctx.fillRect(bx, by, bw, bw);
      ctx.restore(); ctx.globalAlpha = 1;
    }
    drawGlints();
  }

  for (const t of turtles) if (vis(t.x, t.y, 12)) drawTurtle(t);
  ctx.lineCap = 'round';

  // Island Landmass: Draw high-res baked canvas if ready, or crisp vector island (NEVER invisible!)
  for (const is of visIs){
    if (is.cv && is.ext && vis(is.x, is.y, is.ext)){
      ctx.drawImage(is.cv, is.x - is.ext, is.y - is.ext, is.ext*2, is.ext*2);
    } else {
      drawIslandFallback(is);
    }
  }

  // Organic coastal shorewash foam: breaks naturally along windward beaches and rocky points
  if (graphicsMode === 'high'){
    for (const is of visIs){
      const pts = is.pts, len = pts.length;
      if (!len) continue;
      const wDir = wind.a;
      ctx.fillStyle = 'rgba(240, 252, 248, 0.42)';
      const step = 4;
      for (let i = 0; i < len; i += step){
        const [px, py] = pts[i], ang = Math.atan2(py, px);
        // Waves hit shores exposed toward wind direction
        const exp = Math.cos(ang - wDir);
        if (exp > -0.3){

    }
  }

  // 3D vertical sea-stack rocks with faceted granite cliffs and directional tidal wash
  for (const r of rocks){

    // Vertical sea-stack cliff facets
    ctx.fillStyle = '#22252a';
    ctx.beginPath();
    ctx.arc(r.x, r.y, r.r * 0.95, 0, TAU);
    ctx.arc(r.x + ox, r.y + oy, r.r * 0.95, 0, TAU);
    ctx.fill();
    // Sunlit top crag summit with perspective offset
    ctx.drawImage(r.cv, r.x + ox - r.ext, r.y + oy - r.ext, r.ext*2, r.ext*2);
    // Directional windward tidal wash (no concentric circle)
    if (graphicsMode === 'high'){
      const wDir = wind.a;
      const wx = r.x + Math.cos(wDir) * r.r * 1.1;
      const wy = r.y + Math.sin(wDir) * r.r * 1.1;
      const washLap = (Math.sin(time * 3.0 + r.x * 0.05) + 1) * 0.5;
      ctx.fillStyle = `rgba(242, 252, 250, ${0.35 * washLap})`;
      ctx.beginPath();
      ctx.ellipse(wx, wy, r.r * (0.8 + washLap * 0.4), r.r * 0.35, wDir + Math.PI/2, 0, TAU);
      ctx.fill();
    }
  }
  for (const is of visIs) if (vis(is.x, is.y, is.max + 30)) drawGroundDetails(is);
  for (const b of home.berths){
    if (!vis(b.x, b.y, 50)) continue;
    for (const k of [-1, 1]){
      const px = b.x + Math.cos(b.a)*k*30, py = b.y + Math.sin(b.a)*k*30, [ox, oy] = lean(px, py, 7);
      ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 0.8; ctx.beginPath(); ctx.arc(px, py, 3.6 + Math.sin(time*2 + k)*0.6, 0, TAU); ctx.stroke();
      ctx.fillStyle = 'rgba(0,20,40,0.35)'; ell(px + 2.5, py + 3.5, 2, 1.6);
      ctx.strokeStyle = '#3e2a16'; ctx.lineWidth = 2.6; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + ox, py + oy); ctx.stroke();
      ctx.fillStyle = '#7a5a34'; ell(px + ox, py + oy, 1.4, 1.4);
    }
  }

  if (graphicsMode === 'high'){
    for (const r of ripples){
      if (!vis(r.x, r.y, r.r*2)) continue;
      const a = r.t/r.life;
      ctx.strokeStyle = `rgba(230,246,255,${(1-a)*0.5})`; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(r.x, r.y, r.r*(0.3 + a), 0, TAU); ctx.stroke();
    }
  }
  for (const s of ships) drawWake(s);
  drawParts(0);
  for (const b of bloodPools) if (vis(b.x, b.y, b.curR + 10)) drawBloodPool(b);
  for (const c of crates) if (vis(c.x, c.y, 16)) drawCrate(c);
  for (const sw of castaways) if (vis(sw.x, sw.y, 24)) drawCastaway(sw);
  drawPlankWalkers();
  for (const m of mines) if (vis(m.x, m.y, 12)) drawMine(m);
  if (graphicsMode === 'high'){
    for (const c of sharks) if (vis(c.x, c.y, 40) && c.depth <= 8) drawSea(c);
    for (const w of whales) if (vis(w.x, w.y, 110) && (w.cycle % 20) >= 14) drawSea(w);
    for (const p of dolphins){
      if (!vis(p.x, p.y, 50)) continue;
      for (const m of p.members) drawSea({ kind: 'dolphin', x: p.x + m.ox, y: p.y + m.oy, a: p.a, ph: m.ph, up: Math.max(0, Math.sin(time*2.2 + m.ph)) });
    }
  }

  for (const p of foes) if (!p.deckShip && vis(p.x, p.y, 20)) drawFoe(p);
  if (mode === 'foot') drawHero();
  for (const is of visIs) for (const st of is.structs) if (vis(is.x + st.x, is.y + st.y, Math.max(st.w, st.h) + 30)) drawStructDyn(is, st);

  for (const k of sinking){ if (vis(k.s.x, k.s.y, k.s.T.len + 40)) drawShip(k.s, Math.max(0, 1 - k.t/3), 1 - k.t*0.12, k.t*0.15); }
  for (const s of ships){
    if (!s.alive || !vis(s.x, s.y, s.T.len*1.2 + 40)) continue;

    drawShip(s, 1, 1, 0, onDeck ? 0.3 : 1);
  }
  if (deck){
    // grappling lines
    const a = deck.ship, b = deck.other;
    ctx.strokeStyle = 'rgba(210,180,120,0.9)'; ctx.lineWidth = 0.7;
    for (const k of [-0.25, 0, 0.25]){
      const [x1, y1] = shipLocal(a, a.T.len*k, (b === player || a === player ? 1 : 1)*Math.sign(-Math.sin(a.a)*(b.x - a.x) + Math.cos(a.a)*(b.y - a.y))*a.T.wid*0.45);
      const [x2, y2] = shipLocal(b, b.T.len*k, Math.sign(-Math.sin(b.a)*(a.x - b.x) + Math.cos(b.a)*(a.y - b.y))*b.T.wid*0.45);
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    }
    for (const p of foes) if (p.deckShip) drawFoe(p);
    if (mode === 'deck') drawHero();
  }

  if (fishing.st !== 'idle'){
    const o = fishOrigin(), bite = fishing.st === 'bite';
    const by = fishing.y + (bite ? Math.sin(time*30)*1.2 : Math.sin(time*3)*0.6);
    ctx.strokeStyle = 'rgba(240,240,230,0.7)'; ctx.lineWidth = 0.5;
    ctx.beginPath(); ctx.moveTo(o.x, o.y); ctx.quadraticCurveTo((o.x + fishing.x)/2, (o.y + by)/2 + 6, fishing.x, by); ctx.stroke();
    ctx.fillStyle = '#ffffff'; ell(fishing.x, by, 1.8, 1.8);
    ctx.fillStyle = '#d8302a'; ctx.beginPath(); ctx.arc(fishing.x, by, 1.8, Math.PI, TAU); ctx.fill();
  }

  if (graphicsMode === 'high'){
    for (const b of balls){
      const h = Math.sin(b.t/b.life*Math.PI)*12;
      ctx.fillStyle = 'rgba(0,20,40,0.35)'; ell(b.x + h*0.25, b.y + h*0.3, 2, 1.6);
      ctx.fillStyle = '#121212'; ell(b.x, b.y - h, 2.3, 2.3);
      ctx.fillStyle = '#8a8a8a'; ell(b.x - 0.8, b.y - h - 0.8, 0.8, 0.8);
    }
  } else if (balls.length > 0){
    ctx.fillStyle = '#111111';
    ctx.beginPath();
    for (const b of balls){
      const h = Math.sin(b.t/b.life*Math.PI)*12;
      ctx.moveTo(b.x + 2.4, b.y - h);
      ctx.arc(b.x, b.y - h, 2.4, 0, TAU);
    }
    ctx.fill();
  }
  for (const is of visIs) if (vis(is.x, is.y, is.max + 30)) drawCanopies(is);
  drawParts(1);
  if (graphicsMode === 'high'){
    for (const g of gulls) if (vis(g.x + 12, g.y + 15, 60)){ drawGull(g, true); drawGull(g, false); }
    // clouds: shadows on the world below, puffy tops high above (fade near the centre so they never hide you)
    for (const c of cloudList){
      const x = cam.x + ((((c.bx + time*14 - cam.x) % 4200) + 4200) % 4200) - 2100;
      const y = cam.y + ((((c.by + time*6 - cam.y) % 4200) + 4200) % 4200) - 2100;
      const shx = x + c.h*0.35, shy = y + c.h*0.45;
      if (vis(shx, shy, c.s/2)){ ctx.globalAlpha = 0.24; ctx.drawImage(CLOUD_SH[c.v], shx - c.s/2, shy - c.s/2, c.s, c.s); }

  if (graphicsMode === 'high' && vignette){

      ctx.fillStyle = s.hp < s.T.hp*0.3 ? '#e8302a' : s.type === 'navy' ? '#6fa8ff' : '#7dff5a'; ctx.fillRect(px - w/2, py - up + 1, w*Math.max(0, s.hp/s.T.hp), 3);
    }
    if (s.title && Math.hypot(s.x - focus().x, s.y - focus().y) < 700) otext(s.title, px, py - up - 18, s.type === 'treasure' ? '#e8c040' : s.lord ? '#ff6a4a' : '#e8e0c8', 13, 'center');
    if (s.type === 'moored' && Math.hypot(s.x - focus().x, s.y - focus().y) < 260) otext(s.rec.name, px, py - 46*lift, s.owned ? '#7dff5a' : '#e8d8b0', 13, 'center');
    if (s.type === 'pirate' && s.stole && s.gold > 0) otext('$', px, py - 64*lift + Math.sin(time*6)*3, '#ffe14a', 18, 'center');
    if (s.type === 'pirate' && s.ai.kind === 'thief' && s.ai.grab > 0.2 && !deck) otext('GRAPPLING!', px, py - 64*lift, '#ff4a3a', 14, 'center');
  }
  for (const p of foes){
    if (p.dead || p.hp >= p.max || !vis(p.x, p.y, 20)) continue;
    const [px, py] = toScreen(p.x, p.y), w = 26;
    ctx.fillStyle = '#000'; ctx.fillRect(px - w/2 - 1, py - 11*cam.z, w + 2, 5);
    ctx.fillStyle = '#e8302a'; ctx.fillRect(px - w/2, py - 11*cam.z + 1, w*Math.max(0, p.hp/p.max), 3);
  }
  if (mode === 'foot') for (const is of islands){
    if (Math.abs(is.x - hero.x) > is.max + 200 || Math.abs(is.y - hero.y) > is.max + 200) continue;
    for (const st of is.structs){
      if (!st.label) continue;
      const wx = is.x + st.x, wy = is.y + st.y;
      if (Math.hypot(hero.x - wx, hero.y - wy) > 200) continue;
      const [ox, oy] = lean(wx, wy, STRUCT_H[st.kind]);
      const [px, py] = toScreen(wx + ox, wy + oy - st.h/2 - 6);
      otext(st.label, px, py - 16, '#ffd23f', 15, 'center');
    }
  }
  if (fishing.st === 'bite'){ const [px, py] = toScreen(fishing.x, fishing.y); otext('!', px, py - 34, '#ffd23f', 26 + Math.sin(time*20)*3, 'center'); }
  for (const f of ftexts){
    const [px, py] = toScreen(f.x, f.y);
    ctx.globalAlpha = Math.min(1, 1.6 - f.age);
    otext(f.t, px, py, f.col, 17, 'center');
  }
  ctx.globalAlpha = 1;

  if (state === 'play'){
    if (weather.rain > 0.02){
      ctx.save();
      const rainAlpha = weather.rain;
      const rainAngle = weather.rainAngle !== undefined ? weather.rainAngle : Math.PI/2;
      const cosA = Math.cos(rainAngle), sinA = Math.sin(rainAngle);

      // Moody atmospheric storm gloom & dark squall vignette
      const diag = Math.hypot(VW, VH);
      const stormVg = ctx.createRadialGradient(VW/2, VH/2, diag*0.18, VW/2, VH/2, diag*0.75);
      stormVg.addColorStop(0, `rgba(14, 26, 44, ${0.26 * rainAlpha})`);
      stormVg.addColorStop(0.65, `rgba(8, 18, 34, ${0.48 * rainAlpha})`);
      stormVg.addColorStop(1, `rgba(3, 8, 18, ${0.74 * rainAlpha})`);
      ctx.fillStyle = stormVg;
      ctx.fillRect(0, 0, VW, VH);

      // Splash ripples on water all over the ocean
      ctx.lineWidth = 1.1;
      for (const d of rainDrops){
        if (d.splashT > 0 && d.splashX >= -40 && d.splashX <= VW + 40 && d.splashY >= -40 && d.splashY <= VH + 40){
          const progress = 1 - clamp(d.splashT / (d.splashMaxT || 0.28), 0, 1);
          const alpha = (1 - progress) * rainAlpha * 0.85;
          ctx.strokeStyle = `rgba(215, 240, 255, ${alpha})`;
          ctx.beginPath();
          ctx.ellipse(d.splashX, d.splashY, d.splashR, d.splashR * 0.46, 0, 0, TAU);
          if (progress < 0.45){
            const inR = d.splashR * 0.45;
            ctx.ellipse(d.splashX, d.splashY, inR, inR * 0.46, 0, 0, TAU);
          }
          ctx.stroke();
        }
      }

      // Layer 0: fine distant background rain (smaller, at least 50% opacity)
      ctx.lineWidth = 0.85;
      ctx.strokeStyle = `rgba(205, 230, 255, ${Math.max(0.50, 0.52 * rainAlpha)})`;
      ctx.beginPath();
      for (const d of rainDrops){
        if (d.layer === 0 && d.z > 0 && d.sx >= -60 && d.sx <= VW + 60 && d.sy >= -60 && d.sy <= VH + 60){
          ctx.moveTo(d.sx - cosA * d.len, d.sy - sinA * d.len);
          ctx.lineTo(d.sx, d.sy);
        }
      }
      ctx.stroke();

      // Layer 1: midground rain (smaller, at least 50% opacity)
      ctx.lineWidth = 1.1;
      ctx.strokeStyle = `rgba(220, 240, 255, ${Math.max(0.50, 0.68 * rainAlpha)})`;
      ctx.beginPath();
      for (const d of rainDrops){
        if (d.layer === 1 && d.z > 0 && d.sx >= -60 && d.sx <= VW + 60 && d.sy >= -60 && d.sy <= VH + 60){
          ctx.moveTo(d.sx - cosA * d.len, d.sy - sinA * d.len);
          ctx.lineTo(d.sx, d.sy);
        }
      }
      ctx.stroke();

      // Layer 2: foreground rain (smaller, at least 50% opacity)
      ctx.lineWidth = 1.4;
      ctx.strokeStyle = `rgba(238, 250, 255, ${Math.max(0.50, 0.86 * rainAlpha)})`;
      ctx.beginPath();
      for (const d of rainDrops){
        if (d.layer === 2 && d.z > 0 && d.sx >= -60 && d.sx <= VW + 60 && d.sy >= -60 && d.sy <= VH + 60){
          ctx.moveTo(d.sx - cosA * d.len, d.sy - sinA * d.len);
          ctx.lineTo(d.sx, d.sy);
        }
      }
      ctx.stroke();
      ctx.restore();
    }
    if (weather.flash > 0){
      const flashAlpha = clamp(weather.flash, 0, 0.88);
      ctx.fillStyle = 'rgba(255, 255, 255, ' + flashAlpha + ')';
      ctx.fillRect(0, 0, VW, VH);
    }
  }
  if (state !== 'play'){ drawTitle(); return; }
  drawHUD();
  if (showMap && !menu) drawWorldMap();
  if (menu && menu.yard) drawYard(); else if (menu) drawMenu();
  if (menu && menu.pause) drawPhonePanel(16, 16, Math.round(clamp(VH*0.2, 110, 170)));
  if (paused && !menu){
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0,0,VW,VH);
    otext('PAUSED', VW/2, VH/2 - 24, '#ffffff', 48, 'center');
  }
  if (perfMetrics.show){
    drawPerfOverlay();
  }
}

let _curFont = '';
function otext(t, x, y, col, size, align='left'){
  const f = `${size}px Impact, "Arial Black", "Arial Bold", sans-serif`;
  if (_curFont !== f){ ctx.font = _curFont = f; }
  ctx.textAlign = align; ctx.textBaseline = 'top';
  ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(3, size/4.5); ctx.strokeStyle = '#000';
  ctx.strokeText(t, x, y); ctx.fillStyle = col; ctx.fillText(t, x, y);
}

function drawPerfOverlay(){
  ctx.save();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const w = 320, h = 82, x = 14, y = VH - h - 14;
  ctx.fillStyle = 'rgba(6,16,28,0.92)';
  ctx.strokeStyle = '#2a5a8a';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, 8); else ctx.rect(x, y, w, h);
  ctx.fill(); ctx.stroke();

  const fps = perfMetrics.fps;
  const fpsCol = fps >= 55 ? '#5be35b' : fps >= 30 ? '#ffd23f' : '#e8402a';
  otext(`⚡ ${fps} FPS`, x + 12, y + 8, fpsCol, 18, 'left');
  otext(`${perfMetrics.frameTime.toFixed(1)} ms`, x + 105, y + 10, '#cfe8ff', 14, 'left');
  otext(`[${graphicsMode.toUpperCase()}]`, x + 180, y + 10, graphicsMode === 'high' ? '#ffd23f' : '#5be35b', 14, 'left');

function iconWood(x, y, s){

function iconMine(x, y, s){

function drawHeart(x, y, s, fill){
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);

  ctx.lineWidth = 2.4; ctx.strokeStyle = '#000'; path(); ctx.stroke();

}
function drawStar(x, y, r, on, flash){
  ctx.beginPath();
  for (let k = 0; k < 10; k++){ const a = -Math.PI/2 + k*Math.PI/5, rr = k % 2 ? r*0.45 : r; ctx.lineTo(x + Math.cos(a)*rr, y + Math.sin(a)*rr); }
  ctx.closePath();
  ctx.lineWidth = 3; ctx.strokeStyle = '#000'; ctx.stroke();
  ctx.fillStyle = on ? (flash ? '#ffffff' : '#ffd23f') : 'rgba(60,60,60,0.7)'; ctx.fill();
}

function drawRadar(m, U){
  const mm = Math.round(Math.min(200, Math.min(VW, VH)*0.3)), mx = VW - mm - m, my = VH - mm - m;
  const f = focus(), span = 2800, k = MINIMAP.width/WORLD;
  const toMM = (x, y) => [mx + (x - (f.x - span/2))/span*mm, my + (y - (f.y - span/2))/span*mm];
  ctx.fillStyle = '#000'; ctx.fillRect(mx - 3, my - 3, mm + 6, mm + 6);
  ctx.save(); ctx.beginPath(); ctx.rect(mx, my, mm, mm); ctx.clip();
  ctx.fillStyle = '#0a2a48'; ctx.fillRect(mx, my, mm, mm);
  ctx.globalAlpha = 0.95;
  ctx.drawImage(MINIMAP, (f.x - span/2)*k, (f.y - span/2)*k, span*k, span*k, mx, my, mm, mm);
  ctx.globalAlpha = 1;
  ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 1;
  const [vx, vy] = toMM(cam.x - vw/2, cam.y - vh/2); ctx.strokeRect(vx, vy, vw/span*mm, vh/span*mm);
  for (const c of camps){
    const [cx, cy] = toMM(c.x, c.y);
    ctx.fillStyle = c.chest.open ? '#777' : campCleared(c) ? '#ffd23f' : '#ff4a3a';
    ctx.fillRect(cx - 3, cy - 3, 6, 5); ctx.fillRect(cx - 2, cy + 2, 4, 2);
    ctx.fillStyle = '#000'; ctx.fillRect(cx - 2, cy - 1.5, 1.5, 1.5); ctx.fillRect(cx + 0.5, cy - 1.5, 1.5, 1.5);
  }
  for (const mi of mines){ const [x, y] = toMM(mi.x, mi.y); ctx.fillStyle = '#ff9a8a'; ctx.fillRect(x - 1, y - 1, 2, 2); }
  for (const s of ships){
    if (!s.alive || s === player) continue;
    if (inFog(s.x, s.y) && dist(s, player) > 280) continue; // Hidden in rolling fog bank!
    const [x, y] = toMM(s.x, s.y);
    if (s.type === 'moored'){ ctx.fillStyle = s.owned ? '#7dff5a' : '#e8d8b0'; ctx.fillRect(x - 2, y - 2, 4, 4); continue; }
    if (s.type === 'treasure'){ ctx.fillStyle = Math.sin(time*6) > 0 ? '#ffe14a' : '#b07a10'; ctx.beginPath(); ctx.moveTo(x, y - 5); ctx.lineTo(x + 4, y); ctx.lineTo(x, y + 5); ctx.lineTo(x - 4, y); ctx.closePath(); ctx.fill(); continue; }
    if (s.type === 'trader'){ ctx.fillStyle = '#d8c090'; ctx.fillRect(x - 2, y - 2, 4, 4); continue; }
    if (s.lord){ ctx.fillStyle = '#ff2a1a'; ctx.beginPath(); ctx.arc(x, y, 4, 0, TAU); ctx.fill(); ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.stroke(); continue; }
    if (s.type === 'fisher'){ ctx.fillStyle = '#cfe8ff'; ctx.fillRect(x - 1, y - 1, 2, 2); continue; }
    if (s.type === 'navy'){ ctx.fillStyle = s.ai.target === player && Math.sin(time*10) > 0 ? '#ffffff' : '#4a8cff'; ctx.fillRect(x - 2.5, y - 2.5, 5, 5); continue; }
    ctx.fillStyle = s.stole && s.gold > 0 ? (Math.sin(time*10) > 0 ? '#ffe14a' : '#e8302a') : '#e8302a';
    ctx.fillRect(x - 2, y - 2, 4, 4);
  }
  if (player.alive){
    const [x, y] = toMM(player.x, player.y);
    ctx.save(); ctx.translate(x, y); ctx.rotate(player.a);
    ctx.fillStyle = '#ffd23f'; ctx.strokeStyle = '#000'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(7,0); ctx.lineTo(-4,-4.5); ctx.lineTo(-4,4.5); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  if (mode === 'foot'){ const [x, y] = toMM(hero.x, hero.y); ctx.fillStyle = '#fff'; ctx.strokeStyle = '#000'; ctx.beginPath(); ctx.arc(x, y, 3, 0, TAU); ctx.fill(); ctx.stroke(); }
  ctx.restore();
  // pointers to places off the map
  for (const [is, label, col] of [[home, 'H', '#7dff5a'], [port, '$', '#ffd23f'], [city, '$', '#ffd23f'], [capital, '$', '#ffd23f']]){
    const [px, py] = toMM(is.x, is.y);
    if (px < mx || px > mx + mm || py < my || py > my + mm){
      const cxm = mx + mm/2, cym = my + mm/2, a = Math.atan2(py - cym, px - cxm);
      const t = Math.min((mm/2 - 8)/Math.abs(Math.cos(a) || 1e-6), (mm/2 - 8)/Math.abs(Math.sin(a) || 1e-6));
      const ex = cxm + Math.cos(a)*t, ey = cym + Math.sin(a)*t;
      ctx.save(); ctx.translate(ex, ey); ctx.rotate(a);
      ctx.fillStyle = col; ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(7, 0); ctx.lineTo(-4, -5); ctx.lineTo(-4, 5); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
      otext(label, ex - Math.cos(a)*14, ey - Math.sin(a)*14 - 8, col, 14, 'center');
    } else otext(label, px, py - 8, col, 14, 'center');
  }
}

function drawWorldMap(){
  const S = Math.min(VW - 40, VH - 90), x0 = (VW - S)/2, y0 = 56, k = S/WORLD, U = clamp(Math.min(VW, VH)/720, 0.7, 1.4);
  const P = (x, y) => [x0 + x*k, y0 + y*k];
  ctx.fillStyle = 'rgba(0,6,16,0.85)'; ctx.fillRect(0, 0, VW, VH);

  // Antique Wood Frame
  ctx.fillStyle = '#2c1808'; ctx.fillRect(x0 - 10, y0 - 10, S + 20, S + 20);
  ctx.strokeStyle = '#c9a040'; ctx.lineWidth = 3; ctx.strokeRect(x0 - 5, y0 - 5, S + 10, S + 10);

  // Aged Parchment Base
  const parchGrad = ctx.createRadialGradient(x0 + S*0.5, y0 + S*0.5, S*0.1, x0 + S*0.5, y0 + S*0.5, S*0.72);
  parchGrad.addColorStop(0, '#f2dfb8');
  parchGrad.addColorStop(0.65, '#dfc492');
  parchGrad.addColorStop(1, '#8e6332');
  ctx.fillStyle = parchGrad;
  ctx.fillRect(x0, y0, S, S);

  // Base Sea & Islands Map from MINIMAP
  ctx.save();
  ctx.beginPath(); ctx.rect(x0, y0, S, S); ctx.clip();
  ctx.globalAlpha = 0.88;
  ctx.drawImage(MINIMAP, x0, y0, S, S);
  ctx.globalAlpha = 1;

  // Fog of War Mask on World Map
  const fCell = S / FOG_RES;
  for (let gy = 0; gy < FOG_RES; gy++){
    for (let gx = 0; gx < FOG_RES; gx++){
      if (!fogGrid[gy * FOG_RES + gx]){
        const cx = x0 + gx * fCell, cy = y0 + gy * fCell;
        ctx.fillStyle = '#c7ab78';
        ctx.fillRect(cx - 0.5, cy - 0.5, fCell + 1, fCell + 1);
        ctx.fillStyle = 'rgba(70,50,30,0.18)';
        ctx.beginPath(); ctx.arc(cx + fCell*0.5, cy + fCell*0.5, fCell*0.65, 0, TAU); ctx.fill();
      }
    }
  }

  // Burnt/Charred Edges Vignette
  const edgeVig = ctx.createRadialGradient(x0 + S*0.5, y0 + S*0.5, S*0.4, x0 + S*0.5, y0 + S*0.5, S*0.72);
  edgeVig.addColorStop(0, 'rgba(40,20,5,0)');
  edgeVig.addColorStop(0.7, 'rgba(40,20,5,0.45)');
  edgeVig.addColorStop(1, 'rgba(25,10,2,0.92)');
  ctx.fillStyle = edgeVig;
  ctx.fillRect(x0, y0, S, S);

  // Portolan Navigational Rhumb Lines
  ctx.strokeStyle = 'rgba(90, 55, 25, 0.22)';
  ctx.lineWidth = 0.8;
  for (const [rcx, rcy] of [[x0 + S*0.3, y0 + S*0.35], [x0 + S*0.72, y0 + S*0.65]]){
    for (let a = 0; a < TAU; a += TAU/16){
      ctx.beginPath(); ctx.moveTo(rcx, rcy); ctx.lineTo(rcx + Math.cos(a)*S*1.2, rcy + Math.sin(a)*S*1.2); ctx.stroke();
    }
  }

  // Sea Monster Illustration ("HIC SVNT DRACONES")
  const smx = x0 + S*0.22, smy = y0 + S*0.78;
  ctx.strokeStyle = 'rgba(75, 45, 20, 0.5)'; ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.arc(smx, smy, 18, 0.4, Math.PI + 0.5);
  ctx.arc(smx + 22, smy, 14, Math.PI, TAU);
  ctx.stroke();
  for (let k = 0; k < 4; k++){
    ctx.beginPath(); ctx.moveTo(smx - 10 + k*8, smy - 12); ctx.lineTo(smx - 7 + k*8, smy - 20); ctx.lineTo(smx - 4 + k*8, smy - 12); ctx.stroke();
  }
  otext('HIC SVNT DRACONES', smx + 12, smy + 24, '#5c3a1c', Math.round(11*U), 'center');

  // Charted Island Labels & Features (only if explored)
  for (const is of islands){
    const gx = clamp(Math.floor(is.x / WORLD * FOG_RES), 0, FOG_RES - 1);
    const gy = clamp(Math.floor(is.y / WORLD * FOG_RES), 0, FOG_RES - 1);
    if (!fogGrid[gy * FOG_RES + gx]) continue;
    if (is.big || is.city || is.port){
      const [px, py] = P(is.x, is.y);
      otext(is.name, px, py + (is.big ? 0 : 12), is.big ? '#3e2410' : '#8a1f10', Math.round((is.big ? 13 : 12)*U), 'center');
    }
  }
  for (const is of bigLands){
    const gx = clamp(Math.floor((is.x + is.vx) / WORLD * FOG_RES), 0, FOG_RES - 1);
    const gy = clamp(Math.floor((is.y + is.vy) / WORLD * FOG_RES), 0, FOG_RES - 1);
    if (is.volc && fogGrid[gy * FOG_RES + gx]){
      const [px, py] = P(is.x + is.vx, is.y + is.vy);
      ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.6 + 0.3*Math.sin(time*3);
      ctx.drawImage(softSprite('#ff6a20'), px - 10, py - 10, 20, 20);
      ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    }
  }

  // Ships on Map
  for (const s of ships){
    if (!s.alive) continue;
    if (inFog(s.x, s.y) && s !== player) continue;
    const gx = clamp(Math.floor(s.x / WORLD * FOG_RES), 0, FOG_RES - 1);
    const gy = clamp(Math.floor(s.y / WORLD * FOG_RES), 0, FOG_RES - 1);
    if (!fogGrid[gy * FOG_RES + gx]) continue;
    const [px, py] = P(s.x, s.y);
    if (s.type === 'treasure'){
      ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.moveTo(px, py - 6); ctx.lineTo(px + 5, py); ctx.lineTo(px, py + 6); ctx.lineTo(px - 5, py); ctx.closePath(); ctx.fill();
    } else if (s.lord || s.isHunter){
      ctx.fillStyle = '#8a0a0a'; ctx.beginPath(); ctx.arc(px, py, 5, 0, TAU); ctx.fill(); ctx.strokeStyle = '#000'; ctx.stroke();
    } else if (s.type === 'moored' && s.owned){
      ctx.fillStyle = '#2f8a3a'; ctx.fillRect(px - 2, py - 2, 4, 4);
    }
  }

  // Active Buried Treasure "X" Marks
  for (const tm of treasureMaps){
    if (tm.dug) continue;
    const [tx, ty] = P(tm.x, tm.y);
    ctx.strokeStyle = '#d62020'; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(tx - 7, ty - 7); ctx.lineTo(tx + 7, ty + 7);
    ctx.moveTo(tx + 7, ty - 7); ctx.lineTo(tx - 7, ty + 7);
    ctx.stroke();
    otext(tm.lm, tx, ty + 12, '#8a0a0a', Math.round(11*U), 'center');
  }

  // Player Marker
  const f = focus(), [fx, fy] = P(f.x, f.y);
  ctx.save(); ctx.translate(fx, fy); ctx.rotate(mode === 'sea' ? player.a : hero.a);
  ctx.fillStyle = '#ffd23f'; ctx.strokeStyle = '#2e1c0c'; ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(-6, -6); ctx.lineTo(-6, 6); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.restore();

  // Ornate Compass Rose at Top Right
  const crX = x0 + S*0.84, crY = y0 + S*0.18, crR = 36*U;
  ctx.save(); ctx.translate(crX, crY);
  ctx.strokeStyle = '#4a2c12'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.arc(0, 0, crR, 0, TAU); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, crR*0.7, 0, TAU); ctx.stroke();
  for (let k = 0; k < 16; k++){
    const ang = k*TAU/16, isCard = k % 4 === 0, len = isCard ? crR : crR*0.65;
    ctx.fillStyle = (k % 2 === 0) ? '#8a1f10' : '#e6cf9e';
    ctx.beginPath(); ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos(ang - 0.1)*len*0.3, Math.sin(ang - 0.1)*len*0.3);
    ctx.lineTo(Math.cos(ang)*len, Math.sin(ang)*len);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = (k % 2 === 0) ? '#2e1c0c' : '#c4a668';
    ctx.beginPath(); ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos(ang + 0.1)*len*0.3, Math.sin(ang + 0.1)*len*0.3);
    ctx.lineTo(Math.cos(ang)*len, Math.sin(ang)*len);
    ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = '#d6a832'; ctx.beginPath(); ctx.arc(0, 0, 4*U, 0, TAU); ctx.fill();
  otext('N', 0, -crR - 10*U, '#8a1f10', Math.round(14*U), 'center');
  otext('S', 0, crR + 14*U, '#3e2410', Math.round(13*U), 'center');
  otext('E', crR + 10*U, 4*U, '#3e2410', Math.round(13*U), 'center');
  otext('W', -crR - 10*U, 4*U, '#3e2410', Math.round(13*U), 'center');
  ctx.restore();

  ctx.restore(); // end clip

  // Header Cartouche
  otext('~ CARIBBEAN SEA & SPANISH MAIN ~', VW/2, 18, '#ffd23f', Math.round(24*U), 'center');
  otext("YOU    $ PORTS    H HIDEOUT    ◆ TREASURE FLEET    ● WARSHIP/LORD    ⚔️ X BURIED TREASURE    TAB: CLOSE", VW/2, y0 + S + 14, '#e8dcc0', Math.round(12*U), 'center');
}
function drawMenu(){
  const U = clamp(Math.min(VW, VH)/720, 0.75, 1.4);
  const items = menu.build(), fs = Math.round(20*U), lh = fs + 18*U;
  const w = Math.min(VW - 30, 580*U), h = 96*U + items.length*lh + 30*U;
  const x = VW/2 - w/2, y = VH/2 - h/2;
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 0, VW, VH);
  ctx.fillStyle = '#1b140e'; ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = '#c9a040'; ctx.lineWidth = 3; ctx.strokeRect(x + 4, y + 4, w - 8, h - 8);
  otext(menu.title, VW/2, y + 18*U, '#ffd23f', Math.round(32*U), 'center');
  otext(menu.sub || `GOLD $${player.gold}`, VW/2, y + 60*U, '#ffffff', Math.round(14*U), 'center');
  items.forEach((it, i) => {
    const iy = y + 90*U + i*lh, sel = i === menu.sel;
    if (sel){ ctx.fillStyle = 'rgba(201,160,64,0.25)'; ctx.fillRect(x + 14, iy - 4*U, w - 28, lh - 4*U); }
    const col = it.ok ? (sel ? '#ffffff' : '#e8dcc0') : '#777';
    otext((sel ? '> ' : '  ') + it.label, x + 24*U, iy, col, fs);
    if (it.sub) otext(it.sub, x + w - 24*U, iy, it.ok ? '#7dff5a' : '#8a6a6a', fs, 'right');
    if (sel && it.info) otext(it.info, x + 46*U, iy + fs + 1, '#bba', Math.round(12*U));
  });
  otext(menu.locked ? 'W/S: CHOOSE   ENTER: CONFIRM' : 'W/S: CHOOSE   ENTER: BUY   ESC: LEAVE', VW/2, y + h - 26*U, '#999', Math.round(12*U), 'center');
}
function drawSkull(x, y, lit, U){
  ctx.save(); ctx.translate(x, y); ctx.scale(U*1.4, U*1.4);
  ctx.fillStyle = '#000'; ctx.fillRect(-7, -1, 15, 15);
  ctx.fillStyle = lit ? '#ffffff' : '#c8c8c8';
  ctx.fillRect(-5.5, 0, 12, 8.5); ctx.fillRect(-3, 8.5, 7, 3.5);
  ctx.fillStyle = '#000'; ctx.fillRect(-3.5, 3, 3, 3); ctx.fillRect(2, 3, 3, 3); ctx.fillRect(0, 7, 1, 2);
  ctx.restore();
}
function drawTitle(){
  const qsz = Math.round(clamp(VH*0.3, 150, 260)), wide = VW > 900;
  const tcx = wide ? (VW - qsz - 64)/2 : VW/2, room = (wide ? VW - qsz - 64 : VW) - 40;
  ctx.fillStyle = 'rgba(0,10,30,0.35)'; ctx.fillRect(0, 0, VW, VH);
  const big = Math.min(96, Math.floor(VW/7));
  otext('BROADSIDE', tcx, VH*0.2, '#ffd23f', big, 'center');
  otext('MINI', tcx, VH*0.2 + big*1.05, '#ffffff', Math.floor(big*0.5), 'center');
  let fs = Math.max(13, Math.round(big*0.2));
  ctx.font = `${fs}px Impact, "Arial Black", sans-serif`;
  const widest = Math.max(...['Hunt pirate lords and the king\'s treasure galleons. Board, plunder, claim or sell any ship.'].map(l => ctx.measureText(l).width));
  if (widest > room) fs = Math.max(10, Math.floor(fs*room/widest));
  const lines = ['Hunt pirate lords and the king\'s treasure galleons. Board, plunder, claim or sell any ship.', 'Explore great volcanic islands, raid camps, fish and trade at three ports.', 'Build a fleet from a sloop to a towering man-o\'-war. Mind the navy.'];
  lines.forEach((l, i) => otext(l, tcx, VH*0.2 + big*1.8 + i*(fs + 8), '#cfe8ff', fs, 'center'));
  if (Math.sin(time*4) > -0.2) otext(padLinked() ? 'PRESS START ON YOUR PHONE' : hadSave ? 'PRESS START ON THE PHONE OR ENTER TO CONTINUE' : 'PRESS START ON THE PHONE, OR ENTER', tcx, VH*0.74, '#ffffff', Math.round(fs*1.4), 'center');
  if (hadSave) otext('N: START A NEW GAME', tcx, VH*0.74 + fs*2.4, '#aaaaaa', fs, 'center');
  otext(`G: GRAPHICS: ${graphicsMode === 'high' ? 'HIGH FIDELITY (ORIGINAL)' : 'FAST TV / PERFORMANCE'}`, tcx, VH*0.74 + fs*3.6, '#ffd23f', Math.round(fs*0.9), 'center');
  otext('F3: PERFORMANCE OVERLAY', tcx, VH*0.74 + fs*4.8, '#7da8cc', Math.round(fs*0.8), 'center');
  drawPhonePanel(VW - qsz - 64, Math.max(16, VH*0.5 - (qsz + 132)/2), qsz);
}

/* ---------- boot + loop ---------- */
let last = performance.now();
let _fCount = 0, _fTimeSum = 0, _fLastSec = performance.now();
let _fBakeSum = 0, _fUpdSum = 0, _fRenSum = 0;

function frame(now){
  if (!now) now = performance.now();
  const tStart = performance.now();
  const dt = Math.min(0.05, Math.max(0.001, (now - last)/1000)); last = now;
  TV.stateT += dt; if (TV.stateT > 0.2){ TV.stateT = 0; tvSendState(false); }
  
  updateBgm();
  const tB0 = performance.now();
  bgBake(state === 'play' ? 1.0 : 3.0);
  const tB1 = performance.now();
  
  const tU0 = performance.now();
  if (!paused) update(dt);
  const tU1 = performance.now();
  
  const tR0 = performance.now();
  render();
  const tEnd = performance.now();

  _fBakeSum += (tB1 - tB0);
  _fUpdSum += (tU1 - tU0);
  _fRenSum += (tEnd - tR0);
  _fTimeSum += (tEnd - tStart);
  _fCount++;
  if (now - _fLastSec >= 1000){
    const avgMs = _fTimeSum / Math.max(1, _fCount);
    perfMetrics.fps = Math.round((_fCount * 1000) / (now - _fLastSec));
    perfMetrics.frameTime = avgMs;
    perfMetrics.bakeMs = _fBakeSum / Math.max(1, _fCount);
    perfMetrics.updateMs = _fUpdSum / Math.max(1, _fCount);
    perfMetrics.renderMs = _fRenSum / Math.max(1, _fCount);
    _fCount = 0; _fTimeSum = 0; _fBakeSum = 0; _fUpdSum = 0; _fRenSum = 0;
    _fLastSec = now;
  }

  requestAnimationFrame(frame);
}

(function boot(){
  state = 'loading';
  try { tvNetStart(); } catch(e){ console.error('tvNetStart', e); }
  const tasks = bakeTasks(); let i = 0;
  const drawProgress = () => {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = '#0e3456'; ctx.fillRect(0, 0, VW, VH);
    otext('CHARTING THE SEAS...', VW/2, VH/2 - 40, '#ffd23f', 28, 'center');
    const w = Math.min(360, VW - 60);
    ctx.fillStyle = '#000'; ctx.fillRect(VW/2 - w/2 - 3, VH/2 + 4, w + 6, 18);
    ctx.fillStyle = '#ffd23f'; ctx.fillRect(VW/2 - w/2, VH/2 + 7, w*i/Math.max(1, tasks.length), 12);
  };
  const step = () => {
    try {
      const t0 = performance.now();
      while (i < tasks.length && performance.now() - t0 < 60) {
        try { tasks[i++](); } catch(errTask) { console.error('Bake task error:', errTask); }
      }
      drawProgress();
      if (i < tasks.length){ setTimeout(step, 0); return; }
      for (const c of camps) spawnCrew(c);
      if (savedExtra && Array.isArray(savedExtra.camps)) savedExtra.camps.forEach((o, i) => { if (o && camps[i]){ camps[i].chest.open = true; for (const p of camps[i].crew) p.dead = true, p.deadT = 99; } });
      state = 'title';
      last = performance.now();
      requestAnimationFrame(frame);
    } catch(errBoot) {
      console.error('Boot error:', errBoot);
      if (window.logTvError) {
        window.logTvError('[BOOT ERROR] ' + (errBoot.message || errBoot) + (errBoot.stack ? '\n' + errBoot.stack : ''));
      }
      state = 'title';
      last = performance.now();
      requestAnimationFrame(frame);
    }
  };
  drawProgress();
  setTimeout(step, 30);
})();
</script>
<script>
// one file, two roles: ?pad=CODE (or just ?pad) makes this page the phone controller, otherwise it is the TV game
(function(){
  try {
    var search = location.search || '';
    var isPad = search.indexOf('pad') !== -1;
    if (isPad){
      var c = document.getElementById('c');
      if (c && c.parentNode) c.parentNode.removeChild(c);
      var m = search.match(/pad=([A-Za-z0-9]+)/);
      PAD.start(m ? m[1] : '');
      return;
    }
    var srcEl = document.getElementById('game-src');
    if (!srcEl) throw new Error('game-src script element missing');
    var s = document.createElement('script');
    s.textContent = srcEl.textContent;
    document.body.appendChild(s);
  } catch(err) {
    if (window.logTvError) {
      window.logTvError('[LOADER ERROR] ' + (err.message || err) + (err.stack ? '\n' + err.stack : ''));
    }
    console.error(err);
  }
})();
</script>
