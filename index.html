<script>
/* Smart TV Error Console & Polyfills */
(function(){
  window.copyTvError = function() {
    var t = document.getElementById('tv-err-text');
    var btn = document.getElementById('tv-err-copy');
    var text = (t ? (t.innerText || t.textContent) : '') || '';
    if (!text) return;

    function setBtn(ok) {
      if (!btn) return;
      btn.innerHTML = ok ? '✅ COPIED!' : '⚠️ SELECT & COPY';
      btn.style.background = ok ? '#2e7d32' : '#d32f2f';
      btn.style.color = '#fff';
      setTimeout(function(){
        btn.innerHTML = '📋 COPY ERROR';
        btn.style.background = '#ffdd44';
        btn.style.color = '#111';
      }, 2500);
    }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function(){
        setBtn(true);
      }).catch(function(){
        fallbackCopy(text);
      });
    } else {
      fallbackCopy(text);
    }

    function fallbackCopy(str) {
      try {
        var ta = document.createElement('textarea');
        ta.value = str;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        ta.style.top = '0';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        setBtn(ok);
      } catch(err) {
        setBtn(false);
      }
    }
  };

  window.closeTvError = function() {
    var b = document.getElementById('tv-err');
    if (b) b.style.display = 'none';
  };

  var _lastLoggedErr = '', _errRepeatCount = 0;
  window.logTvError = function(msg) {
    try {
      if (msg === _lastLoggedErr) {
        _errRepeatCount++;
        var t = document.getElementById('tv-err-text');
        if (t && _errRepeatCount % 30 === 0) {
          t.textContent = _lastLoggedErr + '\n[Repeated ' + _errRepeatCount + ' times]';
        }
        return;
      }
      _lastLoggedErr = msg;
      _errRepeatCount = 1;
      var b = document.getElementById('tv-err');
      if (!b) {
        b = document.createElement('div');
        b.id = 'tv-err';
        b.style.cssText = 'position:fixed;top:0;left:0;right:0;max-height:48vh;overflow:auto;background:rgba(180,10,10,0.96);color:#fff;font-family:monospace;padding:12px;z-index:99999999;border-bottom:3px solid #ffdd44;box-shadow:0 4px 15px rgba(0,0,0,0.5);display:none;';
        b.innerHTML = '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,0.3);flex-wrap:wrap">' +
          '<span style="font-weight:bold;color:#ffdd44;font-size:14px;letter-spacing:1px">⚠️ SYSTEM ERROR / DIAGNOSTIC</span>' +
          '<div style="display:flex;gap:8px">' +
            '<button id="tv-err-copy" onclick="window.copyTvError()" style="background:#ffdd44;color:#111;font-weight:bold;font-size:14px;border:none;border-radius:4px;padding:6px 14px;cursor:pointer;box-shadow:0 2px 5px rgba(0,0,0,0.4)">📋 COPY ERROR</button>' +
            '<button id="tv-err-close" onclick="window.closeTvError()" style="background:rgba(255,255,255,0.2);color:#fff;font-weight:bold;font-size:14px;border:1px solid rgba(255,255,255,0.4);border-radius:4px;padding:6px 12px;cursor:pointer">✕ CLOSE</button>' +
          '</div></div>' +
          '<pre id="tv-err-text" style="margin:0;max-height:34vh;overflow:auto;user-select:text;-webkit-user-select:text;font-family:monospace;font-size:13px;line-height:1.4;white-space:pre-wrap;word-break:break-word"></pre>';
        (document.body || document.documentElement).appendChild(b);
      }
      var t = document.getElementById('tv-err-text');
      if (t) {
        if (t.textContent.length > 5000) t.textContent = t.textContent.slice(-3000);
        t.textContent += (t.textContent ? '\n' : '') + msg;
      }
      b.style.display = 'block';
    } catch(errLog) {
      console.error('Failed to log TV error:', errLog);
    }
  };

  window.addEventListener('error', function(e){
    var msg = (e.message || e) + '';
    if (/^Script error\.?$/i.test(msg.trim())) return;
    var loc = (e.filename ? e.filename.split('/').pop() : 'inline') + ':' + (e.lineno || '?');
    var stack = (e.error && e.error.stack) ? ('\n' + e.error.stack) : '';
    window.logTvError('[TV ERROR] ' + msg + ' (' + loc + ')' + stack);
  });
  window.addEventListener('unhandledrejection', function(e){
    var msg = '' + (e.reason && (e.reason.message || e.reason.name) ? (e.reason.message || e.reason.name) : e.reason);
    if (/orientation|fullscreen|abort|user gesture|not allowed|play\(\)/i.test(msg)) return;
    var stack = (e.reason && e.reason.stack) ? ('\n' + e.reason.stack) : '';
    window.logTvError('[TV REJECTION] ' + msg + stack);
  });
  if (typeof DOMMatrix === 'undefined') {
    window.DOMMatrix = window.WebKitCSSMatrix || function(init) {
      this.a = 1; this.b = 0; this.c = 0; this.d = 1; this.e = 0; this.f = 0;
      if (Array.isArray(init) && init.length >= 6) {
        this.a = init[0]; this.b = init[1]; this.c = init[2];
        this.d = init[3]; this.e = init[4]; this.f = init[5];
      }
      this.translate = function(tx, ty) {
        this.e += (tx || 0) * this.a + (ty || 0) * this.c;
        this.f += (tx || 0) * this.b + (ty || 0) * this.d;
        return this;
      };
      this.scale = function(sx, sy) {
        sx = sx || 1; sy = (sy !== undefined ? sy : sx);
        this.a *= sx; this.b *= sx;
        this.c *= sy; this.d *= sy;
        return this;
      };
      this.rotate = function(deg) {
        var rad = (deg || 0) * Math.PI / 180;
        var cos = Math.cos(rad), sin = Math.sin(rad);
        var a = this.a, b = this.b, c = this.c, d = this.d;
        this.a = a * cos + c * sin;
        this.b = b * cos + d * sin;
        this.c = -a * sin + c * cos;
        this.d = -b * sin + d * cos;
        return this;
      };
    };
  }
  if (typeof Element !== 'undefined' && !Element.prototype.remove) {
    Element.prototype.remove = function() {
      if (this.parentNode) this.parentNode.removeChild(this);
    };
  }
  if (typeof TextEncoder === 'undefined') {
    window.TextEncoder = function() {
      this.encode = function(str) {
        var arr = [];
        for (var i = 0; i < str.length; i++) {
          var c = str.charCodeAt(i);
          if (c < 128) arr.push(c);
          else if (c < 2048) { arr.push((c >> 6) | 192); arr.push((c & 63) | 128); }
          else { arr.push((c >> 12) | 224); arr.push(((c >> 6) & 63) | 128); arr.push((c & 63) | 128); }
        }
        return new Uint8Array(arr);
      };
    };
  }
  if (typeof URLSearchParams === 'undefined') {
    window.URLSearchParams = function(search) {
      var dict = {};
      var str = (search || '').replace(/^\?/, '');
      if (str) {
        var pairs = str.split('&');
        for (var i = 0; i < pairs.length; i++) {
          var parts = pairs[i].split('=');
          dict[decodeURIComponent(parts[0])] = decodeURIComponent(parts[1] || '');
        }
      }
      this.has = function(k) { return Object.prototype.hasOwnProperty.call(dict, k); };
      this.get = function(k) { return dict[k] !== undefined ? dict[k] : null; };
    };
  }
})();
</script>

    </div>
  </div>
  <pre id="tv-err-text" style="margin:0;max-height:34vh;overflow:auto;user-select:text;-webkit-user-select:text;font-family:monospace;font-size:13px;line-height:1.4;white-space:pre-wrap;word-break:break-word"></pre>

<script>
'use strict';
/* =========================================================
   Shared by the TV game and the phone controller:
   a tiny QR encoder and a PeerJS loader.
   ========================================================= */
const QR = (() => {
  const ECC = { L: [-1,7,10,15,20,26,18,20,24,30,18,20,24,26,30,22,24,28,30,28,28,28,28,30,30,26,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30],
                M: [-1,10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26,26,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28] };
  const NB  = { L: [-1,1,1,1,1,1,2,2,2,2,4,4,4,4,4,6,6,6,6,7,8,8,9,9,10,12,12,12,13,14,15,16,17,18,19,19,20,21,22,24,25],
                M: [-1,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16,17,17,18,20,21,23,25,26,28,29,31,33,35,37,38,40,43,45,47,49] };
  const FMT = { L: 1, M: 0 };
  const rawMods = v => { let r = (16*v + 128)*v + 64; if (v >= 2){ const n = Math.floor(v/7) + 2; r -= (25*n - 10)*n - 55; if (v >= 7) r -= 36; } return r; };
  const dataCW = (v, e) => Math.floor(rawMods(v)/8) - ECC[e][v]*NB[e][v];
  const mul = (x, y) => { let z = 0; for (let i = 7; i >= 0; i--){ z = (z << 1) ^ ((z >>> 7)*0x11D); z ^= ((y >>> i) & 1)*x; } return z; };
  function divisor(d){
    const r = []; for (let i = 0; i < d - 1; i++) r.push(0); r.push(1);
    let root = 1;
    for (let i = 0; i < d; i++){ for (let j = 0; j < r.length; j++){ r[j] = mul(r[j], root); if (j + 1 < r.length) r[j] ^= r[j+1]; } root = mul(root, 2); }
    return r;
  }
  function remainder(data, div){
    const r = div.map(() => 0);
    for (const b of data){ const f = b ^ r.shift(); r.push(0); div.forEach((c, i) => r[i] ^= mul(c, f)); }
    return r;
  }
  function alignPos(v){
    if (v === 1) return [];
    const n = Math.floor(v/7) + 2, step = v === 32 ? 26 : Math.ceil((v*4 + 4)/(n*2 - 2))*2, res = [6];
    for (let pos = v*4 + 10; res.length < n; pos -= step) res.splice(1, 0, pos);
    return res;
  }
  function encode(text, ecl = 'M'){
    const bytes = typeof TextEncoder !== 'undefined' ? Array.from(new TextEncoder().encode(text)) : Array.from(text).map(c => c.charCodeAt(0) & 0xff);
    let ver = 1, cap = 0;
    for (; ver <= 40; ver++){ cap = dataCW(ver, ecl)*8; if (4 + (ver < 10 ? 8 : 16) + bytes.length*8 <= cap) break; }
    const bb = [], app = (v, n) => { for (let i = n - 1; i >= 0; i--) bb.push((v >>> i) & 1); };
    app(4, 4); app(bytes.length, ver < 10 ? 8 : 16); for (const b of bytes) app(b, 8);
    app(0, Math.min(4, cap - bb.length)); app(0, (8 - bb.length % 8) % 8);
    for (let p = 0xEC; bb.length < cap; p ^= 0xEC ^ 0x11) app(p, 8);
    const data = []; for (let i = 0; i < bb.length; i += 8){ let v = 0; for (let j = 0; j < 8; j++) v = (v << 1) | bb[i + j]; data.push(v); }
    const nb = NB[ecl][ver], el = ECC[ecl][ver], raw = Math.floor(rawMods(ver)/8), nShort = nb - raw % nb, shortLen = Math.floor(raw/nb);
    const div = divisor(el), blocks = [];
    for (let i = 0, k = 0; i < nb; i++){
      const dat = data.slice(k, k + shortLen - el + (i < nShort ? 0 : 1)); k += dat.length;
      const ecc = remainder(dat, div); if (i < nShort) dat.push(0); blocks.push(dat.concat(ecc));
    }
    const all = [];
    for (let i = 0; i < blocks[0].length; i++) blocks.forEach((b, j) => { if (i !== shortLen - el || j >= nShort) all.push(b[i]); });
    const size = ver*4 + 17, M = [], F = [];
    for (let y = 0; y < size; y++){ M.push(new Array(size).fill(false)); F.push(new Array(size).fill(false)); }
    const set = (x, y, d) => { M[y][x] = d; F[y][x] = true; };
    for (let i = 0; i < size; i++){ set(6, i, i % 2 === 0); set(i, 6, i % 2 === 0); }
    const finder = (x, y) => { for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++){ const d = Math.max(Math.abs(dx), Math.abs(dy)), xx = x + dx, yy = y + dy; if (xx >= 0 && xx < size && yy >= 0 && yy < size) set(xx, yy, d !== 2 && d !== 4); } };
    finder(3, 3); finder(size - 4, 3); finder(3, size - 4);
    const ap = alignPos(ver), na = ap.length;
    for (let i = 0; i < na; i++) for (let j = 0; j < na; j++){
      if ((i === 0 && j === 0) || (i === 0 && j === na - 1) || (i === na - 1 && j === 0)) continue;
      for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) set(ap[i] + dx, ap[j] + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
    }
    const drawFormat = mask => {
      const d = FMT[ecl] << 3 | mask; let rem = d;
      for (let i = 0; i < 10; i++) rem = (rem << 1) ^ ((rem >>> 9)*0x537);
      const bits = (d << 10 | rem) ^ 0x5412, g = i => ((bits >>> i) & 1) === 1;
      for (let i = 0; i <= 5; i++) set(8, i, g(i));
      set(8, 7, g(6)); set(8, 8, g(7)); set(7, 8, g(8));
      for (let i = 9; i < 15; i++) set(14 - i, 8, g(i));
      for (let i = 0; i < 8; i++) set(size - 1 - i, 8, g(i));
      for (let i = 8; i < 15; i++) set(8, size - 15 + i, g(i));
      set(8, size - 8, true);
    };
    drawFormat(0);
    if (ver >= 7){
      let rem = ver; for (let i = 0; i < 12; i++) rem = (rem << 1) ^ ((rem >>> 11)*0x1F25);
      const bits = ver << 12 | rem;
      for (let i = 0; i < 18; i++){ const bit = ((bits >>> i) & 1) === 1, a = size - 11 + i % 3, b = Math.floor(i/3); set(a, b, bit); set(b, a, bit); }
    }
    let bi = 0;
    for (let right = size - 1; right >= 1; right -= 2){
      if (right === 6) right = 5;
      for (let vert = 0; vert < size; vert++) for (let j = 0; j < 2; j++){
        const x = right - j, up = ((right + 1) & 2) === 0, y = up ? size - 1 - vert : vert;
        if (!F[y][x] && bi < all.length*8){ M[y][x] = ((all[bi >>> 3] >>> (7 - (bi & 7))) & 1) === 1; bi++; }
      }
    }
    const applyMask = m => {
      for (let y = 0; y < size; y++) for (let x = 0; x < size; x++){
        let inv;
        switch (m){
          case 0: inv = (x + y) % 2 === 0; break;
          case 1: inv = y % 2 === 0; break;
          case 2: inv = x % 3 === 0; break;
          case 3: inv = (x + y) % 3 === 0; break;
          case 4: inv = (Math.floor(x/3) + Math.floor(y/2)) % 2 === 0; break;
          case 5: inv = x*y % 2 + x*y % 3 === 0; break;
          case 6: inv = (x*y % 2 + x*y % 3) % 2 === 0; break;
          default: inv = ((x + y) % 2 + x*y % 3) % 2 === 0;
        }
        if (!F[y][x] && inv) M[y][x] = !M[y][x];
      }
    };
    const penalty = () => {
      let p = 0, dark = 0;
      for (let a = 0; a < size; a++){
        let rx = 1, ry = 1;
        for (let b = 1; b < size; b++){
          if (M[a][b] === M[a][b-1]){ rx++; if (rx === 5) p += 3; else if (rx > 5) p++; } else rx = 1;
          if (M[b][a] === M[b-1][a]){ ry++; if (ry === 5) p += 3; else if (ry > 5) p++; } else ry = 1;
        }
      }
      for (let y = 0; y < size - 1; y++) for (let x = 0; x < size - 1; x++){ const c = M[y][x]; if (c === M[y][x+1] && c === M[y+1][x] && c === M[y+1][x+1]) p += 3; }
      for (const row of M) for (const c of row) if (c) dark++;
      const total = size*size;
      p += (Math.ceil(Math.abs(dark*20 - total*10)/total) - 1)*10;
      return p;
    };
    let best = 0, bestP = Infinity;
    for (let m = 0; m < 8; m++){ applyMask(m); drawFormat(m); const pp = penalty(); if (pp < bestP){ bestP = pp; best = m; } applyMask(m); }
    applyMask(best); drawFormat(best);
    return M;
  }
  return { encode };
})();

const NET = (() => {
  const URLS = ['./peerjs.min.js',
                'peerjs.min.js',
                '/peerjs.min.js',
                '/Mini/peerjs.min.js',
                'https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js',
                'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js',
                'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js'];
  let promise = null;
  function loadPeer(){
    if (promise) return promise;
    promise = new Promise(res => {
      if (window.Peer) return res(true);
      let i = 0;
      const next = () => {
        if (i >= URLS.length) return res(false);
        const s = document.createElement('script'); let done = false;
        const fail = () => { if (done) return; done = true; if (s.parentNode) s.parentNode.removeChild(s); next(); };
        s.src = URLS[i++]; s.async = true;
        s.crossOrigin = 'anonymous';
        s.onload = () => { if (done) return; done = true; res(!!window.Peer); };
        s.onerror = fail; setTimeout(fail, 7000);
        document.head.appendChild(s);
      };
      next();
    });
    return promise;
  }
  const peerId = code => 'broadside-mini-' + code.toLowerCase();
  const channel = code => 'broadside-mini-' + code.toUpperCase();
  return { loadPeer, peerId, channel };
})();

/* =========================================================

const PAD = (() => {
  const $ = s => document.querySelector(s);
  const id = Math.random().toString(36).slice(2, 10);
  let conn = null, peer = null, bc = null, code = '', st = null, seq = 0, lastTV = 0, layoutKey = '';
  let jx = 0, jy = 0, held = 0, lastIn = '', lastInT = 0, stickPtr = null, sx = 0, sy = 0;

  function send(o){
    o.id = id; o.q = ++seq;
    try { if (conn && conn.open) conn.send(o); } catch(e){}
    try { if (bc) bc.postMessage(o); } catch(e){}
  }
  function status(text, kind){ $('#pstat').textContent = text; $('#pdot').className = kind || ''; }

  function onTV(d){
    if (!d || typeof d !== 'object' || !d.tv) return;

    else if (d.t === 'fx' && navigator.vibrate){ try { navigator.vibrate(d.k === 'boom' ? [50, 40, 90] : d.k === 'coin' ? 15 : 45); } catch(e){} }
  }

  function connect(c){
    code = c.toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);

    try { history.replaceState(null, '', location.pathname + '?pad=' + code); } catch(e){}
    try { bc = new BroadcastChannel(NET.channel(code)); bc.onmessage = e => onTV(e.data); } catch(e){}
    send({ t: 'hello' });
    NET.loadPeer().then(ok => {
      if (!ok){ if (!st) status('NO INTERNET LINK - SAME-BROWSER ONLY', 'bad'); return; }
      peer = new Peer();
      const open = () => {
        conn = peer.connect(NET.peerId(code), { reliable: true });
        conn.on('open', () => { send({ t: 'hello' }); });
        conn.on('data', onTV);
        conn.on('close', () => { status('RECONNECTING...', 'bad'); setTimeout(open, 1500); });
      };
      peer.on('open', open);
      peer.on('error', e => {
        if (e.type === 'peer-unavailable'){ status('TV ' + code + ' NOT FOUND - IS THE GAME OPEN?', 'bad'); setTimeout(open, 2500); }
        else status('LINK PROBLEM: ' + e.type, 'bad');
      });
      peer.on('disconnected', () => { try { peer.reconnect(); } catch(e){} });
    });
    setInterval(() => {
      if (st && performance.now() - lastTV > 3500) status('LOST THE TV - RECONNECTING...', 'bad');
      if (performance.now() - lastTV > 3000) send({ t: 'hello' });
    }, 1500);
    requestAnimationFrame(loop);
  }

  // the input stream: joystick + held buttons, sent ~25 times a second while active
  function loop(){
    const now = performance.now(), s = JSON.stringify([jx.toFixed(2), jy.toFixed(2), held]);
    if (s !== lastIn || ((jx || jy || held) && now - lastInT > 40) || now - lastInT > 400){
      lastIn = s; lastInT = now; send({ t: 'in', jx: +jx.toFixed(3), jy: +jy.toFixed(3), b: held });
    }

  // floating joystick on the left half
  function setupStick(){
    const zone = $('#pstick'), base = $('#pbase'), knob = $('#pknob'), R = 64;
    const place = (el, x, y) => { el.style.left = x + 'px'; el.style.top = y + 'px'; };
    const reset = () => { const r = zone.getBoundingClientRect(); place(base, r.width/2, r.height*0.55); place(knob, r.width/2, r.height*0.55); jx = 0; jy = 0; };
    zone.addEventListener('pointerdown', e => {
      if (stickPtr !== null) return;
      stickPtr = e.pointerId; zone.setPointerCapture(e.pointerId);
      const r = zone.getBoundingClientRect(); sx = e.clientX - r.left; sy = e.clientY - r.top;
      place(base, sx, sy); place(knob, sx, sy); $('#phint').style.opacity = 0;
    });
    zone.addEventListener('pointermove', e => {
      if (e.pointerId !== stickPtr) return;
      const r = zone.getBoundingClientRect(); let dx = e.clientX - r.left - sx, dy = e.clientY - r.top - sy;
      const d = Math.hypot(dx, dy); if (d > R){ dx *= R/d; dy *= R/d; }
      place(knob, sx + dx, sy + dy); jx = dx/R; jy = dy/R;
    });
    const end = e => { if (e.pointerId !== stickPtr) return; stickPtr = null; reset(); };
    zone.addEventListener('pointerup', end); zone.addEventListener('pointercancel', end);
    addEventListener('resize', reset); reset();
  }

  // buttons: some are held (fire, attack), some are taps (action, fish...)
  const BIT = { fire: 8, port: 1, stbd: 2, attack: 4, parry: 16 };
  const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  function btn(label, n, cls = '', extra = ''){ return `<button class="${cls}" data-n="${n}">${label}${extra}</button>`; }
  

function render(){
    if (!st) return;
    const s = st;
    $('#pgold').textContent = '$' + s.gold;
    $('#pstars').textContent = '★'.repeat(s.wanted) + '☆'.repeat(5 - s.wanted);
    $('#php').style.width = Math.round(Math.max(0, Math.min(1, s.hp))*100) + '%';
    $('#pship').textContent = s.ship || '';
    const pr = (s.prompts || []).join('   ');
    $('#pprompt').textContent = s.msg ? s.msg : pr;
    const act = (s.prompts || []).find(p => p.startsWith('F:'));
    const reel = (s.prompts || []).some(p => p.startsWith('R: REEL'));
    let key = s.scr, html = '';
    if (s.scr === 'loading'){ html = '<div style="grid-column:span 3;text-align:center;align-self:center;font-size:22px">THE TV IS LOADING THE SEAS...</div>'; }
    else if (s.scr === 'title'){
      html = btn('START', 'start', 'big gold') + (s.hadSave ? btn('NEW GAME', 'new', 'dim') : '') +
             btn(s.graphics === 'high' ? 'GRAPHICS:<br>HIGH' : 'GRAPHICS:<br>FAST', 'graphics', 'mini');
      key += s.hadSave + s.graphics;
    } else if (s.scr === 'menu'){
      const m = s.menu;
      if (m.yard){
        const y = m.yard, curOpt = y.opts[y.opt] || {};
        key += 'yard|' + y.tab + '|' + y.opt + '|' + s.gold + '|' + JSON.stringify(y.opts);
        html = `<div class="menu-hdr">` +
          `<button class="menu-back-btn" data-n="back">◀ LEAVE</button>` +
          `<div class="menu-title-block"><div class="menu-title">${esc(m.title)}</div>` +
          `<div class="menu-sub">💰 GOLD ${s.gold}</div></div>` +
          `</div>` +
          `<div class="yard-tabs-scroll">` +
          y.tabs.map((t, i) => `<button class="yard-tab-btn ${i === y.tab ? 'active' : ''}" data-act="ytab" data-i="${i}">${esc(t)}</button>`).join('') +
          `</div>` +
          `<div class="yard-items-scroll">` +
          y.opts.map((o, i) => `<button class="yard-item-btn ${o.sel ? 'selected' : ''} ${o.ok ? '' : 'dim'}" data-act="yopt" data-i="${i}">` +
            `<div class="item-name">${esc(o.l)}</div>` +
            `<div class="item-sub ${o.owned ? 'owned' : o.ok ? '' : 'expensive'}">${esc(o.s)}</div>` +
            `</button>`).join('') +
          `</div>` +
          (curOpt.info ? `<div class="yard-footer-bar"><div class="yard-footer-info">${esc(curOpt.info)}</div>` +
            (curOpt.ok ? `<button class="yard-buy-action" data-act="ybuy">${curOpt.owned ? 'INSTALLED / OWNED' : 'BUY / FIT: ' + esc(curOpt.s)}</button>` : '') +
            `</div>` : '');
      } else {
        key += JSON.stringify(m.items) + m.sel + m.title;
        html = `<div class="menu-hdr">` +
          (m.locked ? '<div></div>' : `<button class="menu-back-btn" data-n="back">◀ LEAVE</button>`) +
          `<div class="menu-title-block"><div class="menu-title">${esc(m.title)}</div>` +
          (m.sub ? `<div class="menu-sub">${esc(m.sub)}</div>` : '') +
          `</div></div>` +
          `<div class="menu-items-scroll">` +
          m.items.map((it, i) => `<button class="item ${i === m.sel ? 'sel' : ''} ${it.ok ? '' : 'dim'}" data-n="menu" data-i="${i}"><span>${esc(it.l)}</span><small>${esc(it.s)}</small></button>`).join('') +
          `</div>`;
      }
    } else if (s.scr === 'sea'){
      key += (act || '') + reel + s.dinghy;
      html = (s.dinghy ? btn('ROW<br><small style="font-size:13px">(JOYSTICK)</small>', 'none', 'big dim') : btn('FIRE!', 'fire', 'big')) +
        btn(act ? act.slice(3) : 'ACTION', 'act', act ? 'gold' : 'dim') +
        btn(reel ? 'REEL IN!' : 'FISH', 'fish', reel ? 'gold' : '') +
        (s.dinghy ? '' : btn('◀ PORT', 'port') + btn('STBD ▶', 'stbd')) +
        (s.dinghy ? '' : btn('MINE (' + s.mines + ')', 'mine')) +
        btn('REPAIR', 'repair') + btn('MENU', 'menu', 'green') + (s.dinghy ? '' : btn('RAM!', 'ram', 'gold'));
    } else {
      key += (act || '') + reel + s.scr;
      html = btn(s.scr === 'deck' ? 'FIGHT!' : 'CUTLASS', 'attack', 'big') +
        btn(act ? act.slice(3) : 'ACTION', 'act', act ? 'gold' : 'dim') +
        btn(reel ? 'REEL IN!' : 'FISH', 'fish', reel ? 'gold' : '') +
        btn('PARRY', 'parry') + btn('REPAIR SHIP', 'repair') + btn('MENU', 'menu', 'green');
    }

      layoutKey = key;
      const box = $('#pbtns');
      box.className = s.scr === 'menu' ? 'menu-mode' : '';
      box.innerHTML = html;
      $('#pstick').style.display = (s.scr === 'menu') ? 'none' : '';
      $('#pstick').style.visibility = (s.scr === 'title' || s.scr === 'loading') ? 'hidden' : 'visible';
    }
  }
  function setupButtons(){
    const box = $('#pbtns');
    let dragStartY = 0, isDragging = false;
    box.addEventListener('pointerdown', e => {
      dragStartY = e.clientY;
      isDragging = false;
      const b = e.target.closest('button'); if (!b) return;
      const n = b.dataset.n;
      if (navigator.vibrate) try { navigator.vibrate(12); } catch(err){}
      if (n === 'back'){
        send({ t: 'btn', n: 'back' });
        return;
      }
      const act = b.dataset.act;
      if (act === 'ytab'){ send({ t: 'yardTab', tab: +b.dataset.i }); return; }
      if (act === 'yopt'){ send({ t: 'yardOpt', opt: +b.dataset.i }); return; }
      if (act === 'ybuy'){ send({ t: 'yardBuy' }); return; }
      if (BIT[n]){ held |= BIT[n]; b.classList.add('on'); b.setPointerCapture(e.pointerId); b._ptr = e.pointerId; return; }
      if (n === 'menu' && b.dataset.i !== undefined) return;
      if (n && n !== 'none') send({ t: 'btn', n });
    });
    box.addEventListener('pointermove', e => {
      if (Math.abs(e.clientY - dragStartY) > 8) isDragging = true;
    });
    box.addEventListener('click', e => {
      if (isDragging) return;
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.n === 'back'){ send({ t: 'btn', n: 'back' }); return; }
      if (b.dataset.n !== 'menu' || b.dataset.i === undefined) return;
      send({ t: 'menu', i: +b.dataset.i });
    });
    const up = e => {
      const b = e.target.closest && e.target.closest('button'); if (!b) return;
      const n = b.dataset.n;
      if (BIT[n]){ held &= ~BIT[n]; b.classList.remove('on'); }

    box.addEventListener('lostpointercapture', up);
  }

  function start(c){
    document.title = 'Broadside Mini - Controller';
    document.body.style.background = '#08182a';
    $('#pad').hidden = false;
    setupStick(); setupButtons();
    $('#pfull').onclick = () => {
      const el = document.documentElement;
      const req = el.requestFullscreen ? el.requestFullscreen() : (el.webkitRequestFullscreen ? el.webkitRequestFullscreen() : Promise.resolve());
      Promise.resolve(req).then(() => {
        if (screen.orientation && screen.orientation.lock) {
          try {
            const p = screen.orientation.lock('landscape');
            if (p && typeof p.catch === 'function') p.catch(() => {});
          } catch(e){}
        }
      }).catch(() => {});
      wake();
    };

    else {
      $('#pcode').hidden = false;

      $('#pcodego').onclick = go;
      $('#pcodein').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    }
  }
  return { start };
})();

<script id="game-src" type="text/x-game">

/* =========================================================
   BROADSIDE MINI  (v9-mini)  -  TV GAME + PHONE CONTROLLER
   AT SEA : W/S sail, A/D steer, Q/E fire port/starboard, SPACE both,

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let VW = 0, VH = 0, DPR = 1, vignette = null;

let graphicsMode = isTvOrMobile ? 'perf' : 'high'; // High Fidelity by default on PC, Performance on TV/mobile
try {
  const gm = localStorage.getItem('broadside.mini.graphics');
  if (gm === 'high' || gm === 'perf') graphicsMode = gm;
} catch(e){}

function setGraphicsMode(mode){

  try { localStorage.setItem('broadside.mini.graphics', mode); } catch(e){}

  if (typeof msg === 'function') msg(mode === 'high' ? 'GRAPHICS: HIGH FIDELITY (NATIVE RESOLUTION)' : 'GRAPHICS: FAST TV / PERFORMANCE (1080p CAP)', '#ffd23f', 1.8);
}

}

const perfMetrics = { fps: 60, frameTime: 16.6, dpr: 1, show: true, bakeMs: 0, updateMs: 0, renderMs: 0, mode: graphicsMode };
window.perfMetrics = perfMetrics;

const _M_DRIFT = typeof DOMMatrix !== 'undefined' ? new DOMMatrix([1,0,0,1,0,0]) : null;
const _M_SWELL0 = typeof DOMMatrix !== 'undefined' ? new DOMMatrix() : null;
const _M_SWELL1 = typeof DOMMatrix !== 'undefined' ? new DOMMatrix() : null;

  const targetDpr = window.devicePixelRatio || 1;

const TAU = Math.PI * 2;

const PERM = new Uint8Array(512), GRAD = new Float32Array(256);
{ const r = mulberry(777), p = [];
  for (let i = 0; i < 256; i++){ GRAD[i] = r(); p.push(i); }
  for (let i = 255; i > 0; i--){ const j = (r()*(i+1))|0; [p[i],p[j]] = [p[j],p[i]]; }
  for (let i = 0; i < 512; i++) PERM[i] = p[i & 255]; }
function vnoise(x, y, p=4096){
  const xf = Math.floor(x), yf = Math.floor(y), fx = x - xf, fy = y - yf;
  const x0 = ((xf % p) + p) % p, y0 = ((yf % p) + p) % p, x1 = (x0+1) % p, y1 = (y0+1) % p;
  const a = GRAD[PERM[PERM[x0&255] + (y0&255)]], b = GRAD[PERM[PERM[x1&255] + (y0&255)]];
  const c = GRAD[PERM[PERM[x0&255] + (y1&255)]], d = GRAD[PERM[PERM[x1&255] + (y1&255)]];
  const u = fx*fx*(3-2*fx), v = fy*fy*(3-2*fy);
  return a + (b-a)*u + (c-a)*v + (a-b-c+d)*u*v;
}
function fbm(x, y, o=4, p=4096){
  let s = 0, a = 0.5, f = 1, n = 0;
  for (let i = 0; i < o; i++){ s += a*vnoise(x*f, y*f, p*f); n += a; a *= 0.5; f *= 2; }

}

/* ---------- audio & background music ---------- */
let AC = null, muted = false;
let bgmAudio = null, bgmStarted = false, musicEnabled = true;
const bgmBaseVol = 0.18;
let bgmDuckUntil = 0;

function bgmInit(){
  if (bgmAudio){
    if (bgmAudio.paused && musicEnabled && !muted && (state === 'play' || state === 'title')){
      bgmAudio.play().catch(() => {});
    }
    return;
  }
  try {
    bgmAudio = new Audio('bgm.m4a');
    bgmAudio.loop = true;
    bgmAudio.preload = 'auto';
    bgmAudio.volume = (muted || !musicEnabled) ? 0 : bgmBaseVol;
    const p = bgmAudio.play();
    if (p && p.then){
      p.then(() => { bgmStarted = true; })
       .catch(() => { bgmStarted = false; });
    }
  } catch(e){
    console.warn('BGM init error:', e);
  }
}

function bgmDuck(dur = 2.4, duckVol = 0.06){
  bgmDuckUntil = Math.max(bgmDuckUntil, performance.now() + dur * 1000);
}

function updateBgm(){
  if (!bgmAudio) return;
  if (!musicEnabled || muted){
    if (bgmAudio.volume > 0.005) bgmAudio.volume = Math.max(0, bgmAudio.volume - 0.02);
    else if (!bgmAudio.paused) bgmAudio.pause();
    return;
  }
  if (bgmAudio.paused && (state === 'play' || state === 'title')){
    bgmAudio.play().catch(() => {});
  }
  const now = performance.now();
  const target = (now < bgmDuckUntil) ? 0.06 : bgmBaseVol;
  if (Math.abs(bgmAudio.volume - target) > 0.002){
    bgmAudio.volume += (target - bgmAudio.volume) * 0.07;
  }
}

function audioInit(){
  if (!AC){
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
    try { VO.load(); } catch(e) {}
  }
  bgmInit();
}
function noise(vol, dur, freq){
  if (!AC || muted || vol <= 0.01) return;
  const n = Math.floor(AC.sampleRate * dur), b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/n, 3);
  const s = AC.createBufferSource(); s.buffer = b;
  const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq;
  const g = AC.createGain(); g.gain.value = vol;
  s.connect(f); f.connect(g); g.connect(AC.destination); s.start();
}
function blip(freq, dur=0.08, vol=0.15, type='square'){
  if (!AC || muted) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, AC.currentTime); g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + dur);
  o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + dur);
}

const VO = (() => {
  const DIR = 'vo/', clips = {}, last = {}, lastIdx = {};
  let loaded = false, current = null, currentPri = -1, lastAny = -1e9;
  const now = () => performance.now() / 1000;
  function load(){
    if (loaded) return; loaded = true;
    for (const k in VO_LINES){
      clips[k] = [];
      for (let i = 1; i <= VO_LINES[k].n; i++){
        const c = { el: null, ok: false };
        try {
          const el = new Audio();
          el.preload = 'auto';
          el.addEventListener('canplay', () => { c.ok = true; }, { once: true });
          el.addEventListener('error', () => { c.ok = false; }, { once: true });
          el.src = `${DIR}${k}_${i}.mp3`;
          c.el = el;
        } catch(e) {}
        clips[k].push(c);
      }
    }
  }
  function speak(text){
    if (!('speechSynthesis' in window)) return;
    // Don't cut off playing voice mp3
    if (isVoicePlaying()) return;
    if (window.speechSynthesis.speaking) return;
    try {
      const u = new SpeechSynthesisUtterance(text);
      u.rate = 1.15; u.pitch = 0.8; u.volume = 1.0;
      const voices = window.speechSynthesis.getVoices();
      const v = voices.find(v => /en-GB/.test(v.lang)) || voices.find(v => /^en/.test(v.lang));
      if (v) u.voice = v;
      window.speechSynthesis.speak(u);
    } catch(e) {}
  }
  const isVoicePlaying = () => {
    if (!current) return false;
    return !current.paused && !current.ended && current.currentTime > 0;
  };

  function say(key, opt){
    // If a voice clip is already playing, NEVER cut it short - let it finish playing!
    if (isVoicePlaying()) return false;

    const L = VO_LINES[key];
    if (!L || muted) return false;
    const t = now();
    if (t - (last[key] ?? -1e9) < L.cd) return false;
    if (Math.random() > (L.chance ?? 1)) return false;
    if (t - lastAny < 2.5) return false;
    last[key] = t;

    const ready = (clips[key] || []).map((c, i) => ({ c, i })).filter(o => o.c.ok && o.c.el);
    if (!ready.length){
      if (!(opt && opt.noFallback)){
        const phrase = (L.lines && L.lines.length) ? L.lines[Math.floor(Math.random() * L.lines.length)] : L.fallback;
        if (phrase) { speak(phrase); if (typeof bgmDuck === 'function') bgmDuck(2.2, 0.06); }
      }
      return false;
    }
    let pick = ready[Math.floor(Math.random() * ready.length)];
    if (ready.length > 1 && pick.i === lastIdx[key]) pick = ready[(ready.indexOf(pick) + 1) % ready.length];
    
    const el = pick.c.el;
    try { el.currentTime = 0; } catch(e) {}
    el.volume = 1.0;
    el.onended = () => { current = null; };
    const p = el.play(); if (p && p.catch) p.catch(() => {});
    current = el; currentPri = L.pri; lastAny = t; lastIdx[key] = pick.i;
    if (typeof bgmDuck === 'function') bgmDuck(2.5, 0.06);
    return true;
  }
  function available(){ const o = {}; for (const k in clips) o[k] = clips[k].filter(c => c.ok).length; return o; }
  return { load, say, available, LINES: VO_LINES };
})();

const IRES = 1.6;
const WORLD = 15600, CX = WORLD/2, CY = WORLD/2;
const PRE = ['Skull','Turtle','Barnacle','Parrot','Rum','Gull','Coconut',"Dead Man's","Smuggler's",'Mango','Kraken','Lantern','Sharkfin','Pelican',
  'Cutlass','Mermaid','Coral','Bonny','Galleon',"Hangman's",'Siren','Doubloon','Crab','Monkey','Tortuga','Black','Driftwood','Hurricane','Whale','Corsair','Lobster','Bounty'];
const SUF = ['Cay','Key','Isle','Point','Reef','Rock','Island','Atoll'];
const islands = [], rocks = [];

function islR(is, a){
  let r = 1; for (const k of is.h) r += k.a * Math.sin(k.f*a + k.p);
  if (is.el){ const c = Math.cos(a - is.erot), s = Math.sin(a - is.erot); r /= Math.sqrt(c*c/(is.el*is.el) + s*s*is.el*is.el); }
  return is.R * r;
}
// a coarse grid so collision checks only look at nearby islands and rocks
const GRID = 800, GW = Math.ceil(WORLD/GRID), GPAD = 240;
let isGrid = null, rkGrid = null;
const gcell = (x, y) => clamp(Math.floor(y/GRID), 0, GW-1)*GW + clamp(Math.floor(x/GRID), 0, GW-1);
function buildGrid(){
  isGrid = []; rkGrid = [];
  for (let i = 0; i < GW*GW; i++){ isGrid.push([]); rkGrid.push([]); }
  const add = (grid, o, r) => {
    const x0 = clamp(Math.floor((o.x - r)/GRID), 0, GW-1), x1 = clamp(Math.floor((o.x + r)/GRID), 0, GW-1);
    const y0 = clamp(Math.floor((o.y - r)/GRID), 0, GW-1), y1 = clamp(Math.floor((o.y + r)/GRID), 0, GW-1);
    for (let gy = y0; gy <= y1; gy++) for (let gx = x0; gx <= x1; gx++) grid[gy*GW + gx].push(o);
  };
  for (const is of islands) add(isGrid, is, is.max + GPAD);
  for (const r of rocks) add(rkGrid, r, r.r + GPAD);
}
function solidAt(x, y, pad=0){
  const near = isGrid && pad <= GPAD - 10, c = near ? gcell(x, y) : 0;
  for (const is of near ? isGrid[c] : islands){
    const dx = x - is.x, dy = y - is.y, m = is.max + pad;
    if (dx*dx + dy*dy > m*m) continue;
    if (Math.hypot(dx,dy) < islR(is, Math.atan2(dy,dx)) + pad) return is;
  }
  for (const r of near ? rkGrid[c] : rocks){
    const dx = x - r.x, dy = y - r.y, m = r.r + pad;
    if (dx*dx + dy*dy < m*m) return r;
  }
  return null;
}
function islandAt(x, y, k=1){
  for (const is of isGrid && k <= 1.15 ? isGrid[gcell(x, y)] : islands){
    const dx = x - is.x, dy = y - is.y, m = is.max*k;
    if (dx*dx + dy*dy > m*m) continue;
    if (Math.hypot(dx,dy) < islR(is, Math.atan2(dy,dx))*k) return is;
  }
  return null;
}
function inRect(lx, ly, st, pad){
  const c = Math.cos(-st.rot), s = Math.sin(-st.rot), dx = lx - st.x, dy = ly - st.y;
  const rx = dx*c - dy*s, ry = dx*s + dy*c;
  return Math.abs(rx) < st.w/2 + pad && Math.abs(ry) < st.h/2 + pad;
}
function walkable(x, y){
  const is = islandAt(x, y, 0.995); if (!is) return false;
  const lx = x - is.x, ly = y - is.y;
  if (is.volc && Math.hypot(lx - is.vx, ly - is.vy) < is.vr*0.2) return false;   // the crater
  for (const b of is.boulders) if (Math.abs(lx - b.x) < b.r && Math.hypot(lx-b.x, ly-b.y) < b.r*0.75 + 2) return false;
  for (const st of is.structs) if (inRect(lx, ly, st, 2)) return false;
  for (const t of is.trees){ if (!t.down && Math.abs(lx - t.x) < 5 && Math.hypot(lx-t.x, ly-t.y) < 3.6) return false; }
  return true;
}
// mountain ridges and volcano cones on the great landmasses (local coords)
function ridgeH(is, gx, gy, t){
  if (!is.big) return 0;
  const lx = gx - is.x, ly = gy - is.y;
  if (t === undefined) t = Math.hypot(lx, ly)/islR(is, Math.atan2(ly, lx));
  const n = fbm(gx*0.0028 + 11, gy*0.0028 + 7, 4), rdg = 1 - Math.abs(n*2 - 1);
  const mask = smooth(0.36, 0.6, fbm(gx*0.0011 + 3, gy*0.0011 + 9, 2));
  let h = Math.pow(rdg, 4)*7.5*mask*smooth(0.9, 0.45, t)*is.mtn;
  if (is.volc){
    const vd = Math.hypot(lx - is.vx, ly - is.vy), u = clamp(1 - vd/is.vr, 0, 1);
    h += Math.pow(u, 1.5)*7.5 - smooth(is.vr*0.17, 0, vd)*5;
  }
  return h;
}

function makeIsland(x, y, R0, name, opt={}){
  const h = [], calm = opt.port || opt.city || opt.home;
  const nh = opt.big ? 6 : 4;
  for (let i = 0; i < nh; i++) h.push({ f: i+2, a: (opt.big ? srnd(0.05,0.15)/(i*0.45+1) : srnd(0.04,0.15)/(i*0.6+1))*(calm ? 0.55 : 1), p: srnd(0,TAU) });
  const is = { x, y, R: R0, h, pts: [], max: 0, trees: [], structs: [], boulders: [], paths: [], fires: [], name,

const WSTOPS = [

// structures: 'ground' props sit on the floor, 'roof' is drawn raised by perspective

    g.fillStyle = shadeHex(c, 0.78); g.fillRect(-w/2, 0, w, h/2);
    g.strokeStyle = 'rgba(40,15,5,0.35)'; g.lineWidth = 0.4; g.beginPath();
    for (let k = -h/2 + 1.5; k < h/2; k += 1.6){ g.moveTo(-w/2, k); g.lineTo(w/2, k); }
    g.stroke();
    g.fillStyle = shadeHex(c, 0.55); g.fillRect(-w/2, -0.6, w, 1.2);
    g.fillStyle = '#7d7a76'; g.fillRect(w*0.2, -h/2 + 2, 3.5, 3.5);
    g.strokeStyle = 'rgba(30,10,5,0.7)'; g.lineWidth = 0.8; g.strokeRect(-w/2, -h/2, w, h);

}

function* bakeIslandGen(is){

    const c = document.createElement('canvas'); c.width = c.height = W;
    const g = c.getContext('2d'), img = g.createImageData(W, W), D = img.data;
    for (let py = 0; py < W; py++){
      yield;
      const wy = (py+0.5)/SR - ext, wy2 = wy*wy;
      for (let px = 0; px < W; px++){
        const wx = (px+0.5)/SR - ext, d2 = wx*wx + wy2;
        if (d2 > ext2) continue;
        const d = Math.sqrt(d2);
        const r = islR(is, Math.atan2(wy, wx)), dc = d - r, gx = wx + is.x, gy = wy + is.y;
        const s = dc < 0 ? 0 : shelfS(gx, gy, dc, sw), a = 255*(1 - smooth(0.72, 1.0, s));
        if (a < 2) continue;
        const col = waterCol(s, gx, gy), o = (py*W + px)*4;
        D[o] = col[0]; D[o+1] = col[1]; D[o+2] = col[2]; D[o+3] = a;
      }
    }
    g.putImageData(img, 0, 0);
    is.shelf = c; is.sext = ext; }

  const hillAmp = is.port ? 0.3 : is.R > 140 ? 1 : 0.45, shadeK = 7*RES/1.5*(is.big ? 2.6 : 1);

  const rows = [0, 1, 2].map(() => ({ H: new Float32Array(W), T: new Float32Array(W), WB: new Float32Array(W), RR: new Float32Array(W), CF: new Float32Array(W), M: new Float32Array(W) }));

    const R = rows[py % 3]; R.T.fill(9); R.H.fill(0); R.M.fill(0); R.CF.fill(0);
    if (py >= W) return;
    const wy = (py+0.5)/RES - ext, wy2 = wy*wy;
    for (let px = 0; px < W; px++){
      const wx = (px+0.5)/RES - ext, d2 = wx*wx + wy2;

      const d = Math.sqrt(d2);

// islands near you are painted in small slices while you play; far ones are let go to save memory
let bgGen = null, bgIs = null, evictT = 3600;
function bgBake(budget){
  const t0 = performance.now();
  evictT -= 1;
  if (evictT <= 0){
    evictT = 3600;
    for (const is of islands) if (is.cv && is !== bgIs && Math.hypot(is.x - cam.x, is.y - cam.y) - is.max > 10000){ is.cv = null; is.shelf = null; is.baking = false; }
    for (const r of rocks) if (r.cv && Math.hypot(r.x - cam.x, r.y - cam.y) > 6000) r.cv = null;
  }
  while (performance.now() - t0 < budget){
    if (!bgGen){
      let best = null, bd = 4200;
      for (const i of islands){ if (i.cv || i.baking) continue; const d = Math.hypot(i.x - cam.x, i.y - cam.y) - i.max; if (d < bd){ bd = d; best = i; } }
      if (!best) return;
      best.baking = true; bgIs = best; bgGen = bakeIslandGen(best);
    }
    if (bgGen.next().done){ bgGen = null; bgIs = null; }
  }
}

function bakeTasks(){

/* Extreme Weather - Squalls (max once every 15 minutes) */
const weather = { type: 'clear', timer: rand(900, 1200), rain: 0, fog: 0, flash: 0, thunderT: 0 };
const fogBanks = [];
const rainDrops = [];
const RAIN_COUNT = 320;
const RX_BUF = 400, RY_BUF = 400;
for (let i = 0; i < RAIN_COUNT; i++){
  const layer = i % 3; // 0 = background, 1 = midground, 2 = foreground
  rainDrops.push({
    sx: Math.random() * (1920 + RX_BUF * 2) - RX_BUF,
    sy: Math.random() * (1080 + RY_BUF * 2) - RY_BUF,
    z: Math.random() * 500,
    speed: 950 + layer * 160 + Math.random() * 120,
    len: layer === 0 ? (12 + Math.random() * 4) : layer === 1 ? (16 + Math.random() * 5) : (22 + Math.random() * 6),
    layer: layer,

    splashX: 0, splashY: 0
  });
}

}
function updateWeather(dt){
  weather.timer -= dt;
  if (weather.timer <= 0){
    if (weather.type === 'clear'){
      // Start a squall (at most once every 15+ minutes)
      weather.type = 'squall';
      weather.timer = rand(60, 90); // storm lasts 60 to 90 seconds
      VO.say('storm');
      msg('⚡ SQUALL APPROACHING! REEF THE SAILS!', '#6fa8ff', 3);
    } else {
      // Clear up: guaranteed at least 15 minutes before the next storm!
      if (weather.type !== 'clear') VO.say('weather_clears');
      weather.type = 'clear';
      weather.timer = rand(900, 1200); // 15 to 20 minutes (900s - 1200s)
      msg('☀️ THE STORM SUBSIDES - FAIR WINDS RETURN', '#7dff5a', 2.5);
    }
  }
  if (weather.type === 'squall'){
    weather.rain = Math.min(1, weather.rain + dt*0.35);
    if (Math.random() < dt * 0.16){
      weather.flash = 0.85;
      weather.thunderT = rand(0.18, 0.5);
    }
    if (weather.thunderT > 0){
      weather.thunderT -= dt;
      if (weather.thunderT <= 0){
        noise(0.5, 1.2, 80);
        shake = Math.max(shake, 3);
      }
    }
  } else {
    weather.rain = Math.max(0, weather.rain - dt*0.25);
  }
  if (weather.flash > 0) weather.flash = Math.max(0, weather.flash - dt * 2.8);
  if (weather.rain > 0.02){
    // Rain falls from player's view down towards ship/ocean (+Y downwards)
    // Angle shifts slightly when moving, never extreme (max +/- 10 degrees)
    const pSpeed = (typeof player !== 'undefined' && player) ? (player.v || 0) : 0;
    const pA = (typeof player !== 'undefined' && player) ? (player.a || 0) : 0;
    const vx = pSpeed * Math.cos(pA);
    const vy = pSpeed * Math.sin(pA);
    const windDriftX = (typeof wind !== 'undefined' ? (wind.spd || 20) * Math.cos(wind.dir || 0) * 0.4 : 0);
    const driftX = -vx * 1.0 + windDriftX;
    const fallVy = 1020 - vy * 0.15;
    let targetAngle = Math.atan2(fallVy, driftX);
    // Limit maximum slant deflection to +/- 0.175 rad (~10 degrees) around PI/2 (straight down)
    targetAngle = clamp(targetAngle, Math.PI/2 - 0.175, Math.PI/2 + 0.175);
    if (weather.rainAngle === undefined) weather.rainAngle = Math.PI/2;
    weather.rainAngle += (targetAngle - weather.rainAngle) * Math.min(1, dt * 5);

    const fallSpeed = 1050;
    const rainVx = Math.cos(weather.rainAngle) * fallSpeed;
    const rainVy = Math.sin(weather.rainAngle) * fallSpeed;

    // Compensate for camera movement so no edge is ever visible
    const camDx = (cam.x - (weather._lastCamX !== undefined ? weather._lastCamX : cam.x)) * cam.z;
    const camDy = (cam.y - (weather._lastCamY !== undefined ? weather._lastCamY : cam.y)) * cam.z;
    weather._lastCamX = cam.x;
    weather._lastCamY = cam.y;

    const minX = -RX_BUF, maxX = VW + RX_BUF, wRange = maxX - minX;
    const minY = -RY_BUF, maxY = VH + RY_BUF, hRange = maxY - minY;

    for (const d of rainDrops){
      if (d.splashT > 0){
        d.splashT -= dt;
        d.splashR += dt * 36;
        d.splashX -= camDx;
        d.splashY -= camDy;
      }
      d.sx += rainVx * dt - camDx;
      d.sy += rainVy * dt - camDy;
      d.z -= d.speed * dt;

      // Toroidal screen wrap: 100% continuous coverage everywhere, zero edge
      while (d.sx < minX) d.sx += wRange;
      while (d.sx > maxX) d.sx -= wRange;
      while (d.sy < minY) d.sy += hRange;
      while (d.sy > maxY) d.sy -= hRange;

      if (d.z <= 0){
        d.splashT = 0.28;
        d.splashMaxT = 0.28;
        d.splashR = 2.0;
        d.splashX = d.sx;
        d.splashY = d.sy;
        d.z = rand(300, 560);
        d.speed = 950 + d.layer * 160 + Math.random() * 120;
        d.len = d.layer === 0 ? (12 + Math.random() * 4) : d.layer === 1 ? (16 + Math.random() * 5) : (22 + Math.random() * 6);
      }
    }
  } else {
    weather._lastCamX = cam.x;
    weather._lastCamY = cam.y;
  }
}

/* Fog of War Exploration Grid (64x64) */
const FOG_RES = 64;
const fogGrid = new Uint8Array(FOG_RES * FOG_RES);
function initFog(){
  const r0 = 5;
  const cx0 = (CX / WORLD * FOG_RES)|0, cy0 = (CY / WORLD * FOG_RES)|0;
  for (let gy = 0; gy < FOG_RES; gy++){
    for (let gx = 0; gx < FOG_RES; gx++){
      if (Math.hypot(gx - cx0, gy - cy0) <= r0){
        fogGrid[gy * FOG_RES + gx] = 1;
      }
    }
  }
}
function updateFogOfWar(px, py){
  const gx = clamp(Math.floor(px / WORLD * FOG_RES), 0, FOG_RES - 1);
  const gy = clamp(Math.floor(py / WORLD * FOG_RES), 0, FOG_RES - 1);
  const rad = 4;
  for (let dy = -rad; dy <= rad; dy++){
    for (let dx = -rad; dx <= rad; dx++){
      if (dx*dx + dy*dy <= rad*rad){
        const nx = gx + dx, ny = gy + dy;
        if (nx >= 0 && nx < FOG_RES && ny >= 0 && ny < FOG_RES){
          fogGrid[ny * FOG_RES + nx] = 1;
        }
      }
    }
  }
}

function makeMoored(x, y, a, rec, owned){
  const s = makeShip('moored', x, y, a);
  s.rec = { ...rec }; delete s.rec.x; delete s.rec.y; delete s.rec.a; delete s.rec.hp;
  s.T = buildT(s.rec); s.hull = rec.hullCol; s.band = rec.band; s.team = 0;
  s.hp = rec.hp !== undefined ? clamp(rec.hp, 1, s.T.hp) : s.T.hp;
  s.owned = !!owned;
  return s;
}
function randomRecord(tier){
  const r = Math.random;
  return { hull: tier, sails: Math.min(3, ((r()*2)|0) + (tier >> 1)), guns: Math.max(1, HULLS[tier].maxGuns - ((r()*3)|0)),
    hullCol: ['#6b4a2e','#2f5a3a','#7a2a2a','#3a3f5a','#c9b48a','#5a5048'][(r()*6)|0],
    deckCol: ['#c8a070','#b89060','#d0b080'][(r()*3)|0],
    sailCol: ['#efe6cf','#ffffff','#e8dcc0','#d8c8a8'][(r()*4)|0],
    band: r() < 0.5 ? null : ['#2a6a9a','#a83a2a','#3a7a3a','#c09030'][(r()*4)|0],
    flag: ['#3a7bd5','#e8e8e8','#c09030','#2f8a3a'][(r()*4)|0],
    name: SHIP_NAMES[(r()*SHIP_NAMES.length)|0] };
}
function mooringSpot(is, a, off){
  for (let k = 0; k < 16; k++){
    const aa = a + (k % 2 ? 1 : -1)*Math.ceil(k/2)*0.12, r = islR(is, aa) + off;
    const x = is.x + Math.cos(aa)*r, y = is.y + Math.sin(aa)*r;
    if (!solidAt(x, y, 26) && !ships.some(o => Math.hypot(o.x - x, o.y - y) < 70 + o.T.len*0.5)) return { x, y, a: aa + Math.PI/2 };
  }
  return null;
}
function placeMoored(is, n, tiers){
  for (let i = 0; i < n; i++){
    const tier = tiers[(Math.random()*tiers.length)|0];
    const sp = mooringSpot(is, Math.random()*TAU, 40 + HULLS[tier].wid*0.6 + Math.random()*10); if (!sp) continue;
    ships.push(makeMoored(sp.x, sp.y, sp.a, randomRecord(tier), false));
  }
}

function nearMoored(){
  if (mode !== 'foot' || hero.dead) return null;

  for (const s of ships){

    const d = Math.hypot(s.x - hero.x, s.y - hero.y);
    if (d < s.T.len*0.5 + 75 && d < bd){ bd = d; best = s; }

function takeShip(s, swap){

  recomputeStats(true); player.hp = s.hp; player.holes = s.holes.slice();
  if (!swap) Object.assign(player, { x: s.x, y: s.y, a: s.a });

}
const nearHideoutSea = () => mode === 'sea' && player.alive && Math.abs(player.v) < 45 && Math.hypot(player.x - home.x, player.y - home.y) < home.max + 170;

const DINGHY_T = { len:16, wid:7, hp:60, guns:0, masts:1, maxv:59, acc:36, turn:2.7, hull:'#8a5a32', deck:'#b88a5a', sail:'#ffffff', team:1, reload:9, cargo:6 };

const navyNear = (x, y, r) => ships.some(n => n.alive && n.type === 'navy' && Math.hypot(n.x - x, n.y - y) < r);
function clearLine(ax, ay, bx, by){
  for (let k = 1; k < 10; k++){ const t = k/10; if (islandAt(ax + (bx - ax)*t, ay + (by - ay)*t, 1.0)) return false; }

const navyWitness = (x, y) => ships.some(n => n.alive && n.type === 'navy' && Math.hypot(n.x - x, n.y - y) < 950 && clearLine(n.x, n.y, x, y));
// can this navy ship see the player's ship? hiding ashore makes you invisible to them

/* =========================================================
   SEA COMBAT
   ========================================================= */
function fire(s, side){
  const key = side > 0 ? 'rr' : 'rl';
  if (s[key] > 0 || !s.T.guns || !s.alive) return;
  s[key] = s.T.reload;
  if (s.type === 'pirate') s.aggroUntil = time + 12;
  const ca = Math.cos(s.a), sa = Math.sin(s.a), px = -sa*side, py = ca*side, n = s.T.guns, gsp = gunSpacing(s.T);
  const vx0 = ca*s.v*0.5, vy0 = sa*s.v*0.5, nd = s.T.decks || 1, heavy = s.T.len >= 80 ? 1.35 : 1;
  for (let j = 0; j < n*nd; j++){
    const i = j % n, dk = (j/n)|0;
    const off = (i - (n-1)/2) * gsp + dk*gsp*0.5;
    const x = s.x + ca*off + px*s.T.wid*(0.6 - dk*0.12), y = s.y + sa*off + py*s.T.wid*(0.6 - dk*0.12);
    const sp = rand(370, 410), jit = rand(-0.06, 0.06);
    const dx = px*Math.cos(jit) - py*Math.sin(jit), dy = px*Math.sin(jit) + py*Math.cos(jit);
    balls.push({ x, y, vx: dx*sp + vx0, vy: dy*sp + vy0, t:0, life: rand(0.72,0.8)*(s.T.len >= 80 ? 1.12 : 1), team: s.team, owner: s, dmg: (s === player ? 12 : 7)*heavy });
    // fire & smoke
    if (graphicsMode === 'high'){
      part(x + dx*4, y + dy*4, dx*40 + vx0, dy*40 + vy0, 0.14, 11, '#fff2b0', 1, 6, 1);
      for (let k = 0; k < 5; k++) part(x + dx*3, y + dy*3, dx*rand(80,180) + rand(-25,25), dy*rand(80,180) + rand(-25,25), rand(0.12,0.26), rand(3,5), Math.random() < 0.5 ? '#ff9a2a' : '#ffd050', 1, 3, 1);
      for (let k = 0; k < 4; k++) part(x, y, dx*rand(60,140) + rand(-30,30), dy*rand(60,140) + rand(-30,30), rand(0.3,0.6), 0.6, '#ffe080', 1, 0, 1);
      for (let k = 0; k < 8; k++) part(x + dx*rand(2,10), y + dy*rand(2,10), dx*rand(20,70) + rand(-12,12) + 8, dy*rand(20,70) + rand(-12,12) - 4, rand(1.4,2.6), rand(3,5), Math.random() < 0.5 ? '#d8d8d8' : '#b8b8b8', 1, 16);
    } else {
      part(x + dx*4, y + dy*4, dx*40 + vx0, dy*40 + vy0, 0.14, 10, '#fff2b0', 1, 5, 1);
      part(x + dx*3, y + dy*3, dx*120 + rand(-15,15), dy*120 + rand(-15,15), 0.18, 4, '#ff9a2a', 1, 3, 1);
      part(x + dx*4, y + dy*4, dx*40 + rand(-8,8), dy*40 + rand(-8,8), rand(0.8,1.4), rand(4,6), '#cccccc', 1, 10);
    }
  }
  s.v -= 6;
  if (s === player){ shake = Math.max(shake, 3.5); VO.say('fire'); }
  noise(0.5*volAt(s.x,s.y), 0.5, 650);
}

function damage(s, d, src){
  if (!s.alive) return;
  if (s === player && player.dinghy) return;
  if (deck && (s === deck.ship || s === deck.other)) return;   // nobody sinks a ship while a boarding fight is on
  s.hp -= d; s.flash = 0.15;
  if (s === player){
    shake = Math.max(shake, 5); hurtT = 0; padFx('hit');
    if (player.hp < player.T.hp * 0.3) VO.say('low_hull');
    else VO.say('taking_damage');
  }
  if (src === player && s !== player){
    VO.say('hit_enemy');
  }
  if (src === player){
    if ((s.type === 'fisher' || s.type === 'trader' || (s.type === 'moored' && !s.owned)) && !s.crimeHit){ s.crimeHit = true; crime(1, s.x, s.y); }
    if (s.type === 'treasure' && !s.crimeHit){ s.crimeHit = true; crime(2, s.x, s.y); msg("YOU'RE ATTACKING THE KING'S GOLD!", '#e8c040', 2.2); }
    if (s.type === 'navy'){ if (!s.crimeHit){ s.crimeHit = true; player.wanted = Math.max(player.wanted, 2); wantedSeen = time; msg('YOU ATTACKED THE NAVY!', '#6fa8ff', 2); } }
    if (s.type === 'pirate' && !(s.aggroUntil > time) && !s.crimeHit){ s.crimeHit = true; crime(1, s.x, s.y); }
  }
  if (s.type === 'fisher'){ s.ai.state = 'flee'; s.ai.t = 7; s.ai.from = src || player; }
  if ((s.type === 'treasure' || s.type === 'trader') && src){ s.ai.angry = src; s.ai.angryT = 25; }
  if (s.type === 'pirate' && src === player && s.ai.state !== 'flee') s.ai.state = 'chase';
  if (s.hp <= 0) sink(s, src);
}

function sink(s, src){
  s.alive = false; s.v = 0;
  sinking.push({ s, t:0 });

  // Floating castaway sailors in the water
  if (!s.dinghy && s.type !== 'fisher'){
    const count = s.T.len > 50 ? Math.floor(rand(3, 5)) : Math.floor(rand(2, 4));
    for (let i = 0; i < count; i++){
      const ang = rand(0, TAU), dist = rand(10, s.T.len*0.35 + 14);
      castaways.push({
        x: s.x + Math.cos(ang)*dist,
        y: s.y + Math.sin(ang)*dist,
        vx: (Math.random()-0.5)*10,
        vy: (Math.random()-0.5)*10,
        a: rand(0, TAU),
        t: 0,
        maxT: rand(75, 130),
        walk: rand(0, 10),
        coat: s.type === 'navy' ? '#204080' : s.type === 'pirate' ? '#8a2020' : '#4a5030',
        shirt: '#ece4d0',
        legs: '#2c2219',
        skin: '#dfb088',
        alive: true
      });
    }
  }
  part(s.x, s.y, 0, 0, 0.45, 26, '#ffa030', 1, 16, 1);
  for (let i = 0; i < 24; i++){ const a = rand(0,TAU), sp = rand(20,100); part(s.x, s.y, Math.cos(a)*sp, Math.sin(a)*sp, rand(4,8), rand(1.4,3), WOOD[(Math.random()*4)|0], 0, 0, 2); }
  for (let i = 0; i < 18; i++) part(s.x+rand(-10,10), s.y+rand(-10,10), rand(-15,15)+10, rand(-15,15)-6, rand(1.5,3), 6, '#4a4a4a', 1, 20);
  ripple(s.x, s.y, 40, 2); ripple(s.x, s.y, 25, 1.5);
  noise(0.6*volAt(s.x,s.y), 0.9, 300);
  let val = 0, kind = 'gold';
  if (s.type === 'pirate') val = s.noLoot ? 0 : s.gold + Math.floor(rand(15,40));
  if (s.type === 'navy') val = Math.floor(rand(30,60)) + (s.tier || 0)*20;
  if (s.type === 'treasure' || s.type === 'trader') val = s.noLoot ? 0 : s.gold;
  if (s.lord && src === player && !s.noLoot) msg('THE PIRATE LORD IS SUNK!', '#ffd23f', 2.6);
  if (s.type === 'treasure' && !s.noLoot) msg("THE KING'S GOLD SPILLS INTO THE SEA!", '#e8c040', 2.6);
  if (s.type === 'fisher'){ val = Math.floor(rand(4,10)); kind = 'fish'; }
  if (s === player){
    VO.say('player_sunk');
    const lost = Math.floor(player.gold / 2);
    player.gold -= lost; val = lost; player.wanted = 0;
    msg('WASTED', '#e8302a', 3.2); deadT = 0; fishing.st = 'idle';
    if (deck) endDeck();
  } else if (src === player){
    VO.say('enemy_sunk');
    if (s.type === 'pirate'){ kills++; if (!s.noLoot) msg('PIRATE SUNK!', '#ffd23f'); }
    else if (s.type === 'fisher') msg('POOR FISHERMEN...', '#ff9a9a');
    else if (s.type === 'navy'){ crime(1, s.x, s.y); msg('NAVY SHIP SUNK!', '#6fa8ff'); }
    else if (s.type === 'trader' && s.destPort && s.tradeGood){
      s.destPort.shortages = s.destPort.shortages || {};
      s.destPort.shortages[s.tradeGood] = (s.destPort.shortages[s.tradeGood] || 0) + 0.8;
      msg(`RAIDED TRADE ROUTE! $${s.destPort.name} IN SHORTAGE OF $${COMMODITIES[s.tradeGood].name}!`, '#ffd23f', 3);
    }
  }
  if (deck && (s === deck.ship || s === deck.other)) endDeck();
  if (val > 0){
    const n = val > 400 ? 6 : val > 150 ? 4 : val > 60 ? 3 : val > 20 ? 2 : 1;
    for (let i = 0; i < n; i++) crates.push({ x: s.x+rand(-20,20)*(1 + n*0.2), y: s.y+rand(-20,20)*(1 + n*0.2), val: Math.ceil(val/n), kind, t:0, ph: rand(0,TAU) });
  }
}

function autoBroadside(s, list){
  for (const t of list){
    if (!t || !t.alive) continue;
    const d = Math.hypot(t.x - s.x, t.y - s.y);
    if (d > 340) continue;
    const rel = angDiff(Math.atan2(t.y - s.y, t.x - s.x), s.a);
    if (Math.abs(rel - Math.PI/2) < 0.3){ fire(s, 1); return; }
    if (Math.abs(rel + Math.PI/2) < 0.3){ fire(s, -1); return; }
  }
}

/* ---------- sea AI ---------- */
function newWander(s, r){ const p = waterPoint(s.x, s.y, r*0.3, r); s.ai.tx = p.x; s.ai.ty = p.y; s.ai.t = rand(10,20); }
function avoid(s, want){
  for (const k of [0, 0.45, -0.45, 0.9, -0.9, 1.5, -1.5, 2.3, -2.3]){
    const a = want + k; let ok = true;
    for (const d of [40, 90, 150]){

    }
    if (ok) return a;
  }
  return want + Math.PI;
}

function shipSize(s){
  if (!s) return 'small';
  if (s === player) return (prog.hull >= 3 || (player.T && player.T.len >= 56)) ? 'large' : 'small';
  const len = (s.T && s.T.len) ? s.T.len : 40;
  return (len >= 56 || (s.tier !== undefined && s.tier >= 3)) ? 'large' : 'small';
}

function canPirateAttack(attacker, target){
  if (!target || !target.alive) return false;
  const aSize = shipSize(attacker);
  const tSize = shipSize(target);
  // Small pirate ships go for small, large for large or small, but NEVER small for large
  if (aSize === 'small' && tSize === 'large') return false;
  return true;
}

function aiPirate(s, dt){
  const ai = s.ai, p = player; ai.t -= dt;
  const dx = p.x - s.x, dy = p.y - s.y, d = Math.hypot(dx,dy), bearing = Math.atan2(dy,dx);
  const hunting = state === 'play' && p.alive && mode === 'sea' && !menu && !deck && !player.dinghy && canPirateAttack(s, p);
  let want = s.a, thr = 0.55;
  if (s.hp < s.T.hp*0.3 && ai.state !== 'flee'){ ai.state = 'flee'; ai.t = 1e9; ft(s.x, s.y-28, '!', '#fff'); }
  // navy hunting me?
  // pirates and the navy are always at war: the nearest warship is the enemy
  let hunter = null, hd = 650;
  for (const n of ships) if (n.alive && n.type === 'navy'){ const d = dist(n, s); if (d < hd){ hd = d; hunter = n; } }

}
function aiNavy(s, dt){
  const ai = s.ai; ai.t -= dt;

  if (ai.escort && ships.indexOf(ai.escort) < 0){ ai.escort = null; s.fleet = false; }
  let tgt = null, best = 1e9;
  const seesYou = player.wanted > 0 && !deck && navySees(s);

  // pirates are always fair game; a pirate clearly closer than you gets dealt with first
  for (const o of ships){
    if (!o.alive || o.type !== 'pirate' || o.surrender) continue;
    if (deck && (o === deck.ship || o === deck.other)) continue;
    const d = dist(o, s);
    if (d < 900 && d < best*0.75){ best = d; tgt = o; }
  }
  if (ai.target !== tgt && tgt && tgt.type === 'pirate' && dist(s, player) < 900 && mode === 'sea' && time - (aiNavy.lastCall || -99) > 6){ aiNavy.lastCall = time; ft(s.x, s.y - 30, 'NAVY ENGAGING!', '#6fa8ff'); }

function aiTrader(s, dt){
  const ai = s.ai; ai.t -= dt;

  if (s.dest && Math.hypot(s.dest.x - s.x, s.dest.y - s.y) < s.dest.max + 320){ const nxt = ports.filter(q => q !== s.dest); s.dest = pick(nxt); }

  if (foe && s.type === 'trader' && dist(foe, s) < 900){ want = Math.atan2(s.y - foe.y, s.x - foe.x); thr = 1; }

function aiFisher(s, dt){
  const ai = s.ai; ai.t -= dt;
  let want = s.a, thr = 0;

    for (const o of ships){
      if (o.alive && o.type === 'pirate' && !o.surrender && dist(o, s) < 240){ ai.state = 'flee'; ai.t = 5; ai.from = o; break; }
    }

  if (ai.state === 'flee'){
    const f = ai.from || player; want = Math.atan2(s.y - f.y, s.x - f.x); thr = 1;

  } else if (ai.state === 'fish'){

  } else {

    if (Math.hypot(ai.tx-s.x, ai.ty-s.y) < 50){ ai.state = 'fish'; ai.t = rand(6,14); }

const WAKE_LIFE = 2.6;
function moveShip(s, dt){
  const T = s.T;
  const slow = s.hp < T.hp*0.3 ? 0.65 : s.hp < T.hp*0.6 ? 0.85 : 1;
  const surge = s.dinghy && s.thr > 0 ? 0.72 + 0.56*Math.max(0, Math.sin(s.rowPh || 0)) : 1;
  let windBoost = 1.0;
  if (!s.dinghy && s.alive){
    const align = Math.cos(s.a - wind.a);
    if (align > 0.65 && s.thr > 0){
      windBoost = 1.0 + 0.10 * ((align - 0.65) / 0.35); // 10% speed increase traveling with the wind
    }
  }
  // Dash mechanic: W + Shift speed surge based on meter refilling over 10s
  // "The larger the ship the slower it should be, BUT the more sails it has the faster it should go again."
  // Lasts for at least 5s, then tapers off smoothly over 1.8s
  let dashBoost = 1.0;
  let dashAccMult = 1.0;
  if (s === player && !s.dinghy){
    if (s.dashMeter === undefined) s.dashMeter = 1.0;
    if (s.dashT > 0){
      s.dashT = Math.max(0, s.dashT - dt);
      const tier = T.tier || 0;
      const sizePenalty = 1.0 - tier * 0.12; // larger ship = slower base dash
      const sails = T.sails || 0;
      const masts = T.masts || 1;
      const sailBonus = sails * 0.25 + (masts - 1) * 0.12; // more sails = faster again
      const maxBoost = 2.125 * sizePenalty * (1.0 + sailBonus); // +25% increased dash speed

      if (s.dashT >= 1.8){
        dashBoost = maxBoost;
      } else {
        const taper = clamp(s.dashT / 1.8, 0, 1);
        dashBoost = 1.0 + (maxBoost - 1.0) * (taper * taper);
      }
      dashAccMult = 3.2;
      const ca = Math.cos(s.a), sa = Math.sin(s.a);
      if (Math.random() < 0.65) part(s.x + ca*T.len*0.48 + rand(-3,3), s.y + sa*T.len*0.48 + rand(-3,3), ca*rand(20,55) + rand(-20,20), sa*rand(20,55) + rand(-20,20), rand(0.35,0.7), rand(2,3.5), '#ffffff', 0, 4);
    } else {
      s.dashMeter = Math.min(1.0, s.dashMeter + dt / 10.0);
    }
  }

  // Physical sail rolling: unrolls when moving, fully unrolled during dash
  const targetRoll = (s.dashT > 0) ? 1.0 : clamp(Math.abs(s.v)/(T.maxv * 0.42) + (s.thr > 0 ? 0.15 : 0), 0.05, 1.0);
  const rollRate = targetRoll > (s.rollSail || 0) ? 3.2 : 2.2;
  s.rollSail = (s.rollSail !== undefined) ? s.rollSail : targetRoll;
  s.rollSail += clamp(targetRoll - s.rollSail, -rollRate * dt, rollRate * dt);

  const target = s.thr * T.maxv * slow * surge * windBoost * dashBoost;
  const rate = (target < s.v ? (s.thr === 0 ? T.acc*0.5 : T.acc*1.5) : T.acc) * dashAccMult;
  s.v += clamp(target - s.v, -rate*dt, rate*dt);
  const tf = 0.35 + 0.65*Math.min(1, Math.abs(s.v)/(T.maxv*0.5));
  const heelTo = -s.steer*Math.min(1, Math.abs(s.v)/T.maxv)*0.3;
  s.heel = (s.heel || 0) + (heelTo - (s.heel || 0))*Math.min(1, dt*2.2);
  s.a += s.steer * T.turn * tf * dt;
  const ca = Math.cos(s.a), sa = Math.sin(s.a);
  const nx = s.x + ca*s.v*dt, ny = s.y + sa*s.v*dt;
  const dir = s.v >= 0 ? 1 : -1;
  const hit = solidAt(nx, ny, T.wid*0.6) || solidAt(nx + ca*T.len*0.45*dir, ny + sa*T.len*0.45*dir, 2);
  if (hit){
    if (Math.abs(s.v) > 30){
      damage(s, (Math.abs(s.v) - 25)*0.24, null);
      for (let i = 0; i < 6; i++) part(s.x+ca*T.len*0.5, s.y+sa*T.len*0.5, rand(-30,30), rand(-30,30), 0.7, 3, '#efe2b8', 1, 3);
      for (let i = 0; i < 4; i++) part(s.x+ca*T.len*0.5, s.y+sa*T.len*0.5, rand(-40,40), rand(-40,40), rand(2,4), 1.5, WOOD[i], 0, 0, 2);
      noise(0.3*volAt(s.x,s.y), 0.3, 400);
    }
    s.v *= -0.35;
    const dx = s.x - hit.x, dy = s.y - hit.y, d = Math.hypot(dx,dy) || 1;
    s.x += dx/d*2; s.y += dy/d*2;
  } else { s.x = nx; s.y = ny; }

  const sp = Math.abs(s.v);
  s.trailT -= dt;
  if (s.trailT <= 0){
    s.trailT = 0.07;
    if (sp > 6) s.trail.push({ x: s.x - ca*T.len*0.42, y: s.y - sa*T.len*0.42, a: s.a, t: time, w: T.wid*0.35, sp: Math.min(1, sp/(T.maxv*0.6)) });

}
function shipFx(s, dt){

/* ---------- mines ---------- */
function triggerDash(){

  const tier = player.T.tier || 0;
  const sizePenalty = 1.0 - tier * 0.12;
  const sails = player.T.sails || 0;
  const masts = player.T.masts || 1;
  const sailBonus = sails * 0.25 + (masts - 1) * 0.12;
  const maxBoost = 2.125 * sizePenalty * (1.0 + sailBonus); // +25% increased dash speed
  player.v = Math.max(player.v, player.T.maxv * 0.62) * Math.min(1.75, maxBoost);

}

    if (!s.alive) continue;
    const d = Math.hypot(s.x - m.x, s.y - m.y);
    if (d < 60 + s.T.len*0.3) damage(s, 40*(1 - d/(75 + s.T.len*0.3)), s === player ? null : player);
  }
}

/* =========================================================
   NAVY SAILORS: TURN PIRATE OR WALK THE PLANK

function navyTurnPirate(c){
  c.alive = false;
  player.gold += 15;
  player.crew = (player.crew || 4) + 1;
  ft(c.x, c.y - 14, 'TURNED PIRATE! (+1 CREW)', '#ffd23f');
  chime(520); chime(784);
  ripple(c.x, c.y, 16, 0.9);
  msg('NAVY SAILOR TURNS PIRATE! (+1 CREW)', '#ffd23f', 2.2);
  VO.say('crew_joins'); // "Welcome aboard matey!"
  const idx = castaways.indexOf(c);
  if (idx >= 0) castaways.splice(idx, 1);
}

function navyWalkThePlank(c){
  c.alive = false;
  player.gold += 25;
  ft(c.x, c.y - 14, 'WALK THE PLANK! (+$25)', '#e8302a');
  msg('PRISONER OF HER MAJESTY WALKS THE PLANK!', '#e8302a', 2.4);

  const side = Math.PI / 2 * (Math.random() < 0.5 ? 1 : -1);
  const plankLen = player.T.wid * 0.48 + 18;
  const rx = player.x + Math.cos(player.a + side) * (player.T.wid * 0.44);
  const ry = player.y + Math.sin(player.a + side) * (player.T.wid * 0.44);
  const dropX = player.x + Math.cos(player.a + side) * plankLen;
  const dropY = player.y + Math.sin(player.a + side) * plankLen;

  plankWalkers.push({
    rx, ry, dropX, dropY,
    ang: player.a + side,
    t: 0, life: 2.4,
    splashed: false
  });

  blip(140, 0.18, 0.2, 'sawtooth');
  const idx = castaways.indexOf(c);
  if (idx >= 0) castaways.splice(idx, 1);
}

function handleNavyCastaway(c){
  ft(c.x, c.y - 20, "I'd rather drown than be a filthy pirate!", '#ff7070');
  msg('NAVY: "I\'d rather drown than be a filthy pirate!"', '#ff9090', 2.8);
  speak("I'd rather drown than be a filthy pirate!");
  if (typeof bgmDuck === 'function') bgmDuck(2.6, 0.06);
  navyWalkThePlank(c);
}

function updatePlankWalkers(dt){
  for (let i = plankWalkers.length - 1; i >= 0; i--){
    const pw = plankWalkers[i];
    pw.t += dt;
    if (pw.t > pw.life){ plankWalkers.splice(i, 1); continue; }
    if (!pw.splashed && pw.t >= 0.75){
      pw.splashed = true;
      ripple(pw.dropX, pw.dropY, 22, 1.4);
      noise(0.48, 0.45, 360);
      for (let k = 0; k < 18; k++){
        const a = rand(0, TAU), sp = rand(15, 60);
        part(pw.dropX, pw.dropY, Math.cos(a)*sp, Math.sin(a)*sp, rand(0.6, 1.3), rand(1.8, 3.2), '#ffffff', 0, 5, 1);
      }
      bloodPools.push({
        x: pw.dropX, y: pw.dropY,
        vx: (Math.random()-0.5)*5, vy: (Math.random()-0.5)*5,
        r: 8, maxR: rand(24, 38), alpha: 0.85, life: 0, maxLife: rand(16, 26), rot: rand(0, TAU)
      });
    }
  }
}

function drawPlankWalkers(){
  for (const pw of plankWalkers){
    // Wooden plank extending from ship
    ctx.strokeStyle = '#2b1608'; ctx.lineWidth = 4.2;
    line(pw.rx, pw.ry, pw.dropX, pw.dropY);
    ctx.strokeStyle = '#7c532b'; ctx.lineWidth = 2.6;
    line(pw.rx, pw.ry, pw.dropX, pw.dropY);

    if (pw.t < 0.75){
      const prog = pw.t / 0.75;
      const px = pw.rx + (pw.dropX - pw.rx) * prog;
      const py = pw.ry + (pw.dropY - pw.ry) * prog;
      drawPerson(px, py, pw.ang, {
        coat: '#1e3f7a', trim: '#e8c040', legs: '#ffffff', hat: 'tricorn',
        walk: pw.t * 8, moving: true, scale: 1.25, noSword: true
      });
    } else if (pw.t < 1.3){
      const fallT = (pw.t - 0.75) / 0.55;
      const dropA = Math.max(0, 1 - fallT);
      drawPerson(pw.dropX, pw.dropY, pw.ang, {
        coat: '#1e3f7a', trim: '#e8c040', legs: '#ffffff', down: true,
        alpha: dropA * 0.8, scale: 1.25 * (1 - fallT * 0.3)
      });
      const finAng = pw.t * 4.5;
      const fx = pw.dropX + Math.cos(finAng) * 15, fy = pw.dropY + Math.sin(finAng) * 15;
      ctx.fillStyle = '#1c242c';
      ctx.beginPath(); ctx.moveTo(fx, fy - 5); ctx.lineTo(fx + 6, fy + 4); ctx.lineTo(fx - 6, fy + 4); ctx.closePath(); ctx.fill();
    }
  }
}

function updateBloodPools(dt){
  for (let i = bloodPools.length - 1; i >= 0; i--){
    const b = bloodPools[i];
    b.life += dt;
    if (b.life >= b.maxLife){ bloodPools.splice(i, 1); continue; }
    b.x += b.vx * dt; b.y += b.vy * dt;
    b.vx *= Math.pow(0.7, dt); b.vy *= Math.pow(0.7, dt);
    const prog = b.life / b.maxLife;
    b.curR = b.r + (b.maxR - b.r) * Math.sin(Math.min(1, prog * 2.2) * Math.PI * 0.5);
    b.curAlpha = b.alpha * (1 - prog * prog);
  }
}

function updateCastaways(dt){
  for (let i = castaways.length - 1; i >= 0; i--){
    const c = castaways[i];
    if (!c.alive){ castaways.splice(i, 1); continue; }
    c.t += dt;
    if (c.t > c.maxT){
      c.alive = false;
      ripple(c.x, c.y, 8, 0.4);
      castaways.splice(i, 1);
      continue;
    }
    c.x += c.vx * dt; c.y += c.vy * dt;
    c.vx *= Math.pow(0.5, dt); c.vy *= Math.pow(0.5, dt);
    c.walk += dt * 3.2;
    if (Math.random() < dt * 0.35) ripple(c.x, c.y, 5, 0.3);

    // Hero swimming rescue
    if (mode === 'foot' && !hero.dead && Math.hypot(hero.x - c.x, hero.y - c.y) < 28){
      c.alive = false;
      if (c.type === 'navy'){
        handleNavyCastaway(c);
      } else {
        player.gold += 15;
        player.crew = (player.crew || 4) + 1;
        ft(c.x, c.y - 14, '+1 CREW (+15G)', '#ffd23f');
        chime(520); chime(784);
        ripple(c.x, c.y, 14, 0.8);
        msg('CASTAWAY RESCUED! (+1 CREW)', '#ffd23f', 1.8);
        VO.say('crew_joins');
        castaways.splice(i, 1);
      }
      continue;
    }

    // Player ship interaction - ALWAYS pick up sailors every time, even when going fast!
    if (mode === 'sea' && player.alive){
      const d = Math.hypot(player.x - c.x, player.y - c.y);
      // Generous contact radius matching ship hull length/width so fast ships never miss
      const contactR = Math.max(player.T.wid * 0.85 + 24, player.T.len * 0.55 + 16);
      if (d < contactR){
        c.alive = false;
        if (c.type === 'navy'){
          handleNavyCastaway(c);
        } else {
          player.gold += 15;
          player.crew = (player.crew || 4) + 1;
          ft(c.x, c.y - 14, '+1 CREW (+15G)', '#ffd23f');
          chime(520); chime(784);
          ripple(c.x, c.y, 16, 0.9);
          msg('CASTAWAY RESCUED! (+1 CREW)', '#ffd23f', 1.8);
          VO.say('crew_joins');
          castaways.splice(i, 1);
        }
        continue;
      }
    }

    // AI ships running over castaways
    for (const s of ships){
      if (!s.alive || s === player || Math.abs(s.v) <= 30) continue;
      if (Math.hypot(s.x - c.x, s.y - c.y) < s.T.wid * 0.6 + 8){
        c.alive = false;
        bloodPools.push({
          x: c.x, y: c.y,
          vx: Math.cos(s.a) * s.v * 0.08, vy: Math.sin(s.a) * s.v * 0.08,
          r: 10, maxR: rand(35, 50),
          alpha: 0.88, life: 0,
          maxLife: rand(20, 32),
          rot: rand(0, TAU)
        });
        for (let p = 0; p < 12; p++){
          const pa = rand(0, TAU), psp = rand(15, 60);
          part(c.x, c.y, Math.cos(pa)*psp, Math.sin(pa)*psp, rand(2, 4.5), rand(0.8, 1.6), '#b8121a', 0, 0, 1);
        }
        noise(0.22*volAt(c.x, c.y), 0.22, 220);
        castaways.splice(i, 1);
        break;
      }
    }
  }
}

function drawBloodPool(b){
  if (b.curAlpha <= 0.01) return;
  ctx.save();
  ctx.translate(b.x, b.y);
  ctx.rotate(b.rot + b.life * 0.04);
  const r = b.curR;
  const grad = ctx.createRadialGradient(0, 0, r * 0.08, 0, 0, r);
  grad.addColorStop(0, `rgba(130, 8, 16, ${0.85 * b.curAlpha})`);
  grad.addColorStop(0.4, `rgba(160, 16, 24, ${0.65 * b.curAlpha})`);
  grad.addColorStop(0.75, `rgba(120, 12, 20, ${0.35 * b.curAlpha})`);
  grad.addColorStop(1, 'rgba(80, 8, 16, 0)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  const petals = 6;
  for (let i = 0; i <= petals; i++){
    const ang = (i / petals) * TAU;
    const wave = 1 + 0.22 * Math.sin(ang * 3 + b.rot) + 0.12 * Math.cos(ang * 5);
    const pr = r * wave;
    const px = Math.cos(ang) * pr, py = Math.sin(ang) * pr;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawCastaway(c){
  drawPerson(c.x, c.y, c.a + Math.sin(time*2 + c.walk)*0.25, {
    coat: c.coat, shirt: c.shirt, legs: c.legs, skin: c.skin,
    walk: c.walk, moving: true, swimming: true, scale: 1.25, noSword: true
  });
  if (Math.sin(time * 3 + c.walk) > 0.4){
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ell(c.x + Math.cos(c.a)*5, c.y + Math.sin(c.a)*5, 2.5, 1.8);
  }
}

function updateMines(dt){
  for (let i = mines.length - 1; i >= 0; i--){
    const m = mines[i]; m.t += dt;
    if (m.t > 120){ mines.splice(i, 1); continue; }
    if (m.t < 1.2) continue;
    let boom = false;
    for (const s of ships){
      if (!s.alive || s === player || s.type === 'moored') continue;
      if (Math.hypot(s.x - m.x, s.y - m.y) < s.T.len*0.45 + 8){ boom = true; break; }
    }
    if (boom){ mines.splice(i, 1); explodeMine(m); }
  }
}
