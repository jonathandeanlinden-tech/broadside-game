let hitStop = 0;
const hero = { x:0, y:0, a:0, hp:100, max:100, swing:-1, cd:0, walk:0, moving:false, hurt:9, flash:0, kx:0, ky:0, dead:false, deadT:0, deckShip:null, combo:0, comboTimer:0, swingType:0, swingDur:0.22, bufferAttack:0 };
const foes = [];

function inHull(s, x, y){
  const c = Math.cos(-s.a), sn = Math.sin(-s.a), dx = x - s.x, dy = y - s.y;
  const lx = dx*c - dy*sn, ly = dx*sn + dy*c, L = s.T.len, W = s.T.wid;
  if (lx > L*0.42 || lx < -L*0.44) return false;
  const hw = lx > L*0.05 ? W*0.36*(1 - Math.pow((lx - L*0.05)/(L*0.37), 2)) : W*0.36;
  return Math.abs(ly) < hw;
}
function heroWalkOK(x, y){
  if (x < 30 || x > WORLD - 30 || y < 30 || y > WORLD - 30) return false;
  const is = islandAt(x, y, 0.995);
  if (!is) return true; // In the ocean! Free to swim anywhere
  const lx = x - is.x, ly = y - is.y;
  if (is.volc && Math.hypot(lx - is.vx, ly - is.vy) < is.vr*0.2) return false;
  for (const b of is.boulders) if (Math.abs(lx - b.x) < b.r && Math.hypot(lx-b.x, ly-b.y) < b.r*0.75 + 2) return false;
  for (const st of is.structs) if (inRect(lx, ly, st, 2)) return false;
  for (const t of is.trees){ if (!t.down && Math.abs(lx - t.x) < 5 && Math.hypot(lx-t.x, ly-t.y) < 3.6) return false; }
  return true;
}
const walkOK = (ent, x, y) => ent.deckShip ? inHull(ent.deckShip, x, y) : (ent === hero ? heroWalkOK(x, y) : walkable(x, y));

function diveOverboard(){
  if (mode !== 'sea' || !player.alive) return;
  mode = 'foot'; fishing.st = 'idle';
  const side = Math.PI / 2;
  const dist = player.T.wid * 0.7 + 12;
  const hx = player.x + Math.cos(player.a + side) * dist;
  const hy = player.y + Math.sin(player.a + side) * dist;
  Object.assign(hero, { x: hx, y: hy, a: player.a + side, swing: -1, cd: 0, kx: 0, ky: 0, dead: false, flash: 0, deckShip: null, swimming: true, chopping: 0 });
  player.thr = 0; player.steer = 0; player.v = 0;
  noise(0.25, 0.25, 600); ripple(hx, hy, 16, 0.9);
  msg('INTO THE DRINK!', '#60b8ff', 1.4);
}
function moveWalker(w, dx, dy){
  if (dx && walkOK(w, w.x + dx, w.y)) w.x += dx;
  if (dy && walkOK(w, w.x, w.y + dy)) w.y += dy;
}
const shipLocal = (s, lx, ly) => [s.x + Math.cos(s.a)*lx - Math.sin(s.a)*ly, s.y + Math.sin(s.a)*lx + Math.cos(s.a)*ly];

function shoreDistance(is, x, y){ return Math.hypot(x - is.x, y - is.y) - islR(is, Math.atan2(y - is.y, x - is.x)); }
function ashoreIsland(){
  if (mode !== 'sea' || !player.alive || Math.abs(player.v) > 45) return null;
  for (const is of islands){
    if (Math.hypot(player.x - is.x, player.y - is.y) > is.max + 120) continue;
    if (shoreDistance(is, player.x, player.y) < player.T.len*0.5 + 42) return is;
  }
  return null;
}
function goAshore(is){
  const base = Math.atan2(player.y - is.y, player.x - is.x);
  for (const k of [0, 0.04, -0.04, 0.08, -0.08, 0.12, -0.12, 0.18, -0.18, 0.25, -0.25, 0.35, -0.35]){
    for (const f of [0.95, 0.9, 0.85]){
      const r = islR(is, base + k)*f, x = is.x + Math.cos(base + k)*r, y = is.y + Math.sin(base + k)*r;
      if (walkable(x, y)){
        mode = 'foot'; fishing.st = 'idle';
        Object.assign(hero, { x, y, a: base + k + Math.PI, swing: -1, cd: 0, kx: 0, ky: 0, dead: false, flash: 0, deckShip: null });
        player.thr = 0; player.steer = 0; player.v = 0;
        noise(0.2, 0.3, 900); ripple(x, y, 10, 0.8);
        return;
      }
    }
  }
  msg('NO PLACE TO LAND HERE', '#ffffff', 1.5);
}
const nearShip = () => mode === 'foot' && !hero.dead && Math.hypot(hero.x - player.x, hero.y - player.y) < player.T.len*0.5 + 45;
function boardShip(){ spaceLock = true; mode = 'sea'; fishing.st = 'idle'; hero.hp = hero.max; noise(0.2, 0.3, 900); ripple(hero.x, hero.y, 10, 0.8); }
function nearStruct(kind){
  if (mode !== 'foot' || hero.dead) return null;
  for (const is of islands){
    if (Math.abs(is.x - hero.x) > is.max + 60 || Math.abs(is.y - hero.y) > is.max + 60) continue;
    for (const st of is.structs){
      if (st.kind !== kind) continue;
      if (Math.hypot(hero.x - is.x - st.x, hero.y - is.y - st.y) < Math.max(st.w, st.h)/2 + 20) return st;
    }
  }
  return null;
}
function nearChest(){
  if (mode !== 'foot' || hero.dead) return null;
  for (const c of camps) if (Math.hypot(hero.x - c.chest.x, hero.y - c.chest.y) < 22) return c;
  return null;
}
function treeAhead(){
  if (mode !== 'foot') return null;
  const is = islandAt(hero.x, hero.y, 1.05); if (!is) return null;
  let best = null, bd = 24;
  for (const t of is.trees){
    if (t.down) continue;
    const tx = is.x + t.x, ty = is.y + t.y, d = Math.hypot(tx - hero.x, ty - hero.y);
    if (d < bd && Math.abs(angDiff(Math.atan2(ty - hero.y, tx - hero.x), hero.a)) < 1.3){ bd = d; best = { t, is }; }
  }
  return best;
}
function makeFoe(x, y, extra){
  if (extra && extra.coat === undefined) delete extra.coat;
  return Object.assign({ x, y, a: rand(0,TAU), hp: 90, max: 90, state: 'idle', t: rand(0,2), tx: x, ty: y, swing: -1, flash: 0, walk: 0, moving: false,
    kx: 0, ky: 0, dead: false, deadT: 0, coat: ['#3a3a3a','#5a2626','#2f4a3a','#4a3a5a'][(Math.random()*4)|0],
    band: ['#c22a2a','#2a2a2a','#d8a020','#2a5aa0'][(Math.random()*4)|0], hair: ['#1a1008','#4a2a10','#8a5a2a'][(Math.random()*3)|0], camp: null, deckShip: null }, extra);
}
function spawnCrew(c){
  c.crew = []; c.chest.open = false; c.respawnT = 0;
  for (let i = 0; i < 3; i++){
    let x = c.x, y = c.y;
    for (let k = 0; k < 30; k++){ const a = rand(0,TAU), d = rand(14,40); x = c.x + Math.cos(a)*d; y = c.y + Math.sin(a)*d; if (walkable(x, y)) break; }
    const p = makeFoe(x, y, { camp: c });
    c.crew.push(p); foes.push(p);
  }
}
const campCleared = c => c.crew.every(p => p.dead);

/* --- deck fights --- */
function startDeckFight(kind, ship, other, n){
  if (deck || mode !== 'sea' || !player.alive) return;
  // pull the two ships alongside each other
  const mover = kind === 'defend' ? other : player, anchor = kind === 'defend' ? player : ship;
  const sd = Math.sign(-Math.sin(anchor.a)*(mover.x - anchor.x) + Math.cos(anchor.a)*(mover.y - anchor.y)) || 1;
  const gap = (anchor.T.wid + mover.T.wid)/2 + 10;
  mover.x = anchor.x - Math.sin(anchor.a)*sd*gap; mover.y = anchor.y + Math.cos(anchor.a)*sd*gap; mover.a = anchor.a;
  player.v = 0; other.v = 0; ship.v = 0;
  deck = { kind, ship, other: kind === 'defend' ? other : player, enemy: kind === 'defend' ? other : ship, sd, t: 0, done: false };
  mode = 'deck'; fishing.st = 'idle';
  const L = ship.T.len, W = ship.T.wid, side = sd;
  const [hx, hy] = shipLocal(ship, kind === 'defend' ? -L*0.22 : -L*0.25, kind === 'defend' ? 0 : side*W*0.12);
  Object.assign(hero, { x: hx, y: hy, a: ship.a, swing: -1, cd: 0.3, kx: 0, ky: 0, dead: false, flash: 0, deckShip: ship, hp: Math.max(hero.hp, kind === 'defend' ? hero.max*0.8 : hero.max) });
  for (let i = 0; i < n; i++){
    const [fx, fy] = shipLocal(ship, L*(0.25 - i*0.12), (i % 2 ? 1 : -1)*W*0.12 + (kind === 'defend' ? sd*W*0.1 : 0));
    const uni = kind === 'attack' && (ship.type === 'navy' || ship.type === 'treasure');
    const L2 = L*(0.3 - (i % 4)*0.13), W2 = (i % 2 ? 1 : -1)*W*(0.12 + ((i/4)|0)*0.12);
    const [gx, gy] = i < 3 ? [fx, fy] : shipLocal(ship, L2, W2);
    foes.push(makeFoe(gx, gy, { deckShip: ship, state: 'chase', hp: uni ? 80 : 70, max: uni ? 80 : 70, uniform: uni,
      coat: uni ? '#a82424' : undefined, lordCrew: !!ship.lord }));
  }
  deck.enemy.aggroUntil = time + 30;
  if (kind === 'defend'){ msg('PIRATES ARE BOARDING!', '#ff4a3a', 2.4); blip(220, 0.3, 0.15, 'sawtooth'); }
  else msg(ship.type === 'treasure' ? "BOARD THE KING'S GALLEON!" : ship.lord ? 'BOARD THE PIRATE LORD!' : 'BOARDING!', '#ffd23f', 1.8);
  noise(0.4, 0.4, 900);
}
function endDeck(){
  spaceLock = true;
  for (let i = foes.length - 1; i >= 0; i--) if (foes[i].deckShip) foes.splice(i, 1);
  if (mode === 'deck') mode = 'sea';
  hero.deckShip = null; hero.dead = false; deck = null;
  if (menu && menu.locked) menu = null;
}
function deckWin(){
  deck.done = true;
  const e = deck.enemy;
  if (deck.kind === 'defend'){
    player.gold += 20;
    msg('BOARDERS REPELLED! +$20', '#7dff5a');
    e.hp = Math.min(e.hp, e.T.hp*0.4); e.ai.state = 'flee'; e.ai.t = 20; e.ai.grab = 0;
    coinSound(); endDeck(); saveGame();
  } else {
    const baseLoot = e.gold + Math.floor(rand(40, 90)) + (e.tier || 0)*35;
    const loot = baseLoot * 2; // Boarding yields 2x-3x significantly more loot!
    e.gold = 0; player.gold += loot; coinSound();
    ft(e.x, e.y - 20, `+$${loot} PLUNDER`, '#ffe14a');

    if (e.tradeGood){
      const room = cargoCap() - cargoUsed();
      const nGoods = Math.min(room, Math.floor(rand(3, 6)));
      if (nGoods > 0){
        cargo.goods[e.tradeGood] = (cargo.goods[e.tradeGood] || 0) + nGoods;
        ft(e.x, e.y - 36, `+$${nGoods} INTACT $${COMMODITIES[e.tradeGood].name}`, '#7dff5a');
      }
      if (e.destPort){
        e.destPort.shortages = e.destPort.shortages || {};
        e.destPort.shortages[e.tradeGood] = (e.destPort.shortages[e.tradeGood] || 0) + 1.2;

function boardTarget(){

  for (const s of ships){

}

function heroAttack(){
  if (hero.cd > 0 || hero.dead || hero.parry) return;

  const isAxe = isHeroChopping();
  let combo = (hero.comboTimer > 0) ? hero.combo : 0;
  if (isAxe && combo >= 2) combo = 0; // Axe has NO 3rd power hit!

  hero.swingType = isAxe ? (combo % 2) : combo;
  hero.swing = 0;

  let swingDuration = 0.18;
  let dmgBase = 30;
  let lungeDist = isAxe ? 0 : 7;
  let arcRange = 1.25;
  let reach = 28;

  if (isAxe){
    // Axe chopping: solid stationary stance, no forward strife/lunge, rhythmic 2-phase chop, NO 3rd power hit
    hero.cd = 0.28;
    hero.combo = (combo === 0) ? 1 : 0;
    hero.comboTimer = 0.65;
    swingDuration = 0.22;
    dmgBase = 35;
    lungeDist = 0; // Pirate should not strife forwards with axe!
    reach = 28;
    arcRange = 1.2;
    hero.chopping = 0.55;
    noise(0.20, 0.12, 1300); blip(180, 0.06, 0.12, 'triangle');
  } else if (combo === 0){
    // Hit 1: Forehand slash (quick, crisp)
    hero.cd = 0.22;
    hero.combo = 1;
    hero.comboTimer = 0.65;
    swingDuration = 0.18;
    dmgBase = 30;
    lungeDist = 7;
    reach = 28;
    noise(0.09, 0.08, 3800); blip(340, 0.05, 0.1, 'sine');
  } else if (combo === 1){
    // Hit 2: Backhand cross-slash (reverse upward cut)
    hero.cd = 0.24;
    hero.combo = 2;
    hero.comboTimer = 0.70;
    swingDuration = 0.19;
    dmgBase = 42;
    lungeDist = 10;
    reach = 31;
    noise(0.12, 0.10, 4200); blip(460, 0.06, 0.12, 'sine');
  } else {
    // Hit 3: Heavy Finisher Cleave! (massive fiery arc & knockback) - CUTLASS ONLY
    hero.cd = 0.46;
    hero.combo = 0;
    hero.comboTimer = 0;
    swingDuration = 0.27;
    dmgBase = 68;
    lungeDist = 14;
    arcRange = 1.95;
    reach = 36;
    shake = Math.max(shake, 6);
    noise(0.24, 0.18, 1800); blip(160, 0.12, 0.24, 'triangle');
  }

  hero.swingDur = swingDuration;

  // Kinetic forward lunge (strictly disabled for axe - pirate never strifes forwards!)
  if (lungeDist > 0){
    moveWalker(hero, Math.cos(hero.a)*lungeDist, Math.sin(hero.a)*lungeDist);
  }

  // Soft auto-target nearest foe in front (sword fighting only, disabled for axe woodchopping)
  if (!isAxe){
    let foe = null, fd = reach + 10;
    for (const p of foes){
      if (p.dead) continue;
      const d = Math.hypot(p.x - hero.x, p.y - hero.y);
      if (d < fd){ fd = d; foe = p; }
    }
    if (foe){
      const toFoe = Math.atan2(foe.y - hero.y, foe.x - hero.x);
      if (Math.abs(angDiff(toFoe, hero.a)) < 1.4) hero.a = toFoe;
    }
  }

  // Tree chopping check: if facing a tree, chop it directly
  const ta = treeAhead();
  if (ta){
    hero.chopping = 0.55;
    const { t, is } = ta, tx = is.x + t.x, ty = is.y + t.y;
    t.hp--; t.shake = 0.35;
    noise(0.42, 0.18, 1100); blip(80, 0.08, 0.16, 'triangle');
    for (let i = 0; i < 11; i++) part(tx + rand(-3,3), ty + rand(-3,3), rand(-55,55), rand(-55,55), rand(0.6,1.4), rand(1.0,1.8), WOOD[(Math.random()*4)|0], 1, 0, 2);
    for (let i = 0; i < 5; i++) part(tx + rand(-6,6), ty + rand(-6,6), rand(-30,30), rand(-30,30), rand(0.8,1.4), rand(0.8,1.3), '#4f9a3c', 1, 0, 2);
    if (t.hp <= 0){
      t.down = true; t.regrow = 120;
      for (let i = 0; i < 18; i++) part(tx + rand(-8,8), ty + rand(-8,8), rand(-60,60), rand(-60,60), rand(1,2.2), rand(1.2,2.0), Math.random() < 0.6 ? '#4f9a3c' : '#2f6b2a', 1, 0, 2);
      noise(0.45, 0.55, 550);
      const got = Math.min(2, cargoCap() - cargoUsed());
      if (got > 0){ cargo.wood += got; ft(tx, ty - 16, `+${got} TIMBER`, '#e3b26a'); }
      else ft(tx, ty - 16, 'HOLD FULL!', '#ff8a7a');
      saveGame();
    }
    return;
  }

  let hitSomething = false;
  for (const p of foes){
    if (p.dead) continue;
    const d = Math.hypot(p.x - hero.x, p.y - hero.y);
    if (d < reach && Math.abs(angDiff(Math.atan2(p.y - hero.y, p.x - hero.x), hero.a)) < arcRange){
      const riposte = !isAxe && (p.exposedUntil > time);
      const dmg = riposte ? Math.round(dmgBase * 1.5) : dmgBase;
      p.hp -= dmg; p.flash = 0.18; hitSomething = true;

      if (riposte){
        p.exposedUntil = 0;
        ft(p.x, p.y - 24, combo === 2 ? `CRITICAL FINISHER! -${dmg}` : `RIPOSTE! -${dmg}`, '#ff9a4a');
      } else if (!isAxe && combo === 2){
        ft(p.x, p.y - 22, `FINISHER! -${dmg}`, '#ffd23f');
      } else {
        ft(p.x, p.y - 14, `-${dmg}`, isAxe ? '#e3b26a' : (combo === 1 ? '#cfe8ff' : '#ffffff'));
      }

      const force = isAxe ? 50 : (combo === 2 ? 140 : combo === 1 ? 90 : 60);
      const k = force / Math.max(d, 1);
      p.kx = (p.x - hero.x)*k; p.ky = (p.y - hero.y)*k;

      // Hit-stop crunch (freeze-frame feel)
      hitStop = (!isAxe && combo === 2) ? 0.055 : (riposte ? 0.045 : 0.025);

      if (p.state === 'windup'){
        p.state = 'recover'; p.t = (!isAxe && combo === 2) ? 0.8 : 0.45;
        ft(p.x, p.y - 30, 'INTERRUPT!', '#5be35b');
      }
      if (p.state === 'idle') p.state = 'chase';

      // Directional sparks and blood spray
      const sprayAngle = hero.a + (combo === 1 ? -0.8 : 0.8);
      const sparkCount = (!isAxe && combo === 2) ? 12 : (combo === 1 ? 7 : 5);
      for (let i = 0; i < sparkCount; i++){
        const spd = rand(30, 90);
        const pa = sprayAngle + rand(-0.7, 0.7);
        const col = Math.random() < 0.4 ? '#ffffff' : ((!isAxe && combo === 2) ? '#ffd23f' : (Math.random() < 0.5 ? '#b81e1e' : '#e63939'));
        part(p.x, p.y, Math.cos(pa)*spd, Math.sin(pa)*spd, rand(0.2, 0.45), rand(1.2, 2.4), col, 1, 0, 1);
      }

      blip((!isAxe && combo === 2) ? 140 : 200, 0.08, 0.15, 'square');
      padFx((!isAxe && combo === 2) ? 'boom' : 'hit');

      if (p.hp <= 0){
        p.dead = true; p.deadT = 0; const g = Math.floor(rand(8, 20));
        player.gold += g; ft(p.x, p.y - 14, `+$${g}`, '#ffe14a'); coinSound();
        if (p.camp && campCleared(p.camp)) msg('CREW DEFEATED! OPEN THE CHEST', '#7dff5a');
        if (p.deckShip) splash(p.x, p.y, 4);
      }
    }
  }
}
function parried(p, perfect){
  const mx = (p.x + hero.x)/2, my = (p.y + hero.y)/2;
  for (let i = 0; i < (perfect ? 16 : 9); i++){
    const col = Math.random() < 0.4 ? '#ffffff' : (Math.random() < 0.5 ? '#fff6c0' : '#ffd060');
    part(mx, my, rand(-80,80), rand(-80,80), rand(0.15,0.4), rand(0.8,1.6), col, 1, 0, 1);
  }
  blip(perfect ? 1500 : 1150, 0.09, 0.14, 'square');
  setTimeout(() => blip(perfect ? 1900 : 1450, 0.06, 0.1, 'square'), 40);
  noise(0.25, 0.08, 5000);
  const k = (perfect ? 140 : 85)/Math.max(1, Math.hypot(p.x - hero.x, p.y - hero.y));
  p.kx = (p.x - hero.x)*k; p.ky = (p.y - hero.y)*k;
  p.state = 'recover'; p.t = perfect ? 1.7 : 0.9;
  if (perfect){
    p.exposedUntil = time + 1.7;
    hero.cd = 0;
    // Prime the hero with the Heavy Finisher for an immediate devastating riposte counter!
    hero.combo = 2;
    hero.comboTimer = 1.7;
    hitStop = 0.06;
    shake = Math.max(shake, 5);
    ft(p.x, p.y - 18, 'PERFECT PARRY!', '#ffd23f');
  } else {
    hitStop = 0.03;
    ft(p.x, p.y - 16, 'PARRY', '#cfe8ff');
  }
  padFx('coin');
}
function hurtHero(d, from){

}
function updateHero(dt){
  if (hero.dead){
    hero.deadT += dt;
    if (mode === 'deck'){ if (hero.deadT > 1.6) deckLose(); return; }
    if (hero.deadT > 3.2){ hero.dead = false; hero.hp = hero.max; boardShip(); msg('BACK ON BOARD', '#ffffff', 1.6); }
    return;
  }
  const onIsland = !!islandAt(hero.x, hero.y, 0.992);
  const wasSwimming = !!hero.swimming;
  hero.swimming = (mode === 'foot' && !onIsland);
  if (hero.swimming && !wasSwimming){
    ripple(hero.x, hero.y, 16, 0.9);
    noise(0.22, 0.2, 550);
  } else if (!hero.swimming && wasSwimming){
    ripple(hero.x, hero.y, 10, 0.6);
    noise(0.12, 0.15, 900);
  }
  if (hero.chopping > 0) hero.chopping -= dt;
  let mx = 0, my = 0;
  if (state === 'play' && !menu){
    mx = ((keys.KeyD || keys.ArrowRight) ? 1 : 0) - ((keys.KeyA || keys.ArrowLeft) ? 1 : 0);
    my = ((keys.KeyS || keys.ArrowDown) ? 1 : 0) - ((keys.KeyW || keys.ArrowUp) ? 1 : 0);
    if (padLive() && Math.hypot(TV.pad.jx, TV.pad.jy) > 0.2){ mx = TV.pad.jx; my = TV.pad.jy; }
  }
  // parry: hold Left Ctrl (or PARRY on the phone); you plant your feet and face the nearest foe
  const parryHeld = state === 'play' && !menu && (keys.ControlLeft || (padLive() && (TV.pad.b & 16)));
  if (parryHeld && !hero.parry) hero.parryT = 0;
  hero.parry = parryHeld && hero.swing < 0;
  if (hero.parry){
    hero.parryT += dt; mx = 0; my = 0;
    let foe = null, fd = 60;
    for (const p of foes){ if (p.dead) continue; const d = Math.hypot(p.x - hero.x, p.y - hero.y); if (d < fd){ fd = d; foe = p; } }
    if (foe) hero.a += clamp(angDiff(Math.atan2(foe.y - hero.y, foe.x - hero.x), hero.a), -10*dt, 10*dt);
  }
  hero.moving = !!(mx || my);
  if (hero.moving){
    const l = Math.hypot(mx, my), sp = mode === 'deck' ? 60 : (hero.swimming ? 52 : 80);
    const want = Math.atan2(my, mx);
    if (hero.swing < 0) hero.a += clamp(angDiff(want, hero.a), -12*dt, 12*dt);
    moveWalker(hero, mx/l*sp*dt, my/l*sp*dt);
    hero.walk += dt*(hero.swimming ? 8 : 13);
    if (hero.swimming && Math.random() < dt * 5){
      ripple(hero.x + (Math.random()-0.5)*8, hero.y + (Math.random()-0.5)*8, 7, 0.5);
    }
  } else if (hero.swimming){
    hero.walk += dt * 3.5;
    if (Math.random() < dt * 1.5){
      ripple(hero.x, hero.y, 6, 0.35);
    }
  }
  if (hero.kx || hero.ky){
    moveWalker(hero, hero.kx*dt, hero.ky*dt);
    hero.kx *= Math.pow(0.002, dt); hero.ky *= Math.pow(0.002, dt);
    if (Math.abs(hero.kx) + Math.abs(hero.ky) < 2){ hero.kx = 0; hero.ky = 0; }
  }

  // Combo decay
  if (hero.comboTimer > 0){
    hero.comboTimer -= dt;
    if (hero.comboTimer <= 0) hero.combo = 0;
  }

  // Input buffering for attack
  if (hero.bufferAttack > 0) hero.bufferAttack -= dt;
  if (state === 'play' && !menu && !hero.parry && (keys.Space || (padLive() && TV.pad.b & 4))){
    hero.bufferAttack = 0.14;
  }
  if (hero.bufferAttack > 0 && hero.cd <= 0 && state === 'play' && !menu && !hero.parry){
    hero.bufferAttack = 0;
    const bTreasure = nearBuriedTreasure();
    if (bTreasure){
      bTreasure.dug = true;
      player.gold += bTreasure.gold;
      coinSound();
      for (let i = 0; i < 18; i++) part(hero.x, hero.y, rand(-40,40), rand(-40,40), 1, 3, '#d8b060', 1, 2);
      msg(`🪙 UNEARTHED BURIED TREASURE! +$${bTreasure.gold}`, '#7dff5a', 3.5);
      ft(hero.x, hero.y - 20, `+$${bTreasure.gold}`, '#ffd23f');
      saveGame();
    } else {
      heroAttack();
    }
  }

  hero.cd -= dt; hero.flash -= dt; hero.hurt += dt;
  if (hero.swing >= 0){
    const dur = hero.swingDur || 0.22;
    hero.swing += dt / dur;
    if (hero.swing > 1) hero.swing = -1;
  }
  if (mode === 'foot' && hero.hurt > 4 && hero.hp < hero.max) hero.hp = Math.min(hero.max, hero.hp + 6*dt);
}
function updateFoes(dt){
  for (const p of foes){
    if (p.dead){ p.deadT += dt; continue; }
    p.flash -= dt;
    const prevT = p.t;
    p.t -= dt;
    const active = !hero.dead && state === 'play' && !menu && (p.deckShip ? mode === 'deck' : mode === 'foot');
    const d = active ? Math.hypot(hero.x - p.x, hero.y - p.y) : 1e9;
    const toHero = Math.atan2(hero.y - p.y, hero.x - p.x);
    let mvx = 0, mvy = 0, sp = 0;
    if (p.state === 'idle'){
      if (d < 140){ p.state = 'chase'; ft(p.x, p.y - 16, '!', '#ff4a3a'); }
      else if (p.camp){
        if (p.t <= 0){ const a = rand(0,TAU), r = rand(5,35); p.tx = p.camp.x + Math.cos(a)*r; p.ty = p.camp.y + Math.sin(a)*r; p.t = rand(2,5); }
        const dd = Math.hypot(p.tx - p.x, p.ty - p.y);
        if (dd > 4){ mvx = (p.tx - p.x)/dd; mvy = (p.ty - p.y)/dd; sp = 25; p.a = Math.atan2(mvy, mvx); }
      }
    } else if (p.state === 'chase'){
      if (!active) { if (p.camp){ p.state = 'idle'; p.t = 0; } }
      else if (p.camp && (d > 280 || Math.hypot(p.x - p.camp.x, p.y - p.camp.y) > 320)){ p.state = 'idle'; p.t = 0; }
      else if (d < 19){ p.state = 'windup'; p.t = 0.42; p.a = toHero; }
      else { mvx = Math.cos(toHero); mvy = Math.sin(toHero); sp = p.deckShip ? 48 : 58; p.a = toHero; }
    } else if (p.state === 'windup'){
      p.a += clamp(angDiff(toHero, p.a), -4*dt, 4*dt);
      // Audio chime right as the strike point window opens (at 0.15s)
      if (p.t <= 0.15 && prevT > 0.15){
        blip(780, 0.04, 0.08, 'sine');
      }
      if (p.t <= 0){
        p.swing = 0; noise(0.1*volAt(p.x,p.y), 0.12, 3000);
        p.state = 'recover'; p.t = 0.65;
        if (d < 25 && Math.abs(angDiff(toHero, p.a)) < 1.1){
          const facing = Math.abs(angDiff(Math.atan2(p.y - hero.y, p.x - hero.x), hero.a)) < 1.4;
          if (hero.parry && facing) parried(p, hero.parryT < 0.35);
          else hurtHero(13, p);
        }
      }
    } else if (p.state === 'recover'){
      if (p.t <= 0) p.state = d < 280 ? 'chase' : 'idle';
    }
    p.moving = sp > 0;
    if (sp){ moveWalker(p, mvx*sp*dt, mvy*sp*dt); p.walk += dt*sp*0.17; }
    if (p.kx || p.ky){
      moveWalker(p, p.kx*dt, p.ky*dt);
      p.kx *= Math.pow(0.002, dt); p.ky *= Math.pow(0.002, dt);
      if (Math.abs(p.kx) + Math.abs(p.ky) < 2){ p.kx = 0; p.ky = 0; }
    }
    if (p.swing >= 0){ p.swing += dt/0.22; if (p.swing > 1) p.swing = -1; }
  }
  for (const c of camps){
    if (!c.chest.open) continue;
    c.respawnT += dt;
    const far = mode !== 'foot' || Math.hypot(hero.x - c.x, hero.y - c.y) > 500;
    if (c.respawnT > 150 && far){
      for (const p of c.crew){ const idx = foes.indexOf(p); if (idx >= 0) foes.splice(idx, 1); }
      spawnCrew(c);
    }
  }
}
function openChest(c){
  if (!campCleared(c)){ msg('DEFEAT THE CREW FIRST!', '#ff8a7a', 1.6); return; }
  if (c.chest.open) return;
  c.chest.open = true;
  VO.say('treasure_found');
  const g = Math.floor(rand(90, 200));
  player.gold += g;
  msg(`TREASURE! +$${g}`, '#ffd23f');
  ft(c.chest.x, c.chest.y - 16, `+$${g}`, '#ffe14a');
  coinSound(); setTimeout(coinSound, 160);
  for (let i = 0; i < 16; i++) part(c.chest.x, c.chest.y, rand(-40,40), rand(-50,10), rand(0.5,1), 2, '#ffd23f', 1, 0, 1);
  saveGame();
}

const FISH = [ { n:'SARDINE', v:4, w:50 }, { n:'SNAPPER', v:9, w:30 }, { n:'TUNA', v:18, w:15 }, { n:'MARLIN', v:40, w:5 } ];
const fishing = { st:'idle', t:0, x:0, y:0 };
function fishOrigin(){
  if (mode === 'sea'){
    const ca = Math.cos(player.a), sa = Math.sin(player.a), w = player.T.wid/2 + 1;
    return { x: player.x - sa*w, y: player.y + ca*w, dx: -sa, dy: ca, d: 34 };
  }
  return { x: hero.x + Math.cos(hero.a)*4, y: hero.y + Math.sin(hero.a)*4, dx: Math.cos(hero.a), dy: Math.sin(hero.a), d: 28 };
}
function canFish(){
  if (state !== 'play' || mode === 'deck') return false;
  if (mode === 'sea') return player.alive && Math.abs(player.v) < 22;
  if (hero.dead) return false;
  const o = fishOrigin(), bx = o.x + o.dx*o.d, by = o.y + o.dy*o.d;
  return !islandAt(bx, by, 1.0) && !solidAt(bx, by, 2);
}
const nearSchool = (x, y) => schools.some(s => Math.hypot(s.x - x, s.y - y) < 100);
function fishKey(){
  if (mode === 'deck') return;
  if (fishing.st === 'idle'){
    if (!canFish()){ msg(mode === 'sea' ? 'STOP THE SHIP TO FISH' : 'FACE THE WATER TO FISH', '#ffffff', 1.3); return; }
    if (cargoUsed() >= cargoCap()){ msg('HOLD FULL! SELL AT PORT ROYAL', '#ff8a7a', 1.8); return; }
    const o = fishOrigin();
    fishing.x = o.x + o.dx*o.d; fishing.y = o.y + o.dy*o.d;
    fishing.st = 'cast'; fishing.t = rand(3, 7)*(nearSchool(fishing.x, fishing.y) ? 0.45 : 1);
    splash(fishing.x, fishing.y, 4); noise(0.08, 0.15, 2500);
  } else if (fishing.st === 'cast'){
    fishing.st = 'idle';
  } else if (fishing.st === 'bite'){
    fishing.st = 'idle';
    if (cargoUsed() >= cargoCap()){ msg('HOLD FULL!', '#ff8a7a', 1.5); return; }
    const boost = nearSchool(fishing.x, fishing.y);
    const ws = FISH.map((f, i) => f.w*(boost ? [0.8, 1.3, 1.8, 2.2][i] : 1)), tot = ws.reduce((a,b) => a+b, 0);
    let r = Math.random()*tot, k = 0; while (r > ws[k]){ r -= ws[k]; k++; }
    const f = FISH[k];
    cargo.fish.push(f.v);
    ft(fishing.x, fishing.y - 12, `${f.n}! ($${f.v})`, k >= 2 ? '#ffd23f' : '#cfe8ff');
    splash(fishing.x, fishing.y, 10); blip(660, 0.08, 0.12); setTimeout(() => blip(880, 0.12, 0.12), 80);
    saveGame();
  }
}
function updateFishing(dt){
  if (fishing.st === 'idle') return;
  if ((mode === 'sea' && (Math.abs(player.v) > 26 || !player.alive)) || (mode === 'foot' && (hero.moving || hero.dead)) || mode === 'deck'){ fishing.st = 'idle'; return; }
  fishing.t -= dt;
  if (fishing.st === 'cast'){
    if (Math.random() < dt*0.8) ripple(fishing.x, fishing.y, 5, 0.8);
    if (fishing.t <= 0){ fishing.st = 'bite'; fishing.t = 1.1; ripple(fishing.x, fishing.y, 10, 0.6); splash(fishing.x, fishing.y, 5); blip(520, 0.1, 0.15); }
  } else if (fishing.st === 'bite' && fishing.t <= 0){
    fishing.st = 'idle'; ft(fishing.x, fishing.y - 12, 'IT GOT AWAY...', '#ffffff');
  }
}
function canRepair(){
  if (player.dinghy) return false;
  if (state !== 'play' || !player.alive || player.hp >= player.T.hp - 0.5 || mode === 'deck') return false;
  return mode === 'sea' || nearShip();
}
function repairKey(){
  if (!canRepair()){ if (player.hp >= player.T.hp - 0.5) msg('HULL IS IN GOOD SHAPE', '#ffffff', 1.3); return; }
  if (cargo.wood <= 0){ msg('NO TIMBER! CHOP TREES ASHORE', '#ff8a7a', 1.8); return; }
  cargo.wood--;
  VO.say('repaired');
  const amt = player.T.hp*0.2;
  player.hp = Math.min(player.T.hp, player.hp + amt);
  player.holes.splice(0, 2);
  ft(player.x, player.y - 26, `+${Math.round(amt)} HULL`, '#7dff5a');
  for (let i = 0; i < 3; i++) setTimeout(() => noise(0.25, 0.08, 1800), i*120);
  for (let i = 0; i < 6; i++) part(player.x + rand(-10,10), player.y + rand(-6,6), rand(-30,30), rand(-30,30), 0.8, 1.2, WOOD[i % 4], 1, 0, 2);
  saveGame();
}

function buy(cost, fn){
  if (player.gold < cost){ blip(150, 0.15, 0.12, 'sawtooth'); return; }
  player.gold -= cost; fn(); coinSound(); saveGame();
}
function getPortMarket(is){
  is.shortages = is.shortages || {};
  const isPortRoyal = is.name === 'PORT ROYAL';
  const isSanEsp = is.name === 'SAN ESPERANZA';
  const isKingsHarb = is.name === "KING'S HARBOUR";

  const prices = {
    sugar:   { buy: isSanEsp ? 8 : isPortRoyal ? 14 : 18, sell: isKingsHarb ? 28 : isPortRoyal ? 20 : 14 },
    rum:     { buy: isPortRoyal ? 12 : 22,                sell: isSanEsp ? 36 : isKingsHarb ? 32 : 22 },
    silk:    { buy: 42,                                   sell: isKingsHarb ? 78 : 55 },
    spices:  { buy: isSanEsp ? 22 : 36,                   sell: isKingsHarb ? 68 : isPortRoyal ? 52 : 34 },
    tobacco: { buy: isPortRoyal ? 12 : 18,                sell: isSanEsp ? 32 : isKingsHarb ? 28 : 20 }
  };

  for (const k in prices){
    const sh = is.shortages[k] || 0;
    if (sh > 0){
      prices[k].sell = Math.round(prices[k].sell * (1 + 0.65 * Math.min(2, sh)));
      prices[k].hasShortage = true;
    }
  }
  return prices;
}

function marketItems(){
  const is = islands.find(i => Math.hypot(hero.x - i.x, hero.y - i.y) < i.max + 120) || port;
  const pm = getPortMarket(is);
  const fv = cargo.fish.reduce((a,b) => a+b, 0);
  const room = cargoCap() - cargoUsed();
  const out = [];

  if (fv > 0 || cargo.fish.length > 0){
    out.push({
      label: `SELL FISH (${cargo.fish.length})`, sub: fv ? `+$${fv}` : 'NONE', ok: fv > 0,
      act: () => { player.gold += fv; cargo.fish = []; msg(`SOLD FISH +$${fv}`, '#7dff5a'); coinSound(); saveGame(); }
    });
  }
  if (cargo.wood > 0){
    out.push({
      label: `SELL TIMBER (${cargo.wood})`, sub: `+$${cargo.wood*3}`, ok: true,
      act: () => { const v = cargo.wood*3; player.gold += v; cargo.wood = 0; msg(`SOLD TIMBER +$${v}`, '#7dff5a'); coinSound(); saveGame(); }
    });
  }

  for (const [k, c] of Object.entries(COMMODITIES)){
    const count = (cargo.goods && cargo.goods[k]) || 0;
    if (count > 0){
      const p = pm[k];
      const totalVal = count * p.sell;
      const shTag = p.hasShortage ? ' ★ SHORTAGE!' : '';
      out.push({
        label: `SELL $${c.name} ($${count})` + shTag,
        sub: `+$${totalVal} ($${p.sell}/ea)`,
        ok: true,
        info: p.hasShortage ? 'High shortage demand from raided supply routes!' : `Port sell price: $${p.sell}`,
        act: () => {
          player.gold += totalVal;
          cargo.goods[k] = 0;
          if (is.shortages && is.shortages[k] > 0) is.shortages[k] = Math.max(0, is.shortages[k] - 0.5);
          msg(`SOLD $${c.name}! +$${totalVal}`, '#7dff5a');
          coinSound(); saveGame();
        }
      });
    }
  }

  for (const [k, c] of Object.entries(COMMODITIES)){
    const p = pm[k];
    const canBuy = player.gold >= p.buy && room > 0;
    out.push({
      label: `BUY 1 $${c.name}`,
      sub: `$${p.buy}`,
      ok: canBuy,
      info: `Cargo hold remaining: $${room}. Sell elsewhere for profit!`,
      act: () => {
        if (room <= 0){ msg('HOLD IS FULL!', '#ff8a7a'); return; }
        if (player.gold < p.buy){ msg('NOT ENOUGH GOLD!', '#ff8a7a'); return; }
        player.gold -= p.buy;
        cargo.goods[k] = (cargo.goods[k] || 0) + 1;
        msg(`BOUGHT 1 $${c.name} FOR $${p.buy}`, '#ffd23f');
        coinSound(); saveGame();
      }
    });
  }

  out.push({ label: 'LEAVE MARKET', sub: '', ok: true, act: () => { menu = null; } });
  return out;
}
const shipValue = (rec, hpFrac) => Math.round((HULLS[rec.hull].cost*0.7 + 140 + rec.guns*70 + rec.sails*90)*(0.55 + 0.45*clamp(hpFrac, 0, 1))/5)*5;
function saleItems(){
  const isl = islands.find(i => Math.hypot(hero.x - i.x, hero.y - i.y) < i.max + 30) || port;
  const near = s => Math.hypot(s.x - isl.x, s.y - isl.y) < isl.max + 380;

  }
  if (!out.length) out.push({ label: 'TO SELL A SHIP, MOOR IT HERE', sub: '', ok: false, info: 'bring your ship (or a stolen one) to this harbour' });

}

  if (state !== 'play') return;

    const nearNavy = castaways.find(c => c.alive && c.type === 'navy' && Math.hypot(player.x - c.x, player.y - c.y) < player.T.len*0.8 + 40);
    if (nearNavy && Math.abs(player.v) <= 30){
      navyTurnPirate(nearNavy);
      return;
    }
    const bt = boardTarget(); if (bt){ grappleTarget(bt); return; }
    if (nearHideoutSea()){ openYard('home'); return; }
    const is = ashoreIsland(); if (is){ goAshore(is); return; }
    if (Math.abs(player.v) < 35){ diveOverboard(); return; }
    return;
  }
  if (mode !== 'foot' || hero.dead) return;
  if (nearStruct('market')){ openMenu('FISH MARKET', marketItems); return; }
  if (nearStruct('shipwright')){ openYard('shipwright'); return; }
  if (nearStruct('shack')){ openYard('home'); return; }
  const c = nearChest(); if (c && !c.chest.open){ openChest(c); return; }
  const ms = nearMoored(), own = nearShip();
  if (ms && (!own || Math.hypot(ms.x - hero.x, ms.y - hero.y) < Math.hypot(player.x - hero.x, player.y - hero.y))){ takeShip(ms, false); return; }
  if (own){ boardShip(); return; }
}
function nearBuriedTreasure(){
  if (mode !== 'foot' || hero.dead) return null;
  return treasureMaps.find(m => !m.dug && Math.hypot(hero.x - m.x, hero.y - m.y) < 42);
}

function prompts(){

  }
  if (mode === 'sea'){
    if (!player.alive) return out;
    { const bt = boardTarget(); if (bt) out.push(bt.type === 'pirate' ? 'F: BOARD HER' : bt.type === 'treasure' ? "F: BOARD THE KING'S GALLEON" : bt.type === 'navy' ? 'F: BOARD THE WARSHIP' : 'F: BOARD THE MERCHANT'); }
    if (boardTarget()){}
    else if (nearHideoutSea()) out.push('F: HIDEOUT');

    const nearNavy = castaways.find(c => c.alive && c.type === 'navy' && Math.hypot(player.x - c.x, player.y - c.y) < player.T.len*0.8 + 40);

    if (nearNavy){
      if (Math.abs(player.v) <= 30) out.push('F: TURN PIRATE   SPACE: WALK THE PLANK');

      if (Math.abs(player.v) <= 30) out.push('STOP TO RESCUE CASTAWAY');
      else out.push('SLOW DOWN TO RESCUE!');
    }
    if (fishing.st === 'bite') out.push('R: REEL IN!');
    else if (fishing.st === 'cast') out.push('WAITING FOR A BITE...');
    else if (Math.abs(player.v) < 22) out.push('R: FISH');
    if (canRepair() && cargo.wood > 0) out.push('H: REPAIR (1 TIMBER)');
  } else {
    if (hero.dead) return out;
    if (nearStruct('market')) out.push('F: FISH MARKET');
    else if (nearStruct('shipwright')) out.push('F: SHIPWRIGHT');
    else if (nearStruct('shack')) out.push('F: HIDEOUT');
    else { const c = nearChest(); if (c && !c.chest.open) out.push(campCleared(c) ? 'F: OPEN CHEST' : 'DEFEAT THE CREW TO OPEN');
      else {
        const ms = nearMoored(), own = nearShip();
        if (ms && (!own || Math.hypot(ms.x - hero.x, ms.y - hero.y) < Math.hypot(player.x - hero.x, player.y - hero.y))) out.push(ms.owned ? `F: TAKE THE ${ms.rec.name}` : `F: STEAL THE ${ms.rec.name}`);
        else if (own) out.push('F: BOARD SHIP');
      } }
    if (treeAhead()) out.push('SPACE: CHOP');
    if (fishing.st === 'bite') out.push('R: REEL IN!');
    else if (fishing.st === 'cast') out.push('WAITING FOR A BITE...');
    else if (canFish()) out.push('R: FISH');
    if (canRepair() && cargo.wood > 0) out.push('H: REPAIR SHIP');
  }
  return out;
}

const schools = [], dolphins = [], whales = [], turtles = [], gulls = [];
for (let i = 0; i < 180; i++){

  for (let k = 0; k < 13; k++) fish.push({ ox: rand(-22,22), oy: rand(-12,12), ph: rand(0,TAU) });

}
for (let i = 0; i < 30; i++){

  const pod = { x:p.x, y:p.y, a:rand(0,TAU), v:110, members:[] };
  for (let k = 0; k < 3; k++) pod.members.push({ ox: rand(-25,25), oy: rand(-25,25), ph: rand(0,TAU) });
  dolphins.push(pod);
}
for (let i = 0; i < 24; i++){ const p = waterPoint(CX, CY, 400, WORLD*0.65, 90); whales.push({ kind:'whale', x:p.x, y:p.y, a:rand(0,TAU), v:24, cycle: rand(0,18), ph: rand(0,TAU) }); }
const sharks = [];
for (let i = 0; i < 45; i++){
  const p = i < 3 ? waterPoint(CX, CY, 300, 900, 40) : waterPoint(CX, CY, 0, WORLD*0.65, 40);
  const wrecks = deepObjs.filter(o => o.kind === 'wreck');
  let home = null, hd = 1800; for (const o of wrecks){ const d = Math.hypot(o.x - p.x, o.y - p.y); if (d < hd){ hd = d; home = o; } }
  sharks.push({ kind:'shark', x:p.x, y:p.y, a:rand(0,TAU), v:40, ph:rand(0,TAU), depth:8, dp:rand(0,TAU), home, tx:p.x, ty:p.y, t:0 });
}
for (let i = 0; i < 110; i++){
  const is = islands[i % islands.length]; if (!is) break;
  const a = rand(0,TAU), r = islR(is, a)*1.18;
  turtles.push({ x: is.x+Math.cos(a)*r, y: is.y+Math.sin(a)*r, a: rand(0,TAU), v: 12, home: is });
}
for (let i = 0; i < 14; i++) gulls.push({ x: CX+rand(-900,900), y: CY+rand(-900,900), a: rand(0,TAU), v: rand(50,70), ph: rand(0,TAU) });

function swim(o, dt, look, turnRate=1.5){
  const ca = Math.cos(o.a), sa = Math.sin(o.a);
  if (solidAt(o.x + ca*look, o.y + sa*look, 6) || o.x < 100 || o.y < 100 || o.x > WORLD-100 || o.y > WORLD-100) o.a += turnRate*2*dt;
  o.x += Math.cos(o.a)*o.v*dt; o.y += Math.sin(o.a)*o.v*dt;
  o.x = clamp(o.x, 60, WORLD-60); o.y = clamp(o.y, 60, WORLD-60);
}
function updateLife(dt){
  for (const s of schools){
    if (Math.abs(s.x - cam.x) > 2500 || Math.abs(s.y - cam.y) > 2500) continue;
    let near = null;
    for (const sh of ships){ if (sh.alive && Math.abs(sh.v) > 15 && Math.abs(sh.x - s.x) < 110 && Math.hypot(sh.x-s.x, sh.y-s.y) < 110){ near = sh; break; } }
    if (near){ s.scare = 1.5; const away = Math.atan2(s.y-near.y, s.x-near.x); s.a += clamp(angDiff(away, s.a), -4*dt, 4*dt); }
    s.scare -= dt; s.v = s.scare > 0 ? 90 : 28;
    s.a += Math.sin(time*0.3 + s.fish[0].ph)*0.4*dt;
    swim(s, dt, 40);
  }
  for (const p of dolphins){
    if (Math.abs(p.x - cam.x) > 3000 || Math.abs(p.y - cam.y) > 3000) continue;
    const pd = Math.hypot(player.x-p.x, player.y-p.y);
    if (player.alive && pd < 420 && Math.abs(player.v) > 40){
      const tx = player.x + Math.cos(player.a)*70, ty = player.y + Math.sin(player.a)*70;
      p.a += clamp(angDiff(Math.atan2(ty-p.y, tx-p.x), p.a), -2.5*dt, 2.5*dt);
      p.v = Math.min(200, Math.abs(player.v) + 25);
    } else { p.v = 110; p.a += Math.sin(time*0.5 + p.members[0].ph)*0.5*dt; }
    swim(p, dt, 60);
    for (const m of p.members){
      if (Math.sin(time*2.2 + m.ph) > 0.97 && Math.random() < 0.3 && Math.hypot(p.x-cam.x, p.y-cam.y) < 900){
        part(p.x+m.ox, p.y+m.oy, rand(-10,10), rand(-10,10), 0.5, 2, '#ffffff', 0, 4);
        if (Math.random() < 0.15) ripple(p.x+m.ox, p.y+m.oy, 8, 0.8);
      }
    }
  }
  for (const w of whales){
    if (Math.abs(w.x - cam.x) > 3200 || Math.abs(w.y - cam.y) > 3200){ w.cycle += dt; continue; }
    w.cycle += dt; w.a += Math.sin(time*0.1 + w.cycle*0.01)*0.15*dt;
    swim(w, dt, 110, 0.8);
    const c = w.cycle % 20;
    if (c > 14 && c < 14.15 && Math.hypot(w.x - player.x, w.y - player.y) < 650) VO.say('whale');
    if (c > 14 && c < 14.6 && Math.random() < 0.6){
      const hx = w.x + Math.cos(w.a)*20, hy = w.y + Math.sin(w.a)*20;
      part(hx, hy, rand(-12,12)+10, rand(-12,12)-6, rand(0.8,1.4), 4, '#eaf6ff', 1, 10);
    }
    if (c > 14 && c < 14.05) ripple(w.x, w.y, 45, 2);
  }
  for (const c of sharks){
    if (Math.abs(c.x - cam.x) > 2600 || Math.abs(c.y - cam.y) > 2600) continue;
    c.t -= dt;
    let tx = c.tx, ty = c.ty, sp = 38;
    const sk = sinking.find(k => Math.hypot(k.s.x - c.x, k.s.y - c.y) < 800);
    if (sk){ tx = sk.s.x; ty = sk.s.y; sp = 95; c.depth += (2 - c.depth)*dt; }
    else {
      c.depth = 8 + Math.sin(time*0.22 + c.dp)*6.5;
      if (c.home){ const a = time*0.18 + c.dp; tx = c.home.x + Math.cos(a)*120; ty = c.home.y + Math.sin(a)*90; }
      else if (c.t <= 0 || Math.hypot(c.tx - c.x, c.ty - c.y) < 60){ const p = waterPoint(c.x, c.y, 150, 500, 30); c.tx = p.x; c.ty = p.y; c.t = rand(8, 16); tx = c.tx; ty = c.ty; }
    }
    c.a += clamp(angDiff(Math.atan2(ty - c.y, tx - c.x), c.a), -1.3*dt, 1.3*dt);
    c.v += (sp - c.v)*Math.min(1, dt*1.5);
    swim(c, dt, 30);
  }
  for (const t of turtles){
    if (Math.abs(t.x - cam.x) > 2600 || Math.abs(t.y - cam.y) > 2600) continue;
    if (Math.hypot(t.x-t.home.x, t.y-t.home.y) > t.home.max*1.6) t.a += clamp(angDiff(Math.atan2(t.home.y-t.y, t.home.x-t.x), t.a), -dt, dt);
    else t.a += Math.sin(time*0.4 + t.home.R)*0.6*dt;
    swim(t, dt, 18);
  }
  for (const g of gulls){
    g.a += Math.sin(time*0.7 + g.ph)*0.9*dt;
    if (Math.hypot(cam.x-g.x, cam.y-g.y) > 900) g.a += clamp(angDiff(Math.atan2(cam.y-g.y, cam.x-g.x), g.a), -1.5*dt, 1.5*dt);
    g.x += Math.cos(g.a)*g.v*dt; g.y += Math.sin(g.a)*g.v*dt;
  }
  for (const is of bigLands){
    if (!is.volc || Math.hypot(is.x + is.vx - cam.x, is.y + is.vy - cam.y) > (graphicsMode === 'high' ? 2600 : 1000)) continue;
    const vx = is.x + is.vx, vy = is.y + is.vy;
    if (Math.random() < dt*7){ const [ox, oy] = lean(vx, vy, 40); part(vx + ox + rand(-12,12), vy + oy + rand(-12,12), 16 + rand(-6,6), -12 + rand(-6,6), rand(5, 9), rand(10, 16), Math.random() < 0.5 ? '#4a4440' : '#625a54', 1, 50); }
    if (Math.random() < dt*6) part(vx + rand(-10,10), vy + rand(-10,10), rand(-50,50), rand(-50,50), rand(0.5,1.1), rand(1.5,3), Math.random() < 0.5 ? '#ff8a20' : '#ffd050', 1, 0, 1);
    if (Math.random() < dt*0.08){ if (volAt(vx, vy) > 0.3) VO.say('eruption'); for (let i = 0; i < 26; i++) part(vx, vy, rand(-120,120), rand(-120,120), rand(0.8,1.8), rand(2,4), '#ff7a20', 1, 0, 1); noise(0.35*volAt(vx, vy) + 0.05, 1.4, 120); shake = Math.max(shake, 2*volAt(vx, vy)); }
  }
  for (const is of islands){
    if (Math.hypot(is.x-cam.x, is.y-cam.y) > (graphicsMode === 'high' ? 1100 : 600) + is.max) continue;
    for (const f of is.fires) if (Math.random() < dt*4) part(f.x + rand(-1,1), f.y + rand(-1,1), 9 + rand(-3,3), -5 + rand(-3,3), rand(2.5,4), 2.2, '#d4d4d4', 1, 10);
    for (const t of is.trees){
      if (t.shake > 0) t.shake -= dt;
      if (t.down){ t.regrow -= dt; if (t.regrow <= 0 && !(mode === 'foot' && Math.hypot(hero.x - is.x - t.x, hero.y - is.y - t.y) < 25)){ t.down = false; t.hp = 3; } }
    }
  }
}

const keys = {};
addEventListener('keydown', e => {
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab'].includes(e.code)) e.preventDefault();
  if (e.code === 'ControlLeft' || (e.ctrlKey && /^(Key[WASDFRHXQEKPM]|Space|Arrow)/.test(e.code))) e.preventDefault();

  if (state === 'title'){
    if (e.code === 'KeyN' && hadSave){ newGame(); blip(400, 0.1, 0.1); return; }
    if (e.code === 'KeyG'){ toggleGraphicsMode(); blip(800, 0.08, 0.1); return; }
    if (e.code === 'F3'){ perfMetrics.show = !perfMetrics.show; e.preventDefault(); return; }
    if (e.code === 'Enter' || e.code === 'Space') startGame();
    return;
  }
  if (state !== 'play') return;
  if (e.code === 'Tab' && !menu){ showMap = !showMap; return; }
  if (showMap && (e.code === 'Escape' || e.code === 'KeyP')){ showMap = false; return; }
  if (menu){ if (!e.repeat) menuKey(e.code); return; }
  keys[e.code] = true;
  if (e.repeat) return;
  if (e.code === 'KeyP' || e.code === 'Escape'){ openPause(); return; }
  if (e.code === 'F3'){ perfMetrics.show = !perfMetrics.show; e.preventDefault(); return; }
  if (e.code === 'KeyG'){ toggleGraphicsMode(); return; }
  if (e.code === 'KeyM'){ muted = !muted; if (bgmAudio) bgmAudio.volume = muted ? 0 : (musicEnabled ? bgmBaseVol : 0); }
  else if (e.code === 'KeyN' && state === 'play' && !menu){ musicEnabled = !musicEnabled; if (!musicEnabled && bgmAudio) bgmAudio.pause(); else if (musicEnabled && bgmAudio) bgmAudio.play().catch(()=>{}); msg(musicEnabled ? 'MUSIC ON' : 'MUSIC MUTED', '#ffd23f', 1.2); }
  if (e.code === 'KeyK'){ manualSave(); return; }
  if (e.code === 'KeyZ'){
    copyZoomCalibrations();
    zoomDisplayT = 4.5;
    return;
  }
  if (e.code === 'Digit0' || e.code === 'Numpad0'){
    const curKey = getActiveZoomKey();
    zoomLevels[curKey] = zoomDefaults[curKey];
    saveZoomLevels();
    zoomDisplayT = 3.5;
    msg('RESET ' + getActiveZoomLabel(curKey) + ' TO ' + Math.round(zoomDefaults[curKey]*100) + '%', '#ffd23f', 1.8);
    return;
  }
  if (e.code === 'Equal' || e.code === 'NumpadAdd' || e.code === 'BracketRight'){
    const curKey = getActiveZoomKey();
    zoomLevels[curKey] = clamp(Math.round((zoomLevels[curKey] + 0.05) * 100) / 100, 0.35, 4.00);
    saveZoomLevels();
    zoomDisplayT = 4.0;
    return;
  }
  if (e.code === 'Minus' || e.code === 'NumpadSubtract' || e.code === 'BracketLeft'){
    const curKey = getActiveZoomKey();
    zoomLevels[curKey] = clamp(Math.round((zoomLevels[curKey] - 0.05) * 100) / 100, 0.35, 4.00);
    saveZoomLevels();
    zoomDisplayT = 4.0;
    return;
  }
  if (paused) return;
  if (e.code === 'KeyF') interact();
  if (e.code === 'KeyR') fishKey();
  if (e.code === 'KeyH') repairKey();
  if (e.code === 'KeyX') dropMine();
  if (((e.code === 'ShiftLeft' || e.code === 'ShiftRight') && (keys.KeyW || keys.ArrowUp)) || ((e.code === 'KeyW' || e.code === 'ArrowUp') && (e.shiftKey || keys.ShiftLeft || keys.ShiftRight))) triggerDash();
});
addEventListener('keyup', e => { keys[e.code] = false; });

const zoomDefaults = {
  stationary: 1.50, // 150%
  moving:     0.76, // 76%
  deck:       2.20, // 220%
  land:       0.76  // 76%
};
const zoomLevels = { ...zoomDefaults };
try {
  const saved = localStorage.getItem('broadside.mini.zoomLevels');
  if (saved){
    const obj = JSON.parse(saved);
    if (obj && typeof obj === 'object') Object.assign(zoomLevels, obj);
  }
} catch(e){}

function saveZoomLevels(){
  try { localStorage.setItem('broadside.mini.zoomLevels', JSON.stringify(zoomLevels)); } catch(e){}
}

function getActiveZoomKey(){
  if (mode === 'deck') return 'deck';
  if (mode === 'foot') return 'land';
  const spd = Math.abs(player.v || 0);
  return spd > 8 ? 'moving' : 'stationary';
}

function getActiveZoomLabel(key){
  if (key === 'deck') return 'DECK COMBAT';
  if (key === 'land') return 'WALKING ON LAND';
  if (key === 'moving') return 'MOVING SHIP';
  return 'STATIONARY SHIP';
}

function copyZoomCalibrations(){
  const text = `Stationery Ship: ${Math.round(zoomLevels.stationary * 100)}%\nMoving Ship: ${Math.round(zoomLevels.moving * 100)}%\nFighting on the deck, Zoom: ${Math.round(zoomLevels.deck * 100)}%\nWalking On Land: ${Math.round(zoomLevels.land * 100)}%`;
  if (typeof navigator !== 'undefined' && navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(() => {
      msg('COPIED CALIBRATIONS TO CLIPBOARD!', '#7dff5a', 2.2);
    }).catch(() => fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
  function fallbackCopy(str){
    try {
      const ta = document.createElement('textarea');
      ta.value = str; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy');
      document.body.removeChild(ta);
      msg('COPIED CALIBRATIONS TO CLIPBOARD!', '#7dff5a', 2.2);
    } catch(err){
      msg('ZOOMS: ' + text.replace(/\n/g, ' | '), '#ffd23f', 4.0);
    }
  }
}

let zoomDisplayT = 0;
window.addEventListener('wheel', e => {
  if (state !== 'play') return;
  e.preventDefault();
  const curKey = getActiveZoomKey();
  const dir = e.deltaY < 0 ? 0.05 : -0.05; // 5% per scroll click
  zoomLevels[curKey] = clamp(Math.round((zoomLevels[curKey] + dir) * 100) / 100, 0.35, 4.00);
  saveZoomLevels();
  zoomDisplayT = 4.5;
}, { passive: false });

window.addEventListener('auxclick', e => {
  if (e.button === 1){
    const curKey = getActiveZoomKey();
    zoomLevels[curKey] = zoomDefaults[curKey];
    saveZoomLevels();
    zoomDisplayT = 3.5;
    msg('RESET ' + getActiveZoomLabel(curKey) + ' TO ' + Math.round(zoomDefaults[curKey]*100) + '%', '#ffd23f', 1.8);
  }
});

}

  try { if (TV.bc) TV.bc.close(); TV.bc = new BroadcastChannel(NET.channel(TV.code)); TV.bc.onmessage = e => padMsg(e.data); } catch(e){}
  NET.loadPeer().then(ok => {
    if (!ok){ TV.status = 'offline'; return; }
    const peer = new Peer(NET.peerId(TV.code)); TV.peer = peer;
    peer.on('open', () => { TV.status = 'ready'; });
    peer.on('connection', c => {
      c.on('open', () => { TV.conns.add(c); tvSendState(true); });
      c.on('data', d => padMsg(d));
      c.on('close', () => TV.conns.delete(c));
    });
    peer.on('error', e => {
      if (e.type === 'unavailable-id'){ try { peer.destroy(); } catch(_){} TV.status = 'starting'; tvNetStart(true); }
      else if (e.type !== 'peer-unavailable') TV.status = 'error';
    });
    peer.on('disconnected', () => { try { peer.reconnect(); } catch(_){} });
  });
}

}

function padMsg(d){

  if (d.id){ const last = TV.seen[d.id] || 0; if (d.q <= last) return; TV.seen[d.id] = d.q; }
  const wasLinked = padLinked();
  TV.lastMsg = performance.now();
  if (!wasLinked && state !== 'loading') msg('PHONE CONTROLLER CONNECTED', '#7dff5a', 2.2);
  if (d.t === 'hello'){ tvSendState(true); return; }
  if (d.t === 'in'){ TV.pad.jx = clamp(+d.jx || 0, -1, 1); TV.pad.jy = clamp(+d.jy || 0, -1, 1); TV.pad.b = d.b | 0; TV.pad.t = performance.now(); return; }
  if (d.t === 'yardTab'){

      menu.yard.tab = d.tab | 0;
      menu.yard.opt = 0;

  }

        yardBuyCurrent();
      } else {

    if (it.ok && it.act) it.act(); else blip(150, 0.15, 0.12, 'sawtooth');

    hp: mode === 'sea' ? player.hp/player.T.hp : hero.hp/hero.max,

    menu: menu ? {

  };

// the phone's FIRE button picks the side facing the nearest enemy
function smartFire(){
  let best = null, bd = 430;
  for (const s of ships){
    if (!s.alive || s === player || s.type === 'fisher' || s.type === 'moored') continue;
    if (s.type === 'navy' && !player.wanted) continue;
    const d = dist(s, player); if (d < bd){ bd = d; best = s; }
  }
  if (!best){ fire(player, -1); fire(player, 1); return; }
  fire(player, angDiff(Math.atan2(best.y - player.y, best.x - player.x), player.a) > 0 ? 1 : -1);
}
function drawQR(x, y, size){
  const url = padURL(); if (!url) return 0;
  if (!TV.qr || TV.qrFor !== url){ TV.qr = QR.encode(url); TV.qrFor = url; }
  const M = TV.qr, n = M.length, q = 3, cell = Math.max(1, Math.floor(size/(n + q*2))), w = cell*(n + q*2);
  ctx.fillStyle = '#fff'; ctx.fillRect(x, y, w, w);
  ctx.fillStyle = '#000';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (M[r][c]) ctx.fillRect(x + (c + q)*cell, y + (r + q)*cell, cell, cell);
  return w;
}
function drawPhonePanel(x, y, size){

  otext(linked ? 'PHONE CONNECTED' : 'PLAY WITH YOUR PHONE', x + w/2, y + 12, linked ? '#7dff5a' : '#ffd23f', 17, 'center');

/* =========================================================
   UPDATE
   ========================================================= */
let timers = { pirate: 0, navy: 0, fisher: 0, barrel: 0 }, hintT = 0, saveT = 0;

function update(dt){
  time += dt; hintT += dt;
  updateWind(dt);
  updateWeather(dt);
  if (player.alive) updateFogOfWar(player.x, player.y);
  if (player.wanted >= 4 && !ships.some(s => s.alive && s.isHunter)){
    spawnHunter();
  }
  if (state === 'play' && player.alive && mode === 'sea' && !menu){
    const up = keys.KeyW || keys.ArrowUp, dn = keys.KeyS || keys.ArrowDown;
    const lf = keys.KeyA || keys.ArrowLeft, rt = keys.KeyD || keys.ArrowRight;
    player.thr = up ? 1 : dn ? -0.35 : 0;
    player.steer = (rt ? 1 : 0) - (lf ? 1 : 0);
    const pad = padLive() ? TV.pad : null;
    if (pad){
      // the joystick points where you want to go; the ship turns towards it
      const mag = Math.min(1, Math.hypot(pad.jx, pad.jy));
      if (mag > 0.2){
        const want = Math.atan2(pad.jy, pad.jx), off = angDiff(want, player.a);
        player.steer = clamp(off*2.2, -1, 1);
        player.thr = Math.abs(off) > 2.3 ? 0.25 : mag;
      }
      if (pad.b & 8) smartFire();
    }
    if (spaceLock && !keys.Space) spaceLock = false;
    const nearNavyPlank = castaways.find(c => c.alive && c.type === 'navy' && Math.hypot(player.x - c.x, player.y - c.y) < player.T.len*0.8 + 40);
    if (keys.Space && !spaceLock && nearNavyPlank && Math.abs(player.v) <= 30){
      spaceLock = true;
      navyWalkThePlank(nearNavyPlank);
    } else {
      const spc = keys.Space && !spaceLock;
      if (keys.KeyQ || keys.KeyJ || spc || (pad && pad.b & 1)) fire(player, -1);
      if (keys.KeyE || keys.KeyL || spc || (pad && pad.b & 2)) fire(player, 1);
    }
    if (player.dinghy) player.rowPh = (player.rowPh || 0) + dt*(player.thr > 0.05 ? 3.6 + Math.abs(player.v)/60 : Math.sin(player.rowPh || 0) > 0.05 ? 2 : 0);
    hurtT += dt;
    if (hurtT > 5 && player.hp < player.T.hp*0.5) player.hp = Math.min(player.T.hp*0.5, player.hp + 1.5*dt);
  } else { player.thr = 0; player.steer = 0; }

  if (state === 'play' && mode === 'sea' && player.alive){
    if (Math.abs(player.v) > 25 && Math.random() < dt * 0.02) VO.say('idle');
    if (player.x < 350 || player.x > WORLD - 350 || player.y < 350 || player.y > WORLD - 350) VO.say('edge_fog');
  }
  for (const s of ships){
    if (!s.alive) continue;
    shipFx(s, dt);
    if (s.type === 'moored'){ s.v = 0; continue; }
    if (deck && (s === deck.ship || s === deck.other)){ s.v = 0; continue; }
    if (s.type === 'pirate') aiPirate(s, dt);
    else if (s.type === 'navy') aiNavy(s, dt);
    else if (s.type === 'fisher') aiFisher(s, dt);
    else if (s.type === 'treasure' || s.type === 'trader') aiTrader(s, dt);
    moveShip(s, dt);
  }
  for (let i = 0; i < ships.length; i++){
    const a = ships[i]; if (!a.alive) continue;
    const aLen = a.T.len, aWid = a.T.wid;
    const caA = Math.cos(a.a), saA = Math.sin(a.a);
    const aOff = aLen * 0.28, aR = aWid * 0.52;
    const aPts = [
      { x: a.x, y: a.y, r: aR },
      { x: a.x + caA * aOff, y: a.y + saA * aOff, r: aR * 0.92 },
      { x: a.x - caA * aOff, y: a.y - saA * aOff, r: aR * 0.92 }
    ];

    for (let j = i + 1; j < ships.length; j++){
      const b = ships[j]; if (!b.alive) continue;
      if (deck && (a === deck.ship || a === deck.other) && (b === deck.ship || b === deck.other)) continue;
      
      const dx0 = b.x - a.x, dy0 = b.y - a.y;
      const reach = (aLen + b.T.len) * 0.65;
      if (Math.abs(dx0) > reach || Math.abs(dy0) > reach) continue;

      const bLen = b.T.len, bWid = b.T.wid;
      const caB = Math.cos(b.a), saB = Math.sin(b.a);
      const bOff = bLen * 0.28, bR = bWid * 0.52;
      const bPts = [
        { x: b.x, y: b.y, r: bR },
        { x: b.x + caB * bOff, y: b.y + saB * bOff, r: bR * 0.92 },
        { x: b.x - caB * bOff, y: b.y - saB * bOff, r: bR * 0.92 }
      ];

      let maxOverlap = 0, nx = 0, ny = 0;
      for (const pa of aPts){
        for (const pb of bPts){
          const dxx = pb.x - pa.x, dyy = pb.y - pa.y;
          const d = Math.hypot(dxx, dyy);
          const minD = pa.r + pb.r;
          if (d < minD && d > 0.001){
            const ov = minD - d;
            if (ov > maxOverlap){
              maxOverlap = ov;
              nx = dxx / d;
              ny = dyy / d;
            }
          }
        }
      }

      if (maxOverlap > 0){
        const dotA = caA * nx + saA * ny;
        const dotB = caB * (-nx) + saB * (-ny);

        // Speed-based Ramming Collision Check (driving fast into another ship causes damage)
        if (a === player && a.v > 42 && dotA > 0.15 && b.alive && (!b.ramT || time > b.ramT)){
          b.ramT = time + 0.8;
          rammed(b, nx, ny, a.v);
        } else if (b === player && b.v > 42 && dotB > 0.15 && a.alive && (!a.ramT || time > a.ramT)){
          a.ramT = time + 0.8;
          rammed(a, -nx, -ny, b.v);
        }

        const am = a.type === 'moored', bm = b.type === 'moored';
        const pushA = bm ? maxOverlap * 1.05 : maxOverlap * 0.54;
        const pushB = am ? maxOverlap * 1.05 : maxOverlap * 0.54;

        if (!am && !solidAt(a.x - nx * pushA, a.y - ny * pushA)){
          a.x -= nx * pushA; a.y -= ny * pushA;
        }
        if (!bm && !solidAt(b.x + nx * pushB, b.y + ny * pushB)){
          b.x += nx * pushB; b.y += ny * pushB;
        }

        // Cancel forward velocity directed into the other ship (no driving over!)
        if (dotA * a.v > 0){
          a.v *= Math.max(0, 1 - dotA * 0.92);
        }
        if (dotB * b.v > 0){
          b.v *= Math.max(0, 1 - dotB * 0.92);
        }

        // Wood creak & splinter crunch FX on noticeable impact
        if (Math.abs(a.v) + Math.abs(b.v) > 30){
          const cx = (a.x + b.x)/2, cy = (a.y + b.y)/2;
          noise(0.15 * volAt(cx, cy), 0.12, 480);
          for (let k = 0; k < 3; k++){
            part(cx, cy, rand(-25,25), rand(-25,25), rand(0.4, 0.9), 1.6, WOOD[(Math.random()*4)|0], 0, 0, 2);
          }
        }
      }
    }
  }
  for (let i = sinking.length-1; i >= 0; i--){
    const k = sinking[i]; k.t += dt;
    if (Math.random() < dt*12) part(k.s.x+rand(-12,12), k.s.y+rand(-8,8), 0, 0, 0.8, 2, '#d6f2ff', 0, 5);
    if (k.t > 3){ sinking.splice(i,1); if (k.s !== player){ const idx = ships.indexOf(k.s); if (idx >= 0) ships.splice(idx,1); } }
  }
  if (!player.alive){
    deadT += dt;
    if (deadT > 3.5){
      const p = waterPoint(home.x, home.y, home.max + 90, home.max + 200, 60);
      Object.assign(player, { x:p.x, y:p.y, v:0, a: Math.atan2(home.y - p.y, home.x - p.x), hp:player.T.hp, alive:true, rl:0, rr:0, trail:[], holes:[] });
      msg('BACK AT YOUR HIDEOUT', '#ffffff', 1.8);
      saveGame();
    }
  }
  if (hitStop > 0) hitStop -= dt;
  const combatDt = hitStop > 0 ? dt * 0.12 : dt;
  if (mode !== 'sea') updateHero(combatDt);
  updateFoes(combatDt);
  updateDeck(dt);
  updateFishing(dt);
  updateMines(dt);
  updateCastaways(dt);
  updateBloodPools(dt);
  updatePlankWalkers(dt);

  // wanted level cools off when the navy loses sight of you
  if (player.wanted > 0){
    if (time - wantedSeen > 10){ player.wanted--; wantedSeen = time; if (!player.wanted) msg('THE NAVY LOST YOUR TRAIL', '#6fa8ff', 2); }
  }

  for (let i = balls.length-1; i >= 0; i--){
    const b = balls[i]; b.t += dt; b.x += b.vx*dt; b.y += b.vy*dt;
    if (Math.random() < dt*(graphicsMode === 'high' ? 25 : 7)) part(b.x, b.y - Math.sin(b.t/b.life*Math.PI)*12, 0, 0, 0.4, 1.6, '#cccccc', 1, 3);
    let done = false;
    if (b.t > b.life){ splash(b.x, b.y); if (volAt(b.x,b.y) > 0.3) noise(0.08*volAt(b.x,b.y), 0.2, 1500); done = true; }
    else if (b.t > 0.08 && solidAt(b.x, b.y)){
      const groundN = graphicsMode === 'high' ? 6 : 2;
      for (let k = 0; k < groundN; k++) part(b.x, b.y, rand(-30,30), rand(-30,30), 0.7, 3, '#c9b07a', 1, 4);
      done = true;
    } else {
      for (const s of ships){
        if (!s.alive || s === b.owner || s.team === b.team) continue;
        const dx = b.x - s.x, dy = b.y - s.y;
        if (dx*dx + dy*dy > s.T.len*s.T.len) continue;
        const ca = Math.cos(s.a), sa = Math.sin(s.a);
        const lx = dx*ca + dy*sa, ly = -dx*sa + dy*ca;
        if (Math.abs(lx) < s.T.len/2 && Math.abs(ly) < s.T.wid/2 + 3){
          part(b.x, b.y, 0, 0, 0.18, 8, '#ffb040', 1, 4, 1);
          const woodN = graphicsMode === 'high' ? 7 : 2;
          for (let k = 0; k < woodN; k++) part(b.x, b.y, rand(-60,60), rand(-60,60), rand(1.5,3), rand(1,1.8), WOOD[(Math.random()*4)|0], 0, 0, 2);
          const smkN = graphicsMode === 'high' ? 3 : 1;
          for (let k = 0; k < smkN; k++) part(b.x, b.y, rand(-15,15), rand(-15,15), rand(0.8,1.4), 4, '#777777', 1, 10);
          if (s.holes.length < 12) s.holes.push({ x: clamp(lx, -s.T.len*0.4, s.T.len*0.38), y: clamp(ly, -s.T.wid*0.4, s.T.wid*0.4), r: rand(0.9, 1.7), rot: rand(0,TAU) });
          noise(0.25*volAt(b.x,b.y), 0.25, 900);
          damage(s, b.dmg, b.owner);
          done = true; break;
        }
      }
    }
    if (done) balls.splice(i,1);
  }
  for (let i = crates.length-1; i >= 0; i--){
    const c = crates[i]; c.t += dt;
    if (mode === 'sea' && player.alive && Math.hypot(c.x-player.x, c.y-player.y) < 32 + player.T.len*0.2){
      if (c.kind === 'fish'){
        const room = cargoCap() - cargoUsed();
        if (room <= 0) continue;
        const n = Math.min(room, 2); for (let k = 0; k < n; k++) cargo.fish.push(6);
        ft(c.x, c.y-14, `+${n} FISH`, '#cfe8ff');
      } else { player.gold += c.val; ft(c.x, c.y-14, `+$${c.val}`, '#ffe14a'); }
      coinSound(); ripple(c.x, c.y, 12, 0.8);
      crates.splice(i,1); continue;
    }
    if (c.t > 60) crates.splice(i,1);
  }
  timers.barrel -= dt;
  if (timers.barrel <= 0 && crates.length < 18){
    timers.barrel = 6;
    const p = waterPoint(player.x, player.y, 500, 1500);
    crates.push({ x:p.x, y:p.y, val: Math.floor(rand(5,15)), kind:'barrel', t:0, ph: rand(0,TAU) });
  }
  const count = t => ships.filter(s => s.type === t && s.alive && !s.fleet && !s.lord).length;
  for (const [t, want, gap, near] of [['pirate', 8, 6, [1100, 2200]], ['navy', Math.min(8, 4 + player.wanted), player.wanted ? 4 : 12, [1000, 2000]], ['fisher', 18, 8, [700, 2200]], ['trader', 6, 10, [1400, 2600]]]){
    timers[t] -= dt;
    if (count(t) < want && timers[t] <= 0){ spawnShip(t, near); timers[t] = gap; }
  }
  timers.fleet = (timers.fleet || 0) - dt;
  if (timers.fleet <= 0){ timers.fleet = 30; if (ships.filter(s => s.alive && s.type === 'treasure').length < 3){ const far = ports.filter(q => Math.hypot(q.x - player.x, q.y - player.y) > 1800); spawnFleet(far.length ? pick(far) : null); } }
  timers.lord = (timers.lord || 60) - dt;
  if (timers.lord <= 0){ timers.lord = 120; if (!ships.some(s => s.alive && s.lord)) spawnLord(); }
  // ships that wander very far away are recycled near the player
  for (let i = ships.length-1; i >= 0; i--){
    const s = ships[i]; if (s === player || !s.alive || s.type === 'moored' || s.fleet || (deck && (s === deck.ship || s === deck.other))) continue;
    const d = dist(s, player);
    if (s.lord && d < 9000) continue;
    if (d > 4200 || (s.type === 'pirate' && s.ai.state === 'flee' && d > 2600)) ships.splice(i,1);
  }

  updateLife(dt);

  for (let i = parts.length-1; i >= 0; i--){
    const p = parts[i]; p.life -= dt;
    if (p.life <= 0){
      parts[i] = parts[parts.length - 1];
      parts.pop();
      continue;
    }
    p.x += p.vx*dt; p.y += p.vy*dt; p.vx *= 0.97; p.vy *= 0.97;
    if (p.kind === 2){ p.rot += p.vr*dt; p.vr *= 0.97; }
  }
  for (let i = ripples.length-1; i >= 0; i--){
    const r = ripples[i]; r.t += dt;
    if (r.t > r.life){ ripples[i] = ripples[ripples.length - 1]; ripples.pop(); }
  }
  for (let i = ftexts.length-1; i >= 0; i--){
    const f = ftexts[i]; f.age += dt; f.y -= 18*dt;
    if (f.age > 1.6){ ftexts[i] = ftexts[ftexts.length - 1]; ftexts.pop(); }
  }
  if (message){ message.age += dt; if (message.age > message.dur) message = null; }
  if (banner){ banner.age += dt; if (banner.age > 3) banner = null; }
  if (zoomDisplayT > 0) zoomDisplayT = Math.max(0, zoomDisplayT - dt);

  const f = focus();
  let near = null;
  for (const is of islands) if (Math.hypot(is.x-f.x, is.y-f.y) < is.max + 260){ near = is; break; }
  if (near !== curIsland){ curIsland = near; if (near && state === 'play') banner = { t: near.name.toUpperCase(), age: 0 }; }

  saveT += dt; if (saveT > 10 && state === 'play'){ saveT = 0; saveGame(); }

  // camera: zooms out the faster you sail with user-calibrated presets
  const baseZ = clamp(Math.min(VW, VH)/380, 0.95, 2.6);
  if (state !== 'play'){
    cam.x = CX + 220 + Math.cos(time*0.08)*300; cam.y = CY - 40 + Math.sin(time*0.08)*300; cam.z = baseZ*0.85;
  } else if (mode === 'deck' && deck){
    const k = Math.min(1, dt*4);
    cam.x += ((hero.x + deck.ship.x)/2 - cam.x)*k; cam.y += ((hero.y + deck.ship.y)/2 - cam.y)*k;
    // Fighting on the deck: True linear zoom percentage
    const targetZ = baseZ * zoomLevels.deck;
    cam.z += (targetZ - cam.z)*Math.min(1, dt*3.0);
  } else if (mode === 'foot'){
    const k = Math.min(1, dt*5);
    cam.x += (hero.x - cam.x)*k; cam.y += (hero.y - cam.y)*k;
    // Walking On Land: True linear zoom percentage
    const targetZ = baseZ * zoomLevels.land;
    cam.z += (targetZ - cam.z)*Math.min(1, dt*3.0);
  } else {
    const spd = Math.min(1, Math.abs(player.v)/player.T.maxv);
    const tx = player.x + Math.cos(player.a)*player.v*1.1, ty = player.y + Math.sin(player.a)*player.v*1.1;
    const k = Math.min(1, dt*2.5);
    cam.x += (tx - cam.x)*k; cam.y += (ty - cam.y)*k;
    // Sea mode: True linear zoom blend between stationary and moving
    const seaMult = zoomLevels.stationary - (zoomLevels.stationary - zoomLevels.moving) * spd;
    const dinghyFactor = player.dinghy ? 1.4 : 1.0;
    const targetZ = baseZ * seaMult * dinghyFactor;
    cam.z += (targetZ - cam.z)*Math.min(1, dt*2.0);
  }
  shake = Math.max(0, shake - dt*15);
}

/* =========================================================
   RENDERING
   ========================================================= */
let vx0 = 0, vy0 = 0, vw = 0, vh = 0;
const vis = (x, y, r) => x + r > vx0 && x - r < vx0 + vw && y + r > vy0 && y - r < vy0 + vh;
const toScreen = (x, y) => [ (x - cam.x)*cam.z + VW/2, (y - cam.y)*cam.z + VH/2 ];

function drawDeep(o){
  const depth = o.depth || 40;
  const [ox, oy] = lean(o.x, o.y, -depth);
  ctx.save(); ctx.translate(o.x + ox, o.y + oy); ctx.rotate(o.rot);
  // Atmospheric ocean absorption: deeper submerged objects shift with intense parallax and subtle cyan tint
  const alpha = o.shallow ? 0.85 : Math.max(0.35, 0.70 - depth * 0.003);
  ctx.globalAlpha = alpha;
  ctx.drawImage(o.cv, -o.ww/2, -o.hh/2, o.ww, o.hh);
  if (graphicsMode === 'high' && !o.shallow){
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.10 * Math.max(0, 1 - weather.rain);
    ctx.fillStyle = '#4ae2ca';
    const cx = Math.sin(time * 1.4 + o.x * 0.03) * 6;
    ctx.fillRect(-o.ww/2 + cx, -o.hh/2, o.ww * 0.8, o.hh);
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.restore(); ctx.globalAlpha = 1;
}
function drawWater(){
  const x = vx0 - 4, y = vy0 - 4, w = vw + 8, h = vh + 8;
  // Deep tropical sapphire ocean base
  ctx.fillStyle = '#0c2b4a';
  ctx.fillRect(x, y, w, h);
  if (weather.rain > 0.02){
    ctx.fillStyle = 'rgba(6, 18, 34, ' + (0.58 * weather.rain) + ')';
    ctx.fillRect(x, y, w, h);
  }
  if (graphicsMode === 'high'){
    // Submerged marine life & wrecks beneath surface
    for (const o of deepObjs) if (!o.shallow && vis(o.x, o.y, o.ww*0.7 + 120)) drawDeep(o);
    for (const c of sharks) if (vis(c.x, c.y, 40) && c.depth > 8) drawSea(c);
    for (const w of whales) if (vis(w.x, w.y, 110) && (w.cycle % 20) < 14) drawSea(w);
  }
}
function drawGlints(){
  if (weather.rain > 0.7) return;
  const sunAlpha = 1 - clamp(weather.rain * 1.4, 0, 1);
  const C = 56, x0 = Math.floor(vx0/C), x1 = Math.ceil((vx0 + vw)/C), y0 = Math.floor(vy0/C), y1 = Math.ceil((vy0 + vh)/C);
  ctx.fillStyle = '#f8ffff';
  for (let cx = x0; cx <= x1; cx++) for (let cy = y0; cy <= y1; cy++){
    const h = frac(Math.sin(cx*127.1 + cy*311.7)*43758.5453);
    if (h > 0.40) continue;
    const a = Math.pow(Math.max(0, Math.sin(time*1.8 + h*60)), 12);
    if (a < 0.04) continue;
    const gx = (cx + frac(h*7.13))*C, gy = (cy + frac(h*13.7))*C;
    ctx.globalAlpha = a * 0.92 * sunAlpha;
    // Crisp diamond facet glint
    ctx.beginPath();
    ctx.moveTo(gx - 3.5, gy); ctx.lineTo(gx, gy - 1.2);
    ctx.lineTo(gx + 3.5, gy); ctx.lineTo(gx, gy + 1.2);
    ctx.closePath(); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function ringPath(pts, cx, cy, k){
  ctx.beginPath();
  const len = pts.length;
  if (!len) return;
  ctx.moveTo(cx + pts[0][0]*k, cy + pts[0][1]*k);
  const step = graphicsMode === 'high' ? 1 : 2;
  for (let i = step; i < len; i += step){
    ctx.lineTo(cx + pts[i][0]*k, cy + pts[i][1]*k);
  }
  ctx.closePath();
}

function drawWake(s){
  const tr = s.trail, len = tr.length;
  if (len < 2 || !vis(s.x, s.y, 400)) return;
  if (graphicsMode !== 'high' && s !== player && Math.hypot(s.x - player.x, s.y - player.y) > 280) return;
  ctx.lineCap = 'round';

  // Crisp V-shaped foaming bow wake lines along port & starboard (NO smoky circles)
  const step = graphicsMode === 'high' ? 1 : 2;
  for (const side of [-1, 1]){
    let started = false;
    ctx.beginPath();
    for (let i = 0; i < len; i += step){
      const p = tr[i], age = (time - p.t)/WAKE_LIFE;
      if (age >= 1) continue;
      const s0 = p.w + age * WAKE_LIFE * 13;
      const nx = -Math.sin(p.a) * side, ny = Math.cos(p.a) * side;
      const px = p.x + nx * s0, py = p.y + ny * s0;
      if (!started){ ctx.moveTo(px, py); started = true; }
      else ctx.lineTo(px, py);
    }
    if (started){
      ctx.strokeStyle = 'rgba(215, 245, 255, 0.44)';
      ctx.lineWidth = 1.8;
      ctx.stroke();
    }
  }

  // Turbulent white water churn streak behind the rudder (clean lines, zero particle lag)
  if (len > 3 && Math.abs(s.v) > 8){
    ctx.beginPath();
    const streakN = Math.min(len, 8);
    for (let i = 0; i < streakN; i++){
      const p = tr[i];
      if (i === 0) ctx.moveTo(p.x, p.y);
      else ctx.lineTo(p.x, p.y);
    }
    ctx.strokeStyle = 'rgba(235, 250, 255, 0.32)';
    ctx.lineWidth = 2.4;
    ctx.stroke();
  }
}

function drawFlag(x0, len, h, col, phase){
  ctx.fillStyle = col; ctx.beginPath();
  const n = 5;
  for (let k = 0; k <= n; k++){ const t = k/n; ctx.lineTo(x0 - t*len, -h/2 + Math.sin(time*9 + phase - t*3)*t*1.2); }
  for (let k = n; k >= 0; k--){ const t = k/n; ctx.lineTo(x0 - t*len, h/2 + Math.sin(time*9 + phase - t*3)*t*1.2); }
  ctx.closePath(); ctx.fill();
}

function drawShip(s, alpha=1, scale=1, tilt=0, sailA=1){
  if (s.dinghy && s.alive){ drawDinghy(s); return; }
  const sp = shipSprite(s), T = s.T, w = sp.cw*scale, h = sp.ch*scale, msts = mastsOf(T);
  const dmg = 1 - clamp(s.hp/T.hp, 0, 1);
  const ang = s.a + Math.sin(time*1.4 + s.id)*(0.018 + dmg*0.03) + tilt;
  // heel outward in turns, and roll, pitch and bob gently on the swell
  const roll = (s.heel || 0) + Math.sin(time*1.15 + s.id*1.7)*0.055*(s.dinghy ? 2 : 1);
  const pitch = Math.sin(time*0.85 + s.id*2.9)*0.04, bobH = Math.sin(time*1.6 + s.id*2.3)*0.7;
  const rgx = -Math.sin(ang), rgy = Math.cos(ang), fwx = Math.cos(ang), fwy = Math.sin(ang);
  const tip = (hh) => { const [lx, ly] = lean(s.x, s.y, hh); return [lx + (rgx*roll + fwx*pitch)*hh, ly + (rgy*roll + fwy*pitch)*hh]; };
  // bigger ships stand taller out of the water and carry taller masts
  const hk = clamp(T.len/46, 0.6, 2.3), hh = Math.min(hk, 1.7);
  const [dx3, dy3] = tip((3.5*hh + bobH)*scale), [dxs, dys] = tip(17*hk*scale), [dxt, dyt] = tip(30*hk*scale);
  const blit = (img, ox, oy, a) => {
    ctx.save(); ctx.translate(s.x + ox, s.y + oy); ctx.rotate(ang);
    ctx.globalAlpha = alpha*a;
    ctx.drawImage(img, -w/2, -h/2, w, h); ctx.restore();
  };
  const spd = Math.abs(s.v)/T.maxv;
  if (s.alive && spd > 0.12 && (graphicsMode === 'high' || s === player)){
    ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.a);
    ctx.strokeStyle = `rgba(255,255,255,${Math.min(0.6, spd*0.8)})`; ctx.lineWidth = 1.2; ctx.lineCap = 'round';
    for (const side of [-1, 1]){
      ctx.beginPath(); ctx.moveTo(T.len/2 + 0.5, 0);
      ctx.quadraticCurveTo(T.len*0.38, side*T.wid*0.55, T.len*0.12, side*(T.wid*0.58 + spd*3)); ctx.stroke();
    }
    ctx.restore();
  }
  if (s.type === 'moored' && s.alive){
    const ca0 = Math.cos(s.a), sa0 = Math.sin(s.a), bx = s.x + ca0*(T.len*0.5 + 7), by = s.y + sa0*(T.len*0.5 + 7);
    ctx.strokeStyle = 'rgba(70,52,30,0.85)'; ctx.lineWidth = 0.7;
    ctx.beginPath(); ctx.moveTo(s.x + ca0*T.len*0.42, s.y + sa0*T.len*0.42); ctx.lineTo(bx + ca0*8, by + sa0*8); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.beginPath(); ctx.arc(bx + ca0*8, by + sa0*8, 2.5 + Math.sin(time*2 + s.id), 0, TAU); ctx.stroke();
  }
  // shadows on the water: the hull close by, the tall sails further out, shifting with 3D roll and pitch
  if (graphicsMode === 'high'){
    blit(sp.hullSil, (5*hh - bobH*0.3) + (rgx*roll)*6*hh, (7*hh - bobH*0.3) + (rgy*roll)*6*hh, 0.45);
    blit(sp.sailSil, 16*hk + (rgx*roll)*24*hk + fwx*pitch*12, 21*hk + (rgy*roll)*24*hk + fwy*pitch*12, 0.26*sailA);
  }
  if (s.fishing){
    const nx = s.x - Math.cos(s.a)*28, ny = s.y - Math.sin(s.a)*28;
    ctx.strokeStyle = 'rgba(235,235,210,0.45)'; ctx.lineWidth = 0.6;
    ctx.beginPath(); ctx.arc(nx, ny, 16, 0, TAU); ctx.stroke();
    ctx.beginPath(); for (let k = -12; k <= 12; k += 4){ ctx.moveTo(nx + k, ny - Math.sqrt(256 - k*k)); ctx.lineTo(nx + k, ny + Math.sqrt(256 - k*k)); } ctx.stroke();
    ctx.beginPath(); ctx.moveTo(s.x - Math.cos(s.a)*12, s.y - Math.sin(s.a)*12); ctx.lineTo(nx, ny); ctx.stroke();
    ctx.fillStyle = '#ff6a3a';
    for (let k = 0; k < 8; k++){ const a = k/8*TAU + time*0.3; ctx.beginPath(); ctx.arc(nx + Math.cos(a)*16, ny + Math.sin(a)*16, 1.3, 0, TAU); ctx.fill(); }
  }
  blit(sp.side, 0, 0, 1);
  blit(sp.hull, dx3, dy3, 1);
  if (s.flash > 0) blit(sp.flash, dx3, dy3, 0.65*clamp(s.flash/0.15, 0, 1));
  // shot holes
  const nh = graphicsMode === 'high' ? Math.min(s.holes.length, Math.ceil(dmg*14)) : (s === player ? Math.min(s.holes.length, 3) : 0);
  if (nh){
    ctx.save(); ctx.translate(s.x + dx3, s.y + dy3); ctx.rotate(ang); ctx.scale(scale, scale); ctx.globalAlpha = alpha;
    for (let i = 0; i < nh; i++){
      const hh = s.holes[i];
      ctx.fillStyle = '#e0b878'; ell(hh.x, hh.y, hh.r*1.5, hh.r*1.1, hh.rot);
      ctx.fillStyle = '#140a04'; ell(hh.x, hh.y, hh.r, hh.r*0.75, hh.rot);
    }
    ctx.restore(); ctx.globalAlpha = 1;
  }
  // masts rise from the deck to the tops
  const ca = Math.cos(ang), sa = Math.sin(ang);
  const pole = (fx, fy, ax, ay, bx, by, wd) => {
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#2e1c0c'; ctx.lineWidth = wd*scale;
    ctx.beginPath(); ctx.moveTo(fx + ax, fy + ay); ctx.lineTo(fx + bx, fy + by); ctx.stroke();
    ctx.strokeStyle = '#8a6036'; ctx.lineWidth = wd*0.4*scale;
    ctx.beginPath(); ctx.moveTo(fx + ax - 0.4, fy + ay); ctx.lineTo(fx + bx - 0.4, fy + by); ctx.stroke();
  };
  ctx.globalAlpha = alpha;
  for (const m of msts){
    const fx = s.x + ca*m.x*scale, fy = s.y + sa*m.x*scale;
    pole(fx, fy, dx3, dy3, dxs, dys, s.type === 'fisher' ? 1.4 : 2.2*Math.sqrt(hk));
  }
  ctx.globalAlpha = 1;
  // Broadside Main quality sails
  blit(sp.sail, dxs, dys, sailA);
  // topmasts above the sails, with a cap
  ctx.globalAlpha = alpha;
  for (const m of msts){
    const fx = s.x + ca*m.x*scale, fy = s.y + sa*m.x*scale;
    pole(fx, fy, dxs, dys, dxt, dyt, s.type === 'fisher' ? 1.1 : 1.6*Math.sqrt(hk));
    if (hk > 0.85 && s.type !== 'fisher'){ // authentic lookout fighting top on masts
      const tx = fx + dxs + (dxt - dxs)*0.42, ty = fy + dys + (dyt - dys)*0.42;
      ctx.fillStyle = 'rgba(0,10,20,0.35)'; ell(tx + 1, ty + 1.2, 3.6*scale, 3.0*scale);
      ctx.fillStyle = '#321e0e'; ell(tx, ty, 3.4*scale, 2.8*scale);
      ctx.fillStyle = '#7a5530'; ell(tx - 0.3, ty - 0.3, 2.4*scale, 1.9*scale);
      ctx.strokeStyle = '#1a0e06'; ctx.lineWidth = 0.5*scale;
      ctx.beginPath(); ctx.ellipse(tx, ty - 0.8*scale, 3.2*scale, 2.6*scale, 0, 0, TAU); ctx.stroke();
    }
    ctx.fillStyle = '#2e1c0c'; ell(fx + dxt, fy + dyt, 1.3*scale, 1.3*scale);
    ctx.fillStyle = '#a07040'; ell(fx + dxt - 0.3, fy + dyt - 0.3, 0.6*scale, 0.6*scale);
    if (m.main && (s === player || s.T.len >= 50)){
      const wx = fx + dxt, wy = fy + dyt;
      const flutter = Math.sin(time*12 + s.id*3)*1.2;
      ctx.save(); ctx.translate(wx, wy); ctx.rotate(wind.a);
      ctx.fillStyle = s === player ? '#ffd23f' : '#ffffff';
      ctx.beginPath(); ctx.moveTo(0, -1.2); ctx.lineTo(13*scale, flutter); ctx.lineTo(0, 1.2); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#2e1c0c'; ctx.lineWidth = 0.5; ctx.stroke();
      ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.arc(0, 0, 1.5*scale, 0, TAU); ctx.fill();
      ctx.restore();
    }
  }
  ctx.globalAlpha = 1;
  if (dmg > 0.15 && (graphicsMode === 'high' || s === player)){
    const rr = mulberry(s.id*7 + 1), ms = mastsOf(T), n = Math.floor(dmg*9);
    ctx.save(); ctx.translate(s.x + dxs, s.y + dys); ctx.rotate(ang); ctx.scale(scale, scale);
    for (let i = 0; i < n; i++){
      const m = ms[i % ms.length], x = m.x + rr()*T.wid*0.35, y = (rr() - 0.5)*m.sw*1.5;
      ctx.fillStyle = `rgba(20,14,10,${0.75*sailA*alpha})`; ell(x, y, 0.8 + rr()*1.5, 0.6 + rr()*1.1, rr()*3);
    }
    ctx.restore();
  }
  ctx.save(); ctx.translate(s.x + dxt*0.4, s.y + dyt*0.4); ctx.rotate(ang); ctx.scale(scale, scale); ctx.globalAlpha = alpha;
  const fx = -T.len/2 - 1;
  const fk = clamp(hk, 1, 1.8);
  if (fk > 1) ctx.scale(fk, fk);
  if (s.type === 'pirate'){ drawFlag(fx/fk, 10, 6, s.surrender ? '#ffffff' : s.lord ? '#7a0a0a' : '#141414', s.id); if (s.lord){ ctx.fillStyle = '#ffd23f'; ctx.fillRect(fx/fk - 6, -1.2, 2.4, 2.4); } }
  else if (s.type === 'treasure'){ drawFlag(fx/fk, 12, 7, '#5a1f7a', s.id); ctx.fillStyle = '#e8c040'; ctx.fillRect(fx/fk - 8, -1.5, 4, 3); }
  else if (s.type === 'trader') drawFlag(fx/fk, 9, 5, '#e8e0c8', s.id);
  else if (s.type === 'navy'){
    if (s.isHunter){
      drawFlag(fx/fk, 12, 7, '#1b1b1b', s.id);
      ctx.fillStyle = '#d82828'; ctx.fillRect(fx/fk - 7, -1, 5, 2);
    } else if (s.faction === 'spanish'){
      drawFlag(fx/fk, 11, 6, '#b81e1e', s.id);
      ctx.fillStyle = '#f0c030'; ctx.fillRect(fx/fk - 8, -1.2, 7, 2.4);
      ctx.fillStyle = '#b81e1e'; ctx.fillRect(fx/fk - 5, -3, 1.2, 6);
    } else {
      drawFlag(fx/fk, 11, 6, '#2a5bd7', s.id);
      ctx.fillStyle = '#fff'; ctx.fillRect(fx/fk - 7, -0.6, 6, 1.2); ctx.fillRect(fx/fk - 4.6, -3, 1.2, 6);
    }
  }
  else if (s === player) drawFlag(fx/fk, 10, 5, look.flag, s.id);
  else if (s.type === 'moored') drawFlag(fx/fk, 9, 5, s.rec.flag, s.id);
  else if (s.type === 'fisher') drawFlag(fx/fk, 5, 3, '#3a7bd5', s.id);
  if (s.type === 'pirate' && !s.surrender && !s.lord){ ctx.fillStyle = '#eee'; ctx.fillRect(fx/fk - 5, -1, 2, 2); }
  ctx.restore(); ctx.globalAlpha = 1;

  // Warm golden amber stern lantern
  if (s.alive && (graphicsMode === 'high' || s === player)){
    const ltx = s.x + dx3 + ca*(-T.len/2 + 1)*scale, lty = s.y + dy3 + sa*(-T.len/2 + 1)*scale;
    const isDark = weather.rain > 0.2;
    const lAlpha = (isDark ? 0.75 : 0.40) * alpha;
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = lAlpha;
    ctx.drawImage(softSprite('#ffb03a'), ltx - 10*scale, lty - 10*scale, 20*scale, 20*scale);
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#ffe28a'; ell(ltx, lty, 1.3*scale, 1.3*scale);
    ctx.globalAlpha = 1;
  }
}

function drawCrate(c){
  const bob = Math.sin(time*2 + c.ph)*1.2, x = c.x, y = c.y + bob;
  ctx.strokeStyle = `rgba(255,255,255,${0.3 + 0.15*Math.sin(time*2 + c.ph)})`; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.ellipse(c.x, c.y + 1, 11 + Math.sin(time*2 + c.ph)*1.5, 9, 0, 0, TAU); ctx.stroke();
  ctx.fillStyle = 'rgba(0,25,50,0.35)'; ell(x + 2, y + 3, 7, 6);
  if (c.kind === 'barrel'){
    const g = ctx.createRadialGradient(x - 2, y - 2, 0.5, x, y, 6.5);
    g.addColorStop(0, '#b07a42'); g.addColorStop(1, '#5a3616');
    ctx.fillStyle = g; ell(x, y, 6.2, 6.2);
    ctx.strokeStyle = '#2e1e0e'; ctx.lineWidth = 0.9;
    ctx.beginPath(); ctx.arc(x, y, 4.2, 0, TAU); ctx.stroke();
    ctx.beginPath(); ctx.arc(x, y, 6, 0, TAU); ctx.stroke();
    ctx.fillStyle = '#2e1e0e'; ell(x, y, 1, 1);
  } else {
    if (c.kind === 'gold'){
      ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.35 + 0.2*Math.sin(time*4 + c.ph);
      ctx.drawImage(softSprite('#ffc83a'), x - 16, y - 16, 32, 32);
      ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    }
    ctx.save(); ctx.translate(x, y); ctx.rotate(c.ph);
    ctx.fillStyle = '#9a6634'; ctx.fillRect(-7, -6, 14, 12);
    ctx.fillStyle = '#b27c44'; ctx.fillRect(-7, -6, 14, 3); ctx.fillRect(-7, -0.5, 14, 2);
    ctx.strokeStyle = '#4a2c12'; ctx.lineWidth = 1; ctx.strokeRect(-7, -6, 14, 12);
    ctx.beginPath(); ctx.moveTo(-7, -6); ctx.lineTo(7, 6); ctx.stroke();
    if (c.kind === 'gold'){
      ctx.fillStyle = '#ffd23f'; for (const [gx,gy] of [[-3,-2],[1,-3],[3,1],[-1,2]]) ell(gx, gy, 1.8, 1.8);
      if (Math.sin(time*6 + c.ph) > 0.6){ ctx.fillStyle = '#fff'; ctx.fillRect(2, -4, 1.5, 1.5); }
    } else { ctx.fillStyle = '#c9d4dc'; ell(-2, -1, 3, 1.1); ell(2, 2, 3, 1.1); }
    ctx.restore();
  }
}
function drawMine(m){

function profW(prof, u){

function drawCreature(sp, x, y, a, ph, alpha, sc){

function drawSea(c){
  if (c.kind === 'whale'){

    }

  } else if (c.kind === 'dolphin'){
    const [ox, oy] = lean(c.x, c.y, -(1 - c.up)*14);

function drawParts(layer){

    const a = p.life/p.max, s = p.size + (1-a)*p.grow;
    if (p.kind === 2){

      ctx.globalAlpha = Math.min(1, a*3);
      if (isHigh){
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillStyle = p.col; ctx.fillRect(-s, -s*0.35, s*2, s*0.7);
        ctx.restore();
